<script>
// ---- src/scenes/01-question.js
/*
 * 01 · Знакомая ситуация — shot s01
 * 60 cut: T 0–4 · 45 cut: T 0–3
 *
 * The cold open. The empty dashed «Мой проект» card sits in the centre from frame 0; open tabs pile
 * up around it (slightly tilted, drifting a few px — restless). The cursor wanders tab → tab and
 * drags a dashed, wobbling route line behind it that never reaches the project. Motion stops, the
 * question «С чего начать?» appears, and the tabs line up onto FILM.ui.G2 exactly at the cut.
 *
 * Layers (back to front)
 *   1. ui.bg
 *   2. project card «Мой проект» (dashed, G2.project) — behind the tabs
 *   3. tabs (ui.tabCard) — scatter + drift → G2
 *   4. route line (dashed, wobble) — the cursor's trail
 *   5. cursor
 *   6. title «С чего начать?» (88 px, centred, baseline 200)
 *
 * End pose (t = dur, and already from the last frame): G2 tabs (tilts included) + G2 project card +
 * the title. No cursor, no route line. s02 starts from exactly this.
 */
(function () {
  'use strict';
  const ID = 's01';
  const U = FILM.ui;
  const L = FILM.lib;
  const P = L.pal;
  const E = L.ease;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, q) => a + (b - a) * q;

  // --- shared with 02-guide.js (verbatim copy there): the empty project card -------------------
  /** the dashed «Мой проект» card; ca = content alpha (caption + plus), k = 0 project look → 1 contour look */
  function drawProject(ctx, x, y, w, h, ca, k) {
    U.card(ctx, x, y, w, h, { r: 24, dashed: true, stroke: L.mix(P.borderHi, P.text3, k || 0), lw: 2 });
    if (ca <= 0) return;
    const cx = x + w / 2;
    const cy = y + h / 2;
    ctx.save();
    ctx.globalAlpha *= ca;
    // a dashed ring with a plus: "nothing here yet"
    ctx.beginPath();
    ctx.arc(cx, cy - 34, 50, 0, Math.PI * 2);
    ctx.setLineDash([7, 7]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = P.borderHi;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(cx - 18, cy - 34);
    ctx.lineTo(cx + 18, cy - 34);
    ctx.moveTo(cx, cy - 52);
    ctx.lineTo(cx, cy - 16);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = P.text3;
    ctx.stroke();
    ctx.restore();
    U.text(ctx, 'Мой проект', cx, cy + 66, { size: 40, weight: 600, color: P.text2, align: 'center', alpha: ca });
    U.text(ctx, 'пусто', cx, cy + 112, { mono: true, size: 22, upper: true, tracking: 3.5, color: P.text3, align: 'center', alpha: ca });
  }

  const G2 = U.G2;

  // scatter offsets from the G2 pose (the "restless" pose before the tabs line up); tilt ≤ 3°
  const SCATTER = [
    { dx: -26, dy: 24, tilt: -0.05 },
    { dx: 20, dy: -18, tilt: 0.05 },
    { dx: -34, dy: 14, tilt: -0.042 },
  ];

  // --- schedules (shot-local seconds) --------------------------------------------------------------
  const SCHED = {
    60: {
      tabIn: [-0.12, 0.4, 0.8], // T 0.0 / 0.4 / 0.8 (first one already on screen at frame 0)
      tabs: 3,
      cursor: [[1.0, 250, 1150], [1.36, 440, 560], [1.6, 880, 336], [1.86, 1470, 470], [2.14, 1440, 736], [2.4, 1282, 676]],
      clicks: [1.38, 1.88, 2.16],
      trailFrom: 1.32,
      title: 2.4, // «С чего начать?»
      settle: [3.4, 0.52], // → exact G2 at 3.92 (last frame 3.96 holds it)
      out: [3.4, 0.42], // cursor + route fade
      tab3Fade: null,
    },
    45: {
      tabIn: [-0.12, 0.25, null],
      tabs: 2,
      cursor: [[0.15, 250, 1150], [0.46, 440, 560], [0.66, 880, 336], [0.86, 1470, 470], [1.04, 1262, 700]],
      clicks: [0.48, 0.88],
      trailFrom: 0.44,
      title: 1.0,
      settle: [2.2, 0.72], // → exact G2 at 2.92
      out: [2.2, 0.5],
      tab3Fade: [2.2, 0.7], // the third G2 tab fades in so the boundary pose matches
    },
  };

  /** the cursor's trail, resampled at equal arc length from its start (stable prefix → stable wobble) */
  function trail(keys, t0, t1) {
    const raw = [];
    const n = Math.max(1, Math.floor((t1 - t0) / 0.02));
    for (let i = 0; i <= n; i++) raw.push(U.cursorPath(keys, t0 + (i / n) * (t1 - t0)));
    const D = 22;
    const out = [raw[0].slice()];
    let acc = 0;
    for (let i = 1; i < raw.length; i++) {
      let ax = raw[i - 1][0];
      let ay = raw[i - 1][1];
      const bx = raw[i][0];
      const by = raw[i][1];
      let seg = Math.hypot(bx - ax, by - ay);
      while (acc + seg >= D) {
        const q = (D - acc) / seg;
        ax = lerp(ax, bx, q);
        ay = lerp(ay, by, q);
        out.push([ax, ay]);
        seg = Math.hypot(bx - ax, by - ay);
        acc = 0;
      }
      acc += seg;
    }
    const last = raw[raw.length - 1];
    const z = out[out.length - 1];
    if (Math.hypot(last[0] - z[0], last[1] - z[1]) > 0.5) out.push(last.slice());
    return out;
  }

  function drawTab(ctx, i, T, t, S, settle) {
    const g = G2.tabs[i];
    const sc = SCATTER[i];
    const amp = 1 - settle;
    // restless drift: a few px and a hair of tilt, fading out as the tabs line up
    const dx = (sc.dx + 6 * L.noise1(T * 0.55 + i * 7.3, 1101 + i)) * amp;
    const dy = (sc.dy + 5 * L.noise1(T * 0.5 + i * 3.1, 1201 + i)) * amp;
    const tilt = lerp(sc.tilt + 0.006 * L.noise1(T * 0.45 + i, 1301 + i), g.tilt, settle);
    let a = 1;
    let s = 1;
    let rise = 0;
    const t0 = S.tabIn[i];
    if (t0 != null) {
      const p = clamp((t - t0) / 0.45);
      a = E.outCubic(clamp((t - t0) / 0.3));
      s = 0.9 + 0.1 * E.outBack(p);
      rise = 26 * (1 - E.outCubic(p));
    } else if (S.tab3Fade) {
      const p = clamp((t - S.tab3Fade[0]) / S.tab3Fade[1]);
      a = E.outCubic(p);
      rise = 16 * (1 - E.outCubic(p));
    }
    if (a <= 0) return;
    const x = g.x + dx;
    const y = g.y + dy + rise;
    ctx.save();
    if (s !== 1) {
      ctx.translate(x + g.w / 2, y + g.h / 2);
      ctx.scale(s, s);
      ctx.translate(-(x + g.w / 2), -(y + g.h / 2));
    }
    U.tabCard(ctx, x, y, g.w, g.h, { title: g.title, kind: g.kind, fav: g.fav, tilt, alpha: a });
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const T = info.T;
      const cut = U.cut(info);
      const S = SCHED[cut];

      // 1. background
      U.bg(ctx, {});

      // 2. the empty project, present from frame 0
      const pr = G2.project;
      drawProject(ctx, pr.x, pr.y, pr.w, pr.h, 1, 0);

      // 3. tabs
      const settle = E.inOutCubic(clamp((t - S.settle[0]) / S.settle[1]));
      for (let i = 0; i < 3; i++) {
        if (i >= S.tabs && !S.tab3Fade) continue;
        drawTab(ctx, i, T, t, S, settle);
      }

      // 4–5. route trail + cursor (the lost search), fading out as the tabs line up
      const out = 1 - E.inOutCubic(clamp((t - S.out[0]) / S.out[1]));
      if (out > 0) {
        const keys = S.cursor;
        if (t > S.trailFrom + 0.02) {
          const pts = trail(keys, S.trailFrom, Math.min(t, keys[keys.length - 1][0]));
          if (pts.length >= 2) {
            const calm = clamp((t - S.title) / 0.6);
            U.route(ctx, pts, { dash: true, wobble: lerp(8, 5, calm), T, width: 4, per: 3, alpha: out * 0.95 });
          }
        }
        const [cx, cy] = U.cursorPath(keys, t);
        let press = 0;
        for (const c of S.clicks) if (t >= c && t < c + 0.3) press = (t - c) / 0.3;
        U.cursor(ctx, cx, cy, { press, alpha: out });
      }

      // 6. the question
      U.title(ctx, 'С чего начать?', 960, 200, { size: 88, align: 'center', a: U.appear(t, S.title, 0.45), rise: 26 });
    },
  });
})();

</script>
<script>
// ---- src/scenes/02-guide.js
/*
 * 02 · Появляется понятная точка входа — shot s02
 * 60 cut: T 4–9 · 45 cut: T 3–5
 *
 * Starts on exactly the s01 end pose (FILM.ui.G2 tabs + the empty «Мой проект» card + the question).
 * The question fades, the tabs and the project card align and shed detail into three dashed contour
 * cards on G1 (CARD_ROW). Brand, title and author assemble in the title band; the route line draws
 * straight and calm under them, then thins. The route glyphs draw on inside the contour cards.
 *
 * Mapping G2 → G1: tab «Видео про AI» → card 0 · «Мой проект» → card 1 · «Новый инструмент» and
 * «Сохранить на потом» → card 2 (the note tab dissolves into it).
 *
 * Layers (back to front)
 *   1. ui.bg
 *   2. project card → contour card 1
 *   3. tabs → contour cards 0 / 2 (tab content fades while the contour fades in)
 *   4. brand · title · author · route line
 *   5. the s01 question, fading out over the first frames
 *
 * End pose (60 at t 5, 45 at t 2): brand + title (+ author and a thin route line in 60) + three dashed
 * contour cards with glyphs on CARD_ROW (no labels, no index). s03 starts from exactly this.
 */
(function () {
  'use strict';
  const ID = 's02';
  const U = FILM.ui;
  const L = FILM.lib;
  const P = L.pal;
  const E = L.ease;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, q) => a + (b - a) * q;

  // --- shared with 01-question.js (verbatim copy): the empty project card ------------------------
  /** the dashed «Мой проект» card; ca = content alpha (caption + plus), k = 0 project look → 1 contour look */
  function drawProject(ctx, x, y, w, h, ca, k) {
    U.card(ctx, x, y, w, h, { r: 24, dashed: true, stroke: L.mix(P.borderHi, P.text3, k || 0), lw: 2 });
    if (ca <= 0) return;
    const cx = x + w / 2;
    const cy = y + h / 2;
    ctx.save();
    ctx.globalAlpha *= ca;
    // a dashed ring with a plus: "nothing here yet"
    ctx.beginPath();
    ctx.arc(cx, cy - 34, 50, 0, Math.PI * 2);
    ctx.setLineDash([7, 7]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = P.borderHi;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(cx - 18, cy - 34);
    ctx.lineTo(cx + 18, cy - 34);
    ctx.moveTo(cx, cy - 52);
    ctx.lineTo(cx, cy - 16);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = P.text3;
    ctx.stroke();
    ctx.restore();
    U.text(ctx, 'Мой проект', cx, cy + 66, { size: 40, weight: 600, color: P.text2, align: 'center', alpha: ca });
    U.text(ctx, 'пусто', cx, cy + 112, { mono: true, size: 22, upper: true, tracking: 3.5, color: P.text3, align: 'center', alpha: ca });
  }

  const G2 = U.G2;
  const CR = U.CARD_ROW;
  const TAB_EAR = 50; // ui.tabCard: the card body starts 50 px below the tab's y
  const TAB_TO_CARD = [0, 2, 2];

  const SCHED = {
    60: {
      qOut: 0.3, // the s01 question fades
      morph: 0.7, // tabs → contour cards (inOutCubic)
      brand: 0.7,
      title: 1.0,
      titleText: 'Бесплатный гид по AI-разработке',
      accent: 'AI-разработке',
      author: 1.4,
      route: [1.3, 0.9], // draws x 560 → 1360 at y 395
      thin: [2.3, 0.5], // … then settles to a thin calm line
      glyphs: [2.4, 3.1, 3.8], // T 6.4 / 7.1 / 7.8
      glyphDur: 0.5,
    },
    45: {
      qOut: 0.2,
      morph: 0.6,
      brand: 0.4,
      title: 0.55,
      titleText: 'Бесплатный гид',
      accent: null,
      author: null,
      route: null,
      thin: null,
      glyphs: [1.0, 1.2, 1.4], // T 4.0 / 4.2 / 4.4
      glyphDur: 0.45,
    },
  };

  /** a contour route card, optionally rotated about the centre of the rect (tx, ty, tw, th) */
  function contour(ctx, i, x, y, w, h, alpha, draw, tilt, pivot) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha *= alpha;
    if (tilt) {
      ctx.translate(pivot[0], pivot[1]);
      ctx.rotate(tilt);
      ctx.translate(-pivot[0], -pivot[1]);
    }
    U.routeCard(ctx, i, x, y, w, h, { contour: true, label: 'none', index: false, draw });
    // the kit's contour stroke (P.border, 1.5 px) vanishes on a phone: restate it brighter
    U.card(ctx, x, y, w, h, { r: 24, dashed: true, stroke: P.text3, lw: 2 });
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const cut = U.cut(info);
      const S = SCHED[cut];

      // 1. background
      U.bg(ctx, {});

      const u = clamp(t / S.morph); // linear morph progress
      const m = E.inOutCubic(u);
      const glyphP = (i) => E.inOutSine(clamp((t - S.glyphs[i]) / S.glyphDur));

      if (u < 1) {
        // 2. project → contour card 1
        const pr = G2.project;
        const px = lerp(pr.x, CR.x[1], m);
        const py = lerp(pr.y, CR.y, m);
        const pw = lerp(pr.w, CR.w, m);
        const ph = lerp(pr.h, CR.h, m);
        drawProject(ctx, px, py, pw, ph, 1 - E.inOutCubic(clamp(u / 0.55)), m);

        // 3. tabs → contour cards 0 and 2
        const contentA = 1 - E.inOutCubic(clamp(u / 0.8)); // tab content fades out
        const lineA = E.inOutCubic(clamp((u - 0.15) / 0.85)); // the contour fades in
        for (let i = 0; i < 3; i++) {
          const g = G2.tabs[i];
          const c = TAB_TO_CARD[i];
          const x = lerp(g.x, CR.x[c], m);
          const y = lerp(g.y, CR.y - TAB_EAR, m);
          const w = lerp(g.w, CR.w, m);
          const h = lerp(g.h, CR.h + TAB_EAR, m);
          const tilt = lerp(g.tilt, 0, m);
          const pivot = [x + w / 2, y + h / 2];
          if (i !== 2) contour(ctx, c, x, y + TAB_EAR, w, h - TAB_EAR, lineA, 0, tilt, pivot);
          const a = i === 2 ? 1 - E.inOutCubic(clamp(u / 0.6)) : contentA;
          if (a > 0) U.tabCard(ctx, x, y, w, h, { title: g.title, kind: g.kind, fav: g.fav, tilt, alpha: a });
        }
      } else {
        // the row of contour cards on G1, glyphs drawing on
        for (let i = 0; i < 3; i++) contour(ctx, i, CR.x[i], CR.y, CR.w, CR.h, 1, glyphP(i), 0, null);
      }

      // 4. title band: brand, title, author, the calm route line
      const ba = U.appear(t, S.brand, 0.4);
      if (ba > 0) {
        ctx.save();
        ctx.translate(0, (1 - ba) * 20);
        U.brand(ctx, 960, 150, { size: 64, align: 'center', alpha: ba });
        ctx.restore();
      }
      U.title(ctx, S.titleText, 960, 290, { size: 76, align: 'center', accent: S.accent || undefined, a: U.appear(t, S.title, 0.4), rise: 24 });
      if (S.author != null) {
        const aa = U.appear(t, S.author, 0.4);
        if (aa > 0) {
          ctx.save();
          ctx.translate(0, (1 - aa) * 16);
          U.author(ctx, 960, 360, { align: 'center', size: 48, alpha: aa });
          ctx.restore();
        }
      }
      if (S.route) {
        const to = E.inOutCubic(clamp((t - S.route[0]) / S.route[1]));
        const th = E.inOutCubic(clamp((t - S.thin[0]) / S.thin[1]));
        if (to > 0) U.route(ctx, [[560, 395], [1360, 395]], { straight: true, to, width: lerp(4, 2, th), glow: lerp(1, 0.4, th), alpha: lerp(1, 0.75, th) });
      }

      // 5. the s01 question, carried over the cut and faded
      const qa = 1 - E.inOutCubic(clamp(t / S.qOut));
      if (qa > 0) {
        ctx.save();
        ctx.globalAlpha *= qa;
        U.title(ctx, 'С чего начать?', 960, 200, { size: 88, align: 'center', a: 1 });
        ctx.restore();
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/03-routes.js
/*
 * 03 · Выбор из трёх задач — shot s03
 * 60 cut: T 9–12 · 45 cut: T 5–7
 *
 * Starts on exactly the s02 end pose. The three contour cards on G1 fill one by one and get their
 * short labels (three tactile accents); the title swaps to «Три задачи. Три маршрута»; the route
 * line runs along the card tops linking 1 → 2 → 3, its head gliding slowly through the hold. Then
 * card 0 grows into G3 (label → the full route name, glow → 1) while everything else recedes.
 *
 * Layers (back to front)
 *   1. ui.bg
 *   2. cards 1 and 2 (contour → filled → dim and slide back)
 *   3. card 0 (contour → filled → G3)
 *   4. route line along the tops (+ the s02 thin line fading out)
 *   5. brand · titles · author (fading)
 *
 * End pose (from the last frames, and at t = dur): ONLY ui.bg + ui.routeCard(ctx, 0, G3.x, G3.y,
 * G3.w, G3.h, { label: 'name', glow: 1 }). s04 starts from exactly this.
 */
(function () {
  'use strict';
  const ID = 's03';
  const U = FILM.ui;
  const L = FILM.lib;
  const P = L.pal;
  const E = L.ease;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, q) => a + (b - a) * q;

  const CR = U.CARD_ROW;
  const G3 = U.G3;

  const SCHED = {
    60: {
      prevTitle: 'Бесплатный гид по AI-разработке',
      prevAccent: 'AI-разработке',
      author: true,
      thinLine: true, // s02 ends with a thin route line under the author
      oldOut: [0.0, 0.2],
      newIn: 0.12, // appear 0.3 s → reads by T 9.4
      authorOut: [0.0, 0.3],
      fill: [0.0, 0.2, 0.4], // T 9.0 / 9.2 / 9.4
      fillDur: 0.3,
      route: [0.3, 0.5, 2.05], // draw-in start, draw-in length, glide end
      routeOut: [2.05, 0.3],
      move: [2.2, 0.72], // card 0 → G3, lands at t 2.92 (last frame 2.96 holds it)
      label: [2.25, 0.5], // 'short' → 'name'
      recede: [2.2, 0.5], // cards 1/2, brand, title, route
    },
    45: {
      prevTitle: 'Бесплатный гид',
      prevAccent: null,
      author: false,
      thinLine: false,
      oldOut: [0.0, 0.15],
      newIn: 0.08,
      authorOut: null,
      fill: [0.0, 0.1, 0.2],
      fillDur: 0.25,
      route: [0.2, 0.4, 1.3],
      routeOut: [1.3, 0.25],
      move: [1.4, 0.52], // lands at t 1.92
      label: [1.42, 0.4],
      recede: [1.4, 0.35],
    },
  };

  // --- the s02 contour card (verbatim from 02-guide.js) ------------------------------------------
  function contour(ctx, i, x, y, w, h, alpha, draw, tilt, pivot) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha *= alpha;
    if (tilt) {
      ctx.translate(pivot[0], pivot[1]);
      ctx.rotate(tilt);
      ctx.translate(-pivot[0], -pivot[1]);
    }
    U.routeCard(ctx, i, x, y, w, h, { contour: true, label: 'none', index: false, draw });
    // the kit's contour stroke (P.border, 1.5 px) vanishes on a phone: restate it brighter
    U.card(ctx, x, y, w, h, { r: 24, dashed: true, stroke: P.text3, lw: 2 });
    ctx.restore();
  }

  /** filled route card with a tactile pop (scale about its centre) */
  function filled(ctx, i, x, y, w, h, o, alpha, pop) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha *= alpha;
    if (pop) {
      ctx.translate(x + w / 2, y + h / 2);
      ctx.scale(1 + pop, 1 + pop);
      ctx.translate(-(x + w / 2), -(y + h / 2));
    }
    U.routeCard(ctx, i, x, y, w, h, o);
    ctx.restore();
  }

  /** the label zone of a route card (inside its rounded body; below the glyph tile) */
  function labelClip(ctx, x, y, w, h) {
    const gs = Math.min(76, w * 0.16);
    // edges snapped to device pixels: a partially covered clip row would darken (the overlay's
    // drop shadow shows through its partial fill)
    const S = FILM.S || 1;
    const px = (v) => Math.round(v * S) / S;
    const x0 = px(x + 6);
    const x1 = px(x + w - 6);
    const y0 = px(y + 44 + gs * 1.24 + 8);
    const y1 = px(y + h - 6);
    ctx.beginPath();
    ctx.rect(x0, y0, x1 - x0, y1 - y0);
    ctx.clip();
  }

  // the route along the card tops: 1 → 2 → 3, dipping onto each card's top edge
  const TOP_ROUTE = [
    [CR.x[0] + CR.w / 2, CR.y],
    [(CR.x[0] + CR.w + CR.x[1]) / 2, CR.y - 34],
    [CR.x[1] + CR.w / 2, CR.y],
    [(CR.x[1] + CR.w + CR.x[2]) / 2, CR.y - 34],
    [CR.x[2] + CR.w / 2, CR.y],
  ];

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const t = clamp(tIn, 0, info.dur);
      const cut = U.cut(info);
      const S = SCHED[cut];

      // 1. background
      U.bg(ctx, {});

      const mv = E.inOutCubic(clamp((t - S.move[0]) / S.move[1]));
      if (mv >= 1) {
        // the G3 contract pose, nothing else
        U.routeCard(ctx, 0, G3.x, G3.y, G3.w, G3.h, { label: 'name', glow: 1 });
        return;
      }
      const rc = E.inOutCubic(clamp((t - S.recede[0]) / S.recede[1])); // 0 → 1 as the rest recedes

      // 2. cards 1 and 2
      const fillK = (i) => clamp((t - S.fill[i]) / S.fillDur);
      for (let i = 2; i >= 1; i--) {
        const f = fillK(i);
        const fe = E.outCubic(f);
        ctx.save();
        if (rc > 0) {
          // dim and slide back: shrink a little and drift right, fading out
          const sc = 1 - 0.06 * rc;
          const cx = CR.x[i] + CR.w / 2 + 70 * rc * i;
          const cy = CR.y + CR.h / 2 + 10 * rc;
          ctx.translate(cx, cy);
          ctx.scale(sc, sc);
          ctx.translate(-(CR.x[i] + CR.w / 2), -(CR.y + CR.h / 2));
          ctx.globalAlpha *= 1 - rc;
        }
        contour(ctx, i, CR.x[i], CR.y, CR.w, CR.h, 1 - fe, 1, 0, null);
        filled(ctx, i, CR.x[i], CR.y, CR.w, CR.h, { label: 'short', dim: rc }, fe, 0.022 * Math.sin(Math.PI * f));
        ctx.restore();
      }

      // 3. card 0: fill, then grow into G3
      {
        const f = fillK(0);
        const fe = E.outCubic(f);
        const x = lerp(CR.x[0], G3.x, mv);
        const y = lerp(CR.y, G3.y, mv);
        const w = lerp(CR.w, G3.w, mv);
        const h = lerp(CR.h, G3.h, mv);
        if (t < S.move[0]) {
          contour(ctx, 0, CR.x[0], CR.y, CR.w, CR.h, 1 - fe, 1, 0, null);
          filled(ctx, 0, CR.x[0], CR.y, CR.w, CR.h, { label: 'short' }, fe, 0.022 * Math.sin(Math.PI * f));
        } else {
          const glow = mv;
          const lq = E.inOutCubic(clamp((t - S.label[0]) / S.label[1]));
          U.routeCard(ctx, 0, x, y, w, h, { label: 'name', glow });
          if (lq < 1) {
            // label swap inside the label zone only (clipped: no double shadow, exact G3 when done):
            // first the short label fades to an empty card, then the name fades up
            const aNone = 1 - clamp(lq * 2 - 1);
            const aShort = 1 - clamp(lq * 2);
            ctx.save();
            labelClip(ctx, x, y, w, h);
            ctx.globalAlpha *= aNone;
            U.routeCard(ctx, 0, x, y, w, h, { label: 'none', glow });
            ctx.restore();
            if (aShort > 0) {
              ctx.save();
              labelClip(ctx, x, y, w, h);
              ctx.globalAlpha *= aShort;
              U.routeCard(ctx, 0, x, y, w, h, { label: 'short', glow });
              ctx.restore();
            }
          }
        }
      }

      // 4. route lines
      if (S.thinLine) {
        const a = 1 - E.inOutCubic(clamp(t / 0.3));
        if (a > 0) U.route(ctx, [[560, 395], [1360, 395]], { straight: true, to: 1, width: 2, glow: 0.4, alpha: 0.75 * a });
      }
      {
        const [r0, rd, r1] = S.route;
        const drawIn = E.outCubic(clamp((t - r0) / rd));
        const glide = E.inOutSine(clamp((t - r0 - rd) / (r1 - r0 - rd)));
        const to = 0.42 * drawIn + 0.58 * glide;
        const ra = 1 - E.inOutCubic(clamp((t - S.routeOut[0]) / S.routeOut[1]));
        if (to > 0 && ra > 0) U.route(ctx, TOP_ROUTE, { to, width: 3, glow: 0.8, alpha: ra });
      }

      // 5. title band
      const ta = 1 - rc;
      if (ta > 0) {
        U.brand(ctx, 960, 150, { size: 64, align: 'center', alpha: ta });
        const oa = 1 - E.inOutCubic(clamp((t - S.oldOut[0]) / S.oldOut[1]));
        if (oa > 0) {
          ctx.save();
          ctx.globalAlpha *= oa;
          U.title(ctx, S.prevTitle, 960, 290, { size: 76, align: 'center', accent: S.prevAccent || undefined, a: 1 });
          ctx.restore();
        }
        ctx.save();
        ctx.globalAlpha *= ta;
        U.title(ctx, 'Три задачи. Три маршрута', 960, 290, { size: 76, align: 'center', accent: 'Три маршрута', a: U.appear(t, S.newIn, 0.3), rise: 20 });
        ctx.restore();
        if (S.author) {
          const aa = 1 - E.inOutCubic(clamp((t - S.authorOut[0]) / S.authorOut[1]));
          if (aa > 0) U.author(ctx, 960, 360, { align: 'center', size: 48, alpha: aa * ta });
        }
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/04-agent.js
/*
 * 04 · Настроить агента под свою задачу — shot 's04'
 * 60 cut: T 12–18 · 45 cut: T 7–13 (both 6 s; the second half shares local times).
 *
 * Starts on G3 (route card 0, label 'name', glow 1) and ends on G4 (one empty accent contour).
 *
 * Beats (local t, 60 cut / 45 cut where they differ):
 *   0.10–0.92   the card's name flies up and becomes the title; the card body grows into the brief
 *   1.2 / 1.0   brief values type in (Задача, Правила, Проверка)
 *   3.0 / 2.4   the separate window «Твой проект» appears on the right
 *   3.2 / 2.55  the route line hands the brief to the window (a «бриф» token rides its head)
 *   4.2 / 3.4   the broken button in the preview is fixed (grey, misaligned, overflowing → accent, aligned)
 *   4.1–4.8     the cursor comes in from off-frame; click 4.9 (press 0.3 s)
 *   5.2         «Проверено» (only after the click) · 5.25 caption pill
 *   5.45–6.0    everything else fades; the window frame shrinks into the G4 contour
 *
 * Layers back to front: bg · brief (morphing card) · window + preview · route line + token · title ·
 * «Проверено» · caption · cursor · G4 contour.
 */
(function () {
  'use strict';

  const ID = 's04';
  const L = FILM.lib;
  const P = L.pal;
  const E = L.ease;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const A = (c, a) => L.rgba(c, a);

  // ---------------------------------------------------------------------------
  // Geometry
  // ---------------------------------------------------------------------------
  const BRIEF = { x: 120, y: 300, w: 740, h: 464 };
  const WIN = { x: 1020, y: 300, w: 780, h: 464 };
  // phone-shaped preview inside the window body (body starts at WIN.y + 52)
  const PHONE = { x: 1090, y: 374, w: 300, h: 368 };
  const BTN_OK = { x: 1114, y: 660, w: 252, h: 60 };
  const BTN_BAD = { x: 1300, y: 676, w: 96, h: 46, rot: -0.06 };
  const CLICK = [1262, 700];
  const ROUTE = [[866, 492], [944, 498], [1000, 584], [1086, 602]];
  const CHECK_PILL = { x: 1596, y: 520 };

  // ---------------------------------------------------------------------------
  // Schedules (local seconds)
  // ---------------------------------------------------------------------------
  const COMMON = {
    fly: 0.1, flyDur: 0.72, flyStagger: 0,
    morph: 0.22, morphDur: 0.72,
    brief: 0.62, labels: 0.86,
    kicker: 0.55,
    cursorIn: 4.1, cursorAt: 4.8, click: 4.9,
    checked: 5.2, caption: 5.22,
    out: 5.5, shrink: 5.44,
  };
  const SCHED = {
    60: Object.assign({}, COMMON, { type: [[1.2, 0.55], [1.8, 0.55], [2.4, 0.55]], win: 3.0, route: 3.2, routeDur: 0.72, fix: 4.2 }),
    45: Object.assign({}, COMMON, { type: [[1.0, 0.4], [1.5, 0.4], [2.0, 0.4]], win: 2.4, route: 2.55, routeDur: 0.62, fix: 3.4 }),
  };

  // ---------------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------------

  /** The G4 contour: one rounded rect, accent 2 px stroke, soft glow, empty. (Same helper in 05.) */
  function g4Contour(ctx, x, y, w, h, r, a) {
    if (a <= 0) return;
    const U = FILM.ui;
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.shadowColor = A(P.accent, 0.75);
    ctx.shadowBlur = 26 * FILM.S;
    U.rrect(ctx, x, y, w, h, r);
    ctx.lineWidth = 2;
    ctx.strokeStyle = P.accent;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.stroke();
    ctx.restore();
  }

  /** Word layout of the route name: start (inside the G3 card) and end (title position). */
  function words(ctx) {
    const U = FILM.ui;
    const G = U.G3;
    const R = U.ROUTES[0];
    const gs = Math.min(76, G.w * 0.16);
    const sOpt = { size: 40, weight: 600 };
    const lines = U.wrap(ctx, R.name, G.w - 88, sOpt);
    const tx = G.x + 44;
    const ty = G.y + 44 + gs * 1.24 + 70;
    const tr1 = -0.02 * U.TITLE.size;
    const eOpt = { size: U.TITLE.size, weight: 600, tracking: tr1 };
    const out = [];
    let full = '';
    lines.forEach((ln, k) => {
      let pre = '';
      ln.split(' ').forEach((wd) => {
        const sx = tx + (pre ? U.measure(ctx, pre + ' ', sOpt) : 0);
        const ex = U.TITLE.x + (full ? U.measure(ctx, full + ' ', eOpt) : 0);
        out.push({ w: wd, sx, sy: ty + k * 48, ex, ey: U.TITLE.y });
        pre = pre ? pre + ' ' + wd : wd;
        full = full ? full + ' ' + wd : wd;
      });
    });
    return out;
  }

  /** the mini app inside the window: a phone-width screen with a skeleton product and a pay button */
  function preview(ctx, fix, hover, press) {
    const U = FILM.ui;
    const ph = PHONE;
    U.card(ctx, ph.x, ph.y, ph.w, ph.h, { r: 30, fill: P.card, shadow: 0 });
    U.skeleton(ctx, ph.x + ph.w / 2 - 34, ph.y + 16, 68, 1, { h: 8, color: P.borderHi });
    U.card(ctx, ph.x + 24, ph.y + 40, ph.w - 48, 128, { r: 16, fill: P.cardHi, shadow: 0 });
    U.skeleton(ctx, ph.x + 24 + 20, ph.y + 72, 90, 1, { h: 12, color: P.borderHi });
    U.skeleton(ctx, ph.x + 24 + 20, ph.y + 98, 150, 1, { h: 12, color: P.border });
    U.skeleton(ctx, ph.x + 24, ph.y + 192, ph.w - 72, 2, { h: 14, gap: 28, last: 0.66 });
    U.skeleton(ctx, ph.x + 24, ph.y + 254, 92, 1, { h: 18, color: A(P.accent, 0.35) });

    // broken button: dull grey, off the grid, sticking out of the screen, label overflowing
    const bad = 1 - fix;
    if (bad > 0) {
      const b = BTN_BAD;
      const q = E.inOutCubic(fix);
      const x = lerp(b.x, BTN_OK.x, q);
      const y = lerp(b.y, BTN_OK.y, q);
      const w = lerp(b.w, BTN_OK.w, q);
      const h = lerp(b.h, BTN_OK.h, q);
      ctx.save();
      ctx.globalAlpha *= clamp(bad * 1.6);
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(b.rot * (1 - q));
      ctx.translate(-(x + w / 2), -(y + h / 2));
      U.card(ctx, x, y, w, h, { r: 8, fill: P.border, stroke: P.borderHi, shadow: 0 });
      U.text(ctx, 'Оплатить', x + 14, y + h / 2 + 9, { size: 26, weight: 600, color: P.text3 });
      ctx.restore();
    }
    // fixed button: accent, full width, aligned with the content column
    if (fix > 0) {
      const b = BTN_OK;
      const q = E.inOutCubic(fix);
      ctx.save();
      ctx.globalAlpha *= clamp((fix - 0.3) / 0.7);
      const w = lerp(BTN_BAD.w, b.w, q);
      const x = lerp(BTN_BAD.x, b.x, q);
      const y = lerp(BTN_BAD.y, b.y, q);
      const h = lerp(BTN_BAD.h, b.h, q);
      U.button(ctx, x, y, w, h, 'Оплатить', { size: 26, r: 14, hover, press });
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------------------
  // Scene
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const U = FILM.ui;
      const t = clamp(tIn, 0, info.dur);
      const S = SCHED[U.cut(info)];
      const G3 = U.G3;
      const G4 = U.G4;

      U.bg(ctx, {});

      // frame 0: exactly the G3 pose s03 ends on
      if (t <= 0) {
        U.routeCard(ctx, 0, G3.x, G3.y, G3.w, G3.h, { label: 'name', glow: 1 });
        return;
      }

      const out = 1 - U.k(t, S.out, 0.3, 'inOutCubic'); // everything but the window fades
      const shrink = U.k(t, S.shrink, 0.48, 'inOutCubic'); // window → G4

      // 1 · brief (grows out of the route card) ------------------------------
      if (out > 0) {
        ctx.save();
        ctx.globalAlpha *= out;
        const m = U.k(t, S.morph, S.morphDur, 'inOutCubic');
        const ba = U.k(t, S.brief, 0.4, 'outCubic');
        if (ba < 1) {
          const x = lerp(G3.x, BRIEF.x, m);
          const y = lerp(G3.y, BRIEF.y, m);
          const w = lerp(G3.w, BRIEF.w, m);
          const h = lerp(G3.h, BRIEF.h, m);
          U.card(ctx, x, y, w, h, { r: lerp(24, 20, m), glow: 1 - m, fill: L.mix(P.card, P.cardHi, m) });
          const ga = 1 - U.k(t, 0.04, 0.3, 'outCubic');
          if (ga > 0) {
            const gs = Math.min(76, G3.w * 0.16);
            U.glyph(ctx, 'agent', G3.x + 44 + gs * 0.62, G3.y + 44 + gs * 0.62, gs, { alpha: ga });
            U.text(ctx, '01', x + w - 40, y + 70, { mono: true, size: 22, color: P.text3, align: 'right', alpha: ga });
          }
        }
        if (ba > 0) {
          const rows = S.type.map(([a, d]) => U.k(t, a, d, 'linear'));
          let focus = -1;
          S.type.forEach(([a, d], i) => { if (t >= a - 0.05 && t < a + d + 0.12) focus = i; });
          const hand = U.k(t, S.route - 0.1, 0.3, 'outCubic') * (1 - U.k(t, S.route + S.routeDur + 0.2, 0.5));
          U.briefCard(ctx, BRIEF.x, BRIEF.y, BRIEF.w, BRIEF.h, {
            rows, focus, T: info.T, labels: U.k(t, S.labels, 0.4, 'outCubic'), alpha: ba, glow: 0.6 * hand,
          });
        }
        ctx.restore();
      }

      // 2 · the separate window «Твой проект» + preview ------------------------
      const wa = U.appear(t, S.win, 0.4);
      const fix = U.k(t, S.fix, 0.5, 'linear');
      const checked = U.appear(t, S.checked, 0.35);
      if (wa > 0 && shrink < 1) {
        const hover = U.k(t, S.cursorAt - 0.2, 0.25, 'outCubic');
        const press = U.k(t, S.click, 0.3, 'linear');
        ctx.save();
        // map the window rect onto the shrinking rect
        const rx = lerp(WIN.x, G4.x, shrink);
        const ry = lerp(WIN.y, G4.y, shrink);
        const rw = lerp(WIN.w, G4.w, shrink);
        const rh = lerp(WIN.h, G4.h, shrink);
        ctx.translate(rx, ry);
        ctx.scale(rw / WIN.w, rh / WIN.h);
        ctx.translate(-WIN.x, -WIN.y + (1 - wa) * 28);
        ctx.globalAlpha *= wa * (1 - U.k(t, S.shrink, 0.34, 'inOutCubic'));
        U.window(ctx, WIN.x, WIN.y, WIN.w, WIN.h, { title: 'Твой проект', glow: checked * out });
        ctx.globalAlpha *= 1 - U.k(t, S.shrink, 0.2, 'linear');
        U.text(ctx, 'телефон · 375 px', PHONE.x + PHONE.w + 58, PHONE.y + 36, { mono: true, size: 20, color: P.text3 });
        preview(ctx, fix, hover, press);
        ctx.restore();
      }

      // 3 · route line: brief → window, with the brief token on its head -------
      if (out > 0) {
        const rp = U.k(t, S.route, S.routeDur, 'inOutCubic');
        if (rp > 0) {
          const settle = U.k(t, S.route + S.routeDur, 0.5, 'inOutCubic');
          const head = U.route(ctx, ROUTE, { to: rp, alpha: out * (1 - 0.45 * settle), head: settle < 1, width: 4 });
          const ta = U.k(t, S.route, 0.15, 'outCubic') * (1 - U.k(t, S.route + S.routeDur - 0.12, 0.22, 'inOutCubic'));
          if (head && ta > 0) {
            U.pill(ctx, head.x, head.y - 50, 'бриф', { icon: 'file', size: 22, align: 'center', alpha: ta * out, textColor: P.accentHi });
          }
        }
      }

      // 4 · kicker + title (the card's name rises into it) ----------------------
      if (out > 0) {
        ctx.save();
        ctx.globalAlpha *= out;
        const R = U.ROUTES[0];
        U.kicker(ctx, 'Маршрут 1 · Агент', U.TITLE.x, U.TITLE.kickerY, { alpha: U.appear(t, S.kicker, 0.4) });
        const W = words(ctx);
        const lastEnd = S.fly + S.flyStagger * (W.length - 1) + S.flyDur;
        if (t >= lastEnd) {
          U.title(ctx, R.name, U.TITLE.x, U.TITLE.y, { size: U.TITLE.size, accent: 'агента' });
        } else {
          W.forEach((wd, i) => {
            const e = U.k(t, S.fly + i * S.flyStagger, S.flyDur, 'inOutCubic');
            const size = lerp(40, U.TITLE.size, e);
            const x = lerp(wd.sx, wd.ex, e);
            const y = lerp(wd.sy, wd.ey, e) - Math.sin(e * Math.PI) * 16;
            const col = wd.w === 'агента' ? L.mix(P.text, P.accent, e) : P.text;
            U.text(ctx, wd.w, x, y, { size, weight: 600, tracking: lerp(-0.01 * 40, -0.02 * U.TITLE.size, e), color: col });
          });
        }
        ctx.restore();
      }

      // 5 · «Проверено» — only after the click -----------------------------------
      if (checked > 0 && out > 0) {
        ctx.save();
        ctx.globalAlpha *= out * checked;
        ctx.translate(0, (1 - checked) * 20);
        U.pill(ctx, CHECK_PILL.x, CHECK_PILL.y, 'Проверено', { color: P.green, icon: 'check', size: 32, align: 'center' });
        ctx.restore();
      }

      // 6 · caption pill -------------------------------------------------------
      const ca = U.appear(t, S.caption, 0.3);
      if (ca > 0 && out > 0) {
        ctx.save();
        ctx.globalAlpha *= out * ca;
        ctx.translate(0, (1 - ca) * 20);
        U.pill(ctx, 960, 786, U.ROUTES[0].resultLong, { size: 28, align: 'center' });
        ctx.restore();
      }

      // 7 · cursor ---------------------------------------------------------------
      if (t >= S.cursorIn) {
        const keys = [[S.cursorIn, 1990, 930], [S.cursorAt, CLICK[0], CLICK[1]], [S.click + 0.45, CLICK[0], CLICK[1]], [S.out + 0.4, CLICK[0] + 70, CLICK[1] + 70]];
        const [cx, cy] = U.cursorPath(keys, t);
        const press = U.k(t, S.click, 0.3, 'linear');
        const ca2 = 1 - U.k(t, S.out - 0.05, 0.25, 'linear');
        if (ca2 > 0) U.cursor(ctx, cx, cy, { press: press < 1 ? press : 0, alpha: ca2 });
      }

      // 8 · the G4 contour the window frame becomes -------------------------------
      if (shrink > 0) {
        const rx = lerp(WIN.x, G4.x, shrink);
        const ry = lerp(WIN.y, G4.y, shrink);
        const rw = lerp(WIN.w, G4.w, shrink);
        const rh = lerp(WIN.h, G4.h, shrink);
        g4Contour(ctx, rx, ry, rw, rh, lerp(14, G4.r, shrink), clamp(shrink * 2.2));
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/05-engineering.js
/*
 * 05 · Понять, как устроен агент — shot 's05'
 * 60 cut: T 18–24 · 45 cut: T 13–19. Both cuts use the same local schedule (the 45 beats are the
 * 60 beats shifted by 5 s: 13.0 Модель, 14.2 / 15.1 links, 16.0 pulse, 17.2 Проверка, 18.0 sheet).
 *
 * Starts on G4 (the empty accent contour s04 ends on), which fills and becomes «Модель»
 * (ui.schema at 960, 560, scale 1 puts Модель exactly on G4). Ends on a clean hold: the schema on
 * the sheet «Мой агент» + caption pill — s06 crossfades in over it (0.32 s).
 *
 * Beats (local t):
 *   0.10–0.60  contour → Модель · 0.20 kicker · 0.30 title
 *   1.20       link → Инструменты (0.5 s), block at the link end
 *   2.10       link → Знания
 *   3.00–4.20  a light dot travels Модель → Инструменты → back (st.pulse)
 *   4.20       link → Проверка
 *   4.80–5.55  the schema scales to 0.72 onto the sheet «Мой агент» rising behind it
 *   5.10       caption pill «Схема своего агента» · hold to the end
 *
 * Layers back to front: bg · sheet · schema · G4 contour · kicker + title · caption.
 */
(function () {
  'use strict';

  const ID = 's05';
  const L = FILM.lib;
  const P = L.pal;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const A = (c, a) => L.rgba(c, a);

  // the sheet the schema lands on, and the schema's end placement on it
  const SHEET = { x: 500, y: 316, w: 920, h: 464 };
  const END = { cx: 960, cy: 588, s: 0.76 };

  const SCHED = {
    model: 0.1, contourOut: 0.12, kicker: 0.2, title: 0.3,
    lTools: 1.2, tools: 1.62,
    lKnow: 2.1, know: 2.52,
    pulse: 3.0, pulseDur: 1.2,
    lCheck: 4.2, check: 4.55,
    sheet: 4.8, sheetDur: 0.75,
    caption: 5.1,
  };

  /** The G4 contour: one rounded rect, accent 2 px stroke, soft glow, empty. (Same helper in 04.) */
  function g4Contour(ctx, x, y, w, h, r, a) {
    if (a <= 0) return;
    const U = FILM.ui;
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.shadowColor = A(P.accent, 0.75);
    ctx.shadowBlur = 26 * FILM.S;
    U.rrect(ctx, x, y, w, h, r);
    ctx.lineWidth = 2;
    ctx.strokeStyle = P.accent;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.stroke();
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const U = FILM.ui;
      const t = clamp(tIn, 0, info.dur);
      const S = SCHED;
      const G4 = U.G4;

      U.bg(ctx, {});

      // 1 · sheet «Мой агент» rises behind the schema ---------------------------
      const sp = U.k(t, S.sheet, S.sheetDur, 'inOutCubic');
      if (sp > 0) {
        const sa = U.k(t, S.sheet, S.sheetDur * 0.8, 'outCubic');
        ctx.save();
        ctx.globalAlpha *= sa;
        ctx.translate(0, (1 - sp) * 60);
        U.sheet(ctx, SHEET.x, SHEET.y, SHEET.w, SHEET.h, { file: U.ROUTES[1].file, title: 'Мой агент' });
        ctx.restore();
      }

      // 2 · the schema ----------------------------------------------------------
      const pr = t >= S.pulse && t <= S.pulse + S.pulseDur ? L.ease.inOutSine((t - S.pulse) / S.pulseDur) : null;
      const st = {
        model: U.k(t, S.model, 0.5, 'outCubic'),
        lTools: U.k(t, S.lTools, 0.5, 'inOutCubic'),
        tools: U.appear(t, S.tools, 0.4),
        lKnow: U.k(t, S.lKnow, 0.5, 'inOutCubic'),
        know: U.appear(t, S.know, 0.4),
        lCheck: U.k(t, S.lCheck, 0.45, 'inOutCubic'),
        check: U.appear(t, S.check, 0.4),
        pulse: pr,
        sub: true,
      };
      U.schema(ctx, lerp(G4.schemaCx, END.cx, sp), lerp(G4.schemaCy, END.cy, sp), lerp(1, END.s, sp), st);

      // 3 · the G4 contour s04 ended on, dissolving into Модель -------------------
      const ca = 1 - U.k(t, S.contourOut, 0.45, 'inOutCubic');
      if (ca > 0) g4Contour(ctx, G4.x, G4.y, G4.w, G4.h, G4.r, ca);

      // 4 · kicker + title --------------------------------------------------------
      U.kicker(ctx, 'Маршрут 2 · AI-инженерия', U.TITLE.x, U.TITLE.kickerY, { alpha: U.appear(t, S.kicker, 0.4) });
      U.title(ctx, U.ROUTES[1].name, U.TITLE.x, U.TITLE.y, { size: U.TITLE.size, accent: 'AI-инженерии', a: U.appear(t, S.title, 0.45) });

      // 5 · caption pill ------------------------------------------------------------
      const cp = U.appear(t, S.caption, 0.4);
      if (cp > 0) {
        ctx.save();
        ctx.globalAlpha *= cp;
        ctx.translate(0, (1 - cp) * 20);
        U.pill(ctx, 960, 796, U.ROUTES[1].resultLong, { size: 28, align: 'center' });
        ctx.restore();
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/06-project.js
/*
 * 06 · Сдвинуть свой проект с места — shot 's06'
 *   60 cut: T 24–30 · 45 cut: T 19–25 (6 s both). Fades in from s05 (0.32 s), fades out into s07.
 *
 * Left: kicker «Маршрут 3 · Свой проект» + two-line title (ui.TITLE), a loose cluster of idea notes.
 * Right: ui.planSheet «План на неделю», drawn under a fixed scale so the full sheet (goal, 3 steps,
 * «Кому покажу результат») fits y 300–860. The chosen note «Лендинг с формой» flies along the violet
 * route into the «Результат недели» row, becomes its text, and « заявки» types in. Then the steps
 * appear with the route threading down the sheet's left gutter; step 1 is highlighted and lifts
 * slightly in the last 0.4 s (bridge to the lesson page).
 *
 * Layers (back to front)
 *   1 bg                       5 route A (cluster → goal row), screen space
 *   2 kicker + title           6 flying / chosen note
 *   3 other notes (dim)        7 caption pill «План на неделю»
 *   4 plan sheet group (sheet, empty step slots, route B in the gutter, nodes, caret, step-1 lift)
 */
(function () {
  'use strict';

  const ID = 's06';
  const FILM = window.FILM;
  const L = FILM.lib;
  const P = L.pal;
  const E = L.ease;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const A = (c, a) => L.rgba(c, a);

  // ---------------------------------------------------------------------------
  // Schedules (shot-relative seconds). Global T in comments.
  // ---------------------------------------------------------------------------
  const SCHED = {
    60: {
      gather: [0.0, 1.2], //  T 24.0–25.2  notes gather, chosen one highlights
      fly: [1.2, 1.0], //     T 25.2–26.2  chosen note flies to «Результат недели»
      type: [2.35, 0.55], //  T 26.35–26.9 « заявки» types in
      pill: 2.9, //           T 26.9       caption pill
      steps: [3.0, 3.5, 4.0], // T 27.0 / 27.5 / 28.0
      active: 4.5, //         T 28.5       step 1 highlighted
      who: 5.0, //            T 29.0       «Кому покажу результат»
      lift: 5.6, //           T 29.6       step 1 starts to scale up
    },
    45: {
      gather: [0.0, 1.0], //  T 19.0–20.0
      fly: [1.2, 0.85], //    T 20.2–21.05
      type: [2.15, 0.45], //  T 21.15–21.6
      pill: 2.6, //           T 21.6
      steps: [3.0, 3.5, 4.0], // T 22.0 / 22.5 / 23.0
      active: 4.5, //         T 23.5
      who: 5.0, //            T 24.0
      lift: 5.6, //           T 24.6
    },
  };

  // ---------------------------------------------------------------------------
  // Plan sheet geometry. The kit's full-size sheet needs ~612 px of height; it is drawn at a fixed
  // scale so it spans exactly x 1060–1800, y 300–860 on screen.
  // ---------------------------------------------------------------------------
  const SX = 1060; // screen rect
  const SY = 300;
  const SW = 740;
  const SH = 560;
  const LH = 612; // logical sheet height (full-size planSheet with the «Кому покажу» row + padding)
  const SS = SH / LH; // sheet scale
  const LW = SW / SS; // logical sheet width
  // planSheet internals (non-compact), in logical sheet coords relative to its top-left
  const BODY_X = 32;
  const GOAL_Y = 144; // body.y (140) + 4
  const GOAL_H = 96;
  const STEP_Y = (i) => GOAL_Y + GOAL_H + 20 + i * (70 + 14);
  const STEP_H = 70;
  const WHO_Y = STEP_Y(3) + 6; // gy + gh + 20 + 3 * 84 + 6
  const WHO_H = 62;
  const GUTTER_X = 16; // the route runs in the sheet's left gutter
  // logical → screen
  const sx = (x) => SX + x * SS;
  const sy = (y) => SY + y * SS;

  const GOAL = FILM.ui.PLAN.goal; // 'Лендинг с формой заявки'
  const CHOSEN = 'Лендинг с формой';
  const GOAL_FONT = { size: 34, weight: 600 };

  // ---------------------------------------------------------------------------
  // Idea notes. kind 'card' = small note card, 'pill' = kit pill, 'blank' = skeleton note.
  // p0 = scattered start (top-left), p1 = gathered around the chosen note.
  // ---------------------------------------------------------------------------
  const NOTE_H = 96;
  const NOTE_SIZE = 32;
  const NOTES = [
    { text: CHOSEN, kind: 'card', chosen: true, p0: [352, 548], p1: [318, 540] },
    { text: 'Телеграм-бот', kind: 'card', p0: [124, 396], p1: [168, 418] },
    { text: 'Портфолио', kind: 'card', p0: [626, 384], p1: [560, 412] },
    { text: 'Курс по Figma', kind: 'pill', p0: [140, 700], p1: [176, 676] },
    { text: 'Идея для SaaS', kind: 'pill', p0: [620, 718], p1: [560, 690] },
    { kind: 'blank', w: 150, p0: [126, 560], p1: [124, 552], short: true },
  ];

  // ---------------------------------------------------------------------------
  // Local helpers
  // ---------------------------------------------------------------------------

  /** arc-length sampler over the kit's Catmull-Rom curve (t-independent, cached by its points) */
  const PATHS = {};
  function pathOf(pts) {
    const key = pts.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(';');
    if (PATHS[key]) return PATHS[key];
    const S = FILM.ui.curve(pts, 24);
    const len = [0];
    for (let i = 1; i < S.length; i++) len.push(len[i - 1] + Math.hypot(S[i][0] - S[i - 1][0], S[i][1] - S[i - 1][1]));
    const total = len[len.length - 1];
    const at = (u) => {
      const d = clamp(u) * total;
      let i = 1;
      while (i < len.length - 1 && len[i] < d) i++;
      const q = (d - len[i - 1]) / Math.max(1e-6, len[i] - len[i - 1]);
      return [lerp(S[i - 1][0], S[i][0], q), lerp(S[i - 1][1], S[i][1], q)];
    };
    PATHS[key] = { pts, at, total };
    return PATHS[key];
  }

  /** a small idea-note card: Learn card, one line of Onest 600. Returns width. */
  function noteCard(ctx, U, x, y, w, h, text, o) {
    const a = o.alpha != null ? o.alpha : 1;
    U.card(ctx, x, y, w, h, { r: o.r != null ? o.r : 16, glow: o.glow || 0, fill: o.fill, shadow: o.shadow != null ? o.shadow : 0.8, alpha: a });
    if (text) U.text(ctx, text, x + o.tx, y + o.ty, { size: o.size, weight: 600, color: o.color || P.text, alpha: o.textAlpha != null ? o.textAlpha : a });
  }

  /** a caret (typing cursor) after a string, in the current transform */
  function caret(ctx, x, baseline, size, a) {
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.fillStyle = P.accent;
    ctx.fillRect(x, baseline - size * 0.8, 3, size * 1.0);
    ctx.restore();
  }

  function noteWidth(ctx, U, n) {
    if (n.kind === 'blank') return n.w;
    return U.measure(ctx, n.text, { size: NOTE_SIZE, weight: 600 }) + 56;
  }

  // ---------------------------------------------------------------------------
  // Scene
  // ---------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const U = FILM.ui;
      const t = clamp(tIn, 0, info.dur);
      const S = SCHED[U.cut(info)];
      const T = info.T;

      // --- derived timing --------------------------------------------------
      const gather = U.k(t, S.gather[0], S.gather[1], 'inOutCubic');
      const flyU = U.k(t, S.fly[0], S.fly[1], 'inOutCubic');
      const landed = t >= S.fly[0] + S.fly[1];
      const land = U.k(t, S.fly[0] + S.fly[1], 0.3, 'outCubic'); // settle / crossfade into the row
      const baseP = CHOSEN.length / GOAL.length;
      const typeP = U.k(t, S.type[0], S.type[1], 'linear');
      const goalP = !landed ? 0 : lerp(baseP, 1, typeP);
      const stepsA = S.steps.map((s0) => U.k(t, s0, 0.4, 'outCubic'));
      const active = U.k(t, S.active, 0.4, 'inOutCubic');
      const who = U.k(t, S.who, 0.4, 'outCubic');
      const lift = U.k(t, S.lift, info.dur - S.lift, 'inOutSine');
      const dimOthers = 0.45 * gather + 0.25 * U.k(t, S.fly[0], S.fly[1] + 0.6, 'inOutCubic');

      // --- 1 background ----------------------------------------------------
      U.bg(ctx, { glow: { x: 1300, y: 560, r: 900, a: 0.08 } });

      // --- 2 kicker + title (present from frame 0; the crossfade brings it in) ---
      U.kicker(ctx, 'Маршрут 3 · Свой проект', U.TITLE.x, U.TITLE.kickerY);
      U.title(ctx, 'Довести свой проект\nдо результата', U.TITLE.x, U.TITLE.y, { size: U.TITLE.size, accent: 'результата' });

      // --- 3 the other notes ----------------------------------------------
      const drift = (i, ax) => Math.sin(t * 0.9 + i * 1.7 + ax) * 4 * (1 - gather * 0.6);
      NOTES.forEach((n, i) => {
        if (n.chosen) return;
        const x = lerp(n.p0[0], n.p1[0], gather) + drift(i, 0);
        const y = lerp(n.p0[1], n.p1[1], gather) + drift(i, 2.1);
        const a = 1 - dimOthers;
        if (n.kind === 'pill') {
          U.pill(ctx, x, y, n.text, { size: 28, color: P.text2, textColor: P.text, alpha: a });
        } else if (n.kind === 'card') {
          noteCard(ctx, U, x, y, noteWidth(ctx, U, n), NOTE_H, n.text, { alpha: a, size: NOTE_SIZE, tx: 28, ty: NOTE_H / 2 + NOTE_SIZE * 0.36 });
        } else {
          ctx.save();
          ctx.globalAlpha *= a * 0.8;
          U.card(ctx, x, y, n.w, NOTE_H, { r: 16, dashed: true });
          U.skeleton(ctx, x + 24, y + 30, n.w - 48, n.short ? 1 : 2, { h: 12, gap: 24 });
          ctx.restore();
        }
      });

      // --- 4 plan sheet group ---------------------------------------------
      ctx.save();
      ctx.translate(SX, SY);
      ctx.scale(SS, SS);
      U.planSheet(ctx, 0, 0, LW, LH, { goal: goalP, steps: stepsA, active, who, glow: 0.25 * active });

      // empty step slots, waiting to be filled (fade out as each step lands on top)
      for (let i = 0; i < 3; i++) {
        const a = 1 - stepsA[i];
        if (a <= 0.01) continue;
        ctx.save();
        ctx.globalAlpha *= 0.55 * a;
        ctx.setLineDash([8, 8]);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = P.border;
        U.rrect(ctx, BODY_X, STEP_Y(i), LW - 2 * BODY_X, STEP_H, 12);
        ctx.stroke();
        ctx.setLineDash([]);
        U.text(ctx, String(i + 1), BODY_X + 26, STEP_Y(i) + STEP_H / 2 + 9, { mono: true, size: 24, weight: 600, color: P.text3, alpha: 0.7 });
        ctx.restore();
      }

      // caret while « заявки» types
      if (landed) {
        const typed = U.typed(GOAL, goalP);
        const cw = U.measure(ctx, typed, GOAL_FONT);
        const on = typeP < 1 ? 1 : U.blink(T) * (1 - U.k(t, S.type[0] + S.type[1] + 0.5, 0.2, 'linear'));
        caret(ctx, BODY_X + 24 + cw + 4, GOAL_Y + 76, 34, on * U.k(t, S.fly[0] + S.fly[1], 0.12, 'linear'));
      }

      // route B: threads the rows down the left gutter
      const rowMid = [GOAL_Y + GOAL_H / 2, STEP_Y(0) + STEP_H / 2, STEP_Y(1) + STEP_H / 2, STEP_Y(2) + STEP_H / 2, WHO_Y + WHO_H / 2];
      const segT = [S.steps[0] - 0.15, S.steps[0] + 0.3, S.steps[1] + 0.3, S.steps[2] + 0.3, S.who + 0.3];
      let reachY = rowMid[0];
      for (let k = 1; k < rowMid.length; k++) {
        const q = U.k(t, segT[k - 1], segT[k] - segT[k - 1], 'inOutCubic');
        if (t >= segT[k - 1]) reachY = lerp(rowMid[k - 1], rowMid[k], q);
      }
      const bStarted = t > segT[0];
      if (bStarted && reachY > rowMid[0] + 0.5) {
        U.route(ctx, [[GUTTER_X, rowMid[0]], [GUTTER_X, reachY]], { straight: true, width: 4, glow: 0.8 });
      }
      // nodes where the route meets a row
      for (let k = 0; k < rowMid.length; k++) {
        const on = k === 0 ? U.k(t, S.fly[0] + S.fly[1], 0.2, 'outCubic') : clamp((reachY - rowMid[k] + 2) / 4);
        if (on <= 0) continue;
        const hot = k === 1 ? active : 0;
        ctx.save();
        ctx.globalAlpha *= on;
        ctx.beginPath();
        ctx.arc(GUTTER_X, rowMid[k], 6 + 2 * hot, 0, TAU);
        ctx.fillStyle = hot > 0 ? L.mix(P.accent, P.accentHi, hot) : P.accent;
        ctx.fill();
        ctx.restore();
      }

      // step 1 lifts (last 0.4 s): the kit's own row, redrawn magnified through a clip
      if (lift > 0) {
        const rx = BODY_X;
        const ry = STEP_Y(0);
        const rw = LW - 2 * BODY_X;
        const cx = rx + rw / 2;
        const cy = ry + STEP_H / 2;
        const sc = 1 + 0.05 * lift;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(sc, sc);
        ctx.translate(-cx, -cy);
        // soft shadow + accent halo under the lifted row
        ctx.save();
        ctx.shadowColor = A(P.accent, 0.35 * lift);
        ctx.shadowBlur = 36 * FILM.S * SS;
        ctx.shadowOffsetY = 10 * FILM.S * SS * lift;
        U.rrect(ctx, rx, ry, rw, STEP_H, 12);
        ctx.fillStyle = P.field;
        ctx.fill();
        ctx.restore();
        U.rrect(ctx, rx - 2, ry - 2, rw + 4, STEP_H + 4, 14);
        ctx.clip();
        U.planSheet(ctx, 0, 0, LW, LH, { goal: goalP, steps: stepsA, active, who, glow: 0 });
        ctx.restore();
      }
      ctx.restore();

      // --- 5 route A: from the chosen note to the goal row -------------------
      // The route starts at the gathered note's right edge; while the note flies, the route head stays
      // under the card (right edge at u = 0 → left edge at u = 1), so the line trails out of it.
      const n0 = NOTES[0];
      const w0 = noteWidth(ctx, U, n0);
      const SC0 = 1.06; // chosen note scale once gathered
      const gw = w0 * SC0;
      const gh = NOTE_H * SC0;
      const gL = n0.p1[0] - (gw - w0) / 2; // gathered card rect
      const gT = n0.p1[1] - (gh - NOTE_H) / 2;
      const goalL = [sx(GUTTER_X), sy(GOAL_Y + GOAL_H / 2)];
      const goalRect = [sx(BODY_X), sy(GOAL_Y), (LW - 2 * BODY_X) * SS, GOAL_H * SS];
      const r0 = [gL + gw, gT + gh / 2];
      const route = pathOf([r0, [r0[0] + 150, r0[1] + 4], [goalL[0] - 150, goalL[1] + 26], [goalL[0] - 40, goalL[1]], goalL]);
      if (flyU > 0) {
        // the spot the idea was picked from: a dashed ghost of the note, the route's origin
        const ga = U.k(t, S.fly[0], 0.35, 'outCubic');
        U.card(ctx, gL, gT, gw, gh, { r: 16, dashed: true, stroke: A(P.accent, 0.45), alpha: ga });
        U.route(ctx, route.pts, { from: 0, to: flyU, width: 4, glow: 1, head: !bStarted, alpha: landed ? 1 - 0.25 * land : 1 });
      }

      // --- 6 the chosen note ------------------------------------------------
      {
        let x;
        let y;
        let w;
        let h;
        let size;
        let ty;
        let tx;
        let rr;
        if (flyU <= 0) {
          const sc = 1 + (SC0 - 1) * E.outBack(gather);
          w = w0 * sc;
          h = NOTE_H * sc;
          const cx = lerp(n0.p0[0], n0.p1[0], gather) + w0 / 2 + drift(0, 0) * (1 - gather);
          const cy = lerp(n0.p0[1], n0.p1[1], gather) + NOTE_H / 2 + drift(0, 2.1) * (1 - gather);
          x = cx - w / 2;
          y = cy - h / 2;
          size = NOTE_SIZE * sc;
          tx = 28 * sc;
          ty = h / 2 + size * 0.36;
          rr = 16;
        } else {
          const m = E.inOutCubic(clamp((flyU - 0.45) / 0.55)); // morph into the row late in the flight
          const head = route.at(flyU);
          w = lerp(gw, goalRect[2], m);
          h = lerp(gh, goalRect[3], m);
          x = head[0] - w * (1 - flyU) + (goalRect[0] - goalL[0]) * flyU;
          y = head[1] - h / 2 + (goalRect[1] + goalRect[3] / 2 - goalL[1]) * flyU;
          size = lerp(NOTE_SIZE * SC0, GOAL_FONT.size * SS, m);
          tx = lerp(28 * SC0, 24 * SS, m);
          ty = lerp(h / 2 + size * 0.36, 76 * SS, m);
          rr = lerp(16, 14 * SS, m);
        }
        const fade = landed ? 1 - land : 1;
        if (fade > 0.001) {
          noteCard(ctx, U, x, y, w, h, CHOSEN, {
            alpha: fade,
            textAlpha: 1, // the kit's goal text lies exactly under it, so the words never dim
            glow: gather,
            size,
            tx,
            ty,
            r: rr,
            fill: L.mix(P.card, P.accentDeep, 0.12 * gather),
            shadow: 0.8,
          });
        }
      }

      // --- 7 caption pill ---------------------------------------------------
      const pa = U.appear(t, S.pill, 0.45);
      if (pa > 0) {
        ctx.save();
        ctx.globalAlpha *= pa;
        ctx.translate(0, (1 - pa) * 20);
        U.pill(ctx, U.TITLE.x, 790, U.ROUTES[2].resultLong, { size: 28, icon: 'file' });
        ctx.restore();
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/07-inside.js
/*
 * 07-inside.js : s07 «Что находится внутри шага» · 60: T 30–35 · 45: T 25–30 (fade in 0.32)
 *
 * s07, s08 and s09 film ONE lesson page (FILM.ui.lessonPage, ui.LESSON rects) through lib.camera.
 * The whole sequence lives in the LESSON FILM helper below, copied verbatim into 07-inside.js,
 * 08-practice.js and 09-progress.js. It is driven by u = seconds since s07 started (each file only
 * adds its own offset U0), so the camera, page state, cursor, project thumbnail and titles are the
 * same function on both sides of each cut: s08's first frame is s07's last, s09's first is s08's.
 *
 * s07 (u 0–5): video (playhead runs) → materials → the practice block header; the cursor enters
 * from off-frame and waits beside «Вставить шаблон».
 *
 * Layers, back to front:
 *   1 ui.bg — its dot grid drifts with the camera
 *   2 page layer (scratch canvas): camera → lessonPage + criterion tick + guide top (brand, resumeCard);
 *     spotlight dim around the focused zone; soft edge mask (sides, subtitle band)
 *   3 «Твой проект» thumbnail (ui.window, screen space, top right) + handoff route line
 *   4 cursor (page positions seen through the camera; screen-fixed while the camera flies up)
 *   5 top scrim + sequential title (screen space)
 */
(function () {
  'use strict';
  const ID = 's07';
  const U0 = { 60: 0, 45: 0 }; // u at this shot's t = 0

  // ==== LESSON FILM : shared by 07-inside.js, 08-practice.js, 09-progress.js — keep identical ====
  const LF = (function () {
    const F_ = window.FILM;
    const L = F_.lib;
    const P = L.pal;
    const E = L.ease;
    const ui = F_.ui;
    const G = ui.LESSON;
    const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
    const lerp = (a, b, q) => a + (b - a) * q;
    const k = (u, a, d, e) => ui.k(u, a, d, e || 'inOutCubic');
    const pulse = (u, a, d = 0.3) => (u > a && u < a + d ? (u - a) / d : 0); // a click: press 0→1, then 0
    const TX = 120; // title x, baseline, size
    const TY = 222;
    const TS = 72;

    // camera that puts page point (px, py) at screen point (sx, sy) with zoom z
    const camAt = (px, py, sx, sy, z) => ({ x: px - (sx - 960) / z, y: py - (sy - 540) / z, z });
    const toScreen = (c, px, py) => [960 + (px - c.x) * c.z, 540 + (py - c.y) * c.z];
    const pad = (r, p) => ({ x: r.x - p, y: r.y - p, w: r.w + 2 * p, h: r.h + 2 * p });

    // the guide top (60 cut only): brand + resume card, in page space above the lesson
    // (resumeCard's title runs into its «Продолжить» button below w ≈ 1300, so the card is 1320 wide)
    const CR = { x: 960, y: -500, z: 1 }; // camera on the guide top: screen y = page y + 1040 (lesson header off-frame)
    const RES = { x: 300, y: 490 - 1040, w: 1320, h: 200 }; // resumeCard at screen (300, 490)
    const BRAND = { x: 300, y: 412 - 1040 };
    const RES_BTN = [RES.x + RES.w - 175 + 34, RES.y + RES.h / 2 + 18]; // cursor tip on «Продолжить»

    // focuses: camera + spotlight hole (page rects)
    const FOC = {
      V: { cam: camAt(620, 531, 820, 602, 1.2), hole: pad(G.video, 14), dim: 0.5 },
      M: { cam: camAt(1480, 250, 960, 290, 1.25), hole: pad(G.materials, 14), dim: 0.5 },
      T: { cam: camAt(120, 852, 110, 300, 1.25), hole: { x: 128, y: 862, w: 1052, h: 468 }, dim: 0.52 },
      C: { cam: camAt(1180, 960, 960, 350, 1.2), hole: { x: 1182, y: 958, w: 596, h: 462 }, dim: 0.64 },
      R: { cam: CR, hole: { x: -400, y: -1500, w: 2720, h: 3400 }, dim: 0 },
    };
    const KEYS = {
      60: [[0, 'V'], [1.5, 'V'], [2.0, 'M'], [3.0, 'M'], [3.5, 'T'], [8.55, 'T'], [9.05, 'C'], [12.0, 'C'], [13.3, 'R']],
      45: [[0, 'V'], [1.5, 'V'], [2.0, 'M'], [3.0, 'M'], [3.5, 'T'], [5.9, 'T'], [6.3, 'C']],
    };
    // [swap time, title, accent]: the old title fades out over 0.2 s, the new one appears over 0.4 s
    const TITLES = {
      60: [[-0.08, 'Посмотри разбор', 'разбор'], [1.5, 'Возьми материалы', 'материалы'], [3.0, 'Попробуй сам', 'сам'],
        [5.0, 'Примени к своей задаче', 'своей задаче'], [8.8, 'Проверь результат', 'результат'], [11.0, 'В своём темпе', 'своём темпе']],
      45: [[-0.08, 'Смотри → пробуй → проверяй', null], [5.0, 'Сделай на своей задаче', 'своей задаче']],
    };
    // screen-space «Твой проект» thumbnail (a separate window, outside the guide)
    const TH = { x: 1400, y: 92, w: 400, h: 240 };

    // page points the cursor visits
    const tpl = G.template;
    const cr = G.criteria;
    const dn = G.done;
    const C_ENTRY = [1624, 1420]; // off-frame bottom right under the task framing
    const C_WAIT = [548, 1030]; // beside «Вставить шаблон»
    const C_TPL = [398, 1018]; // on «Вставить шаблон»
    const C_REST = [980, 1006]; // right of the practice header
    const BOX = [cr.x + 44, cr.y + 108]; // criterion 1 check square centre
    const C_BOX = [BOX[0] + 4, BOX[1] + 4];
    const C_OFF = [1676, 1104]; // off the ticked box, past the end of its label
    const C_DONE = [dn.x + 252, dn.y + 44]; // on «Я сделал»
    const C_AWAY = [1700, 1250]; // empty corner of the criteria box

    const S = {
      60: {
        cursor: [[3.7, ...C_ENTRY], [4.75, ...C_WAIT], [5.0, ...C_WAIT], [5.28, ...C_TPL], [5.7, ...C_TPL], [6.2, ...C_REST],
          [8.5, ...C_REST], [9.2, ...C_BOX], [9.55, ...C_BOX], [9.95, ...C_OFF], [10.02, ...C_OFF], [10.45, ...C_DONE], [10.95, ...C_DONE], [11.45, ...C_AWAY]],
        hoverTpl: [5.0, 5.7], pressTpl: 5.3, tpl: [5.7, 1.2], vals: [[7.0, 0.5], [7.5, 0.5], [8.0, 0.5]], thumb: 7.5,
        pressBox: 9.25, tick: 9.4, hoverDone: [10.25, 10.8], pressDone: 10.5, done: 10.82, prog: [10.9, 0.6],
        fly: 12.0, thumbOut: 11.8, res: 13.2, cursorFly: [12.7, 14.0], resHover: 13.9,
      },
      45: {
        cursor: [[3.6, ...C_ENTRY], [4.45, ...C_WAIT], [4.6, ...C_WAIT], [4.95, ...C_TPL], [5.4, ...C_TPL], [6.3, ...C_BOX],
          [6.55, ...C_BOX], [6.9, ...C_OFF], [7.0, ...C_OFF], [7.35, ...C_DONE], [7.8, ...C_DONE], [8.2, ...C_AWAY]],
        hoverTpl: [4.8, 5.4], pressTpl: 5.1, tpl: [5.3, 0.3], vals: [[5.45, 0.2], [5.6, 0.2], [5.75, 0.2]], thumb: 5.6,
        pressBox: 6.35, tick: 6.45, hoverDone: [7.2, 7.7], pressDone: 7.4, done: 7.72, prog: [7.75, 0.45],
        fly: null, thumbOut: null, res: null, cursorFly: null, resHover: null,
      },
    };

    // eased track through keyframes [[u, value]] with a per-segment mixer
    function track(keys, u, mix) {
      if (u <= keys[0][0]) return mix(keys[0][1], keys[0][1], 0, 0);
      for (let i = 1; i < keys.length; i++) {
        if (u <= keys[i][0]) {
          const a = keys[i - 1];
          const b = keys[i];
          return mix(a[1], b[1], E.inOutCubic((u - a[0]) / Math.max(1e-6, b[0] - a[0])), i);
        }
      }
      const z = keys[keys.length - 1][1];
      return mix(z, z, 0, keys.length);
    }

    function camera(u, cut) {
      return track(KEYS[cut], u, (a, b, q) => {
        const A = FOC[a].cam;
        const B = FOC[b].cam;
        let z = lerp(A.z, B.z, q);
        if (b === 'R' && a !== 'R') z *= 1 - 0.46 * Math.sin(Math.PI * q); // out, up, back in
        return {
          x: lerp(A.x, B.x, q), y: lerp(A.y, B.y, q), z,
          // the spotlight cross-fades from the old focus to the new one during a glide
          spots: a === b ? [[FOC[a].hole, FOC[a].dim]] : [[FOC[a].hole, FOC[a].dim * (1 - q)], [FOC[b].hole, FOC[b].dim * q]],
        };
      });
    }

    function state(u, cut, T) {
      const s = S[cut];
      const vals = s.vals.map(([a, d]) => k(u, a, d, 'linear'));
      return {
        video: Math.min(0.96, 0.14 + 0.045 * u),
        videoFocus: 1 - k(u, 1.5, 0.35),
        matFocus: k(u, 1.75, 0.4) - k(u, 3.0, 0.35),
        taskFocus: k(u, 3.25, 0.45) - k(u, 8.55, 0.4) * (cut === 60 ? 1 : 0) - (cut === 45 ? k(u, 5.9, 0.4) : 0),
        templatePress: pulse(u, s.pressTpl),
        tpl: k(u, s.tpl[0], s.tpl[1], 'linear'),
        vals,
        critFocus: k(u, s.tick, 0.4),
        critHi: u >= s.tick ? 0 : -1,
        donePress: pulse(u, s.pressDone),
        done: u >= s.done ? 1 : 0,
        progress: k(u, s.prog[0], s.prog[1]),
        T: vals.some((v) => v > 0 && v < 1) ? T : null,
        hover: { template: k(u, s.hoverTpl[0], 0.25) * (1 - k(u, s.hoverTpl[1], 0.25)), done: k(u, s.hoverDone[0], 0.25) * (1 - k(u, s.hoverDone[1], 0.2)) },
      };
    }

    // cursor: screen position, press
    function cursor(u, cut, cam) {
      const s = S[cut];
      const keys = s.cursor;
      let p;
      if (s.fly != null && u > s.fly) {
        // the page flies away under a still pointer, which then glides to «Продолжить»
        const last = keys[keys.length - 1];
        const from = toScreen(FOC.C.cam, last[1], last[2]);
        const to = toScreen(CR, RES_BTN[0], RES_BTN[1]);
        const q = k(u, s.cursorFly[0], s.cursorFly[1] - s.cursorFly[0]);
        p = [lerp(from[0], to[0], q), lerp(from[1], to[1], q) - Math.sin(Math.PI * q) * 40];
      } else {
        const pp = ui.cursorPath(keys, u);
        p = toScreen(cam, pp[0], pp[1]);
      }
      const press = Math.max(pulse(u, s.pressTpl), pulse(u, s.pressBox), pulse(u, s.pressDone));

      for (let i = 0; i < list.length; i++) {

      const Sc = F_.S || 1;

        const la = k(u, s.thumb + 0.1, 0.5) * (1 - k(u, cut === 60 ? 8.55 : 5.9, 0.3));
        if (la > 0) {
          const [nx, ny] = toScreen(cam, G.notes.x + G.notes.w - 30, G.notes.y);
          ui.route(ctx, [[nx, ny - 4], [nx + 22, ny - 110], [nx + 60, ny - 200], [TH.x + 110, TH.y + TH.h + 6]], { to: la, width: 3, alpha: 0.85 * la, glow: 0.7 });
        }
        const dy = (1 - tha) * 20;
        ctx.save();
        ctx.globalAlpha *= tha;
        const b = ui.window(ctx, TH.x, TH.y + dy, TH.w, TH.h, { title: 'Твой проект' });
        ui.skeleton(ctx, b.x + 30, b.y + 30, 210, 2, { h: 12, gap: 24 });
        ui.button(ctx, b.x + 30, b.y + 96, 190, 56, 'Оплатить', { size: 24 });
        ui.skeleton(ctx, b.x + 250, b.y + 104, 120, 2, { h: 12, gap: 24 });
        ctx.restore();
      }

      // 4 cursor
      const c = cursor(u, cut, cam);
      if (c.a > 0) ui.cursor(ctx, c.x, c.y, { press: c.press, s: 1.15 });

      // 5 title
      drawTitles(ctx, u, cut);
    }

    return { draw };
  })();
  // ==== end LESSON FILM ====

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const cut = FILM.ui.cut(info);
      const t = Math.min(Math.max(tIn, 0), info.dur);
      LF.draw(ctx, U0[cut] + t, cut, info);
    },
  });
})();
