<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>learn</title>
<style>html,body{margin:0;height:100%;background:#000}</style>
</head>
<body>
<script>
// ---- src/core.js
/*
 * core.js : the FILM runtime.
 *
 * Load order everywhere: core.js, lib.js, timeline.js, scenes (sorted), music.js, player.js.
 *
 * Defines window.FILM: the scene registry, the timeline reader, renderFrame(T),
 * transitions between shots and the global post-processing (boiling grain).
 *
 * Rules for scene code (see docs/CONTRACT.md):
 *   - Draw only from (t, info). No state carried between frames.
 *   - Use ctx.save()/ctx.restore(). Never call ctx.setTransform/resetTransform with
 *     absolute values: the base transform carries the render scale (FILM.S).
 *     If you really need the base transform back, call FILM.baseTransform(ctx).
 *   - Randomness only from FILM.lib.rng(seed) / FILM.lib.hash(...).
 *   - FILM.lib, FILM.lib.pal and FILM.lib.ease are frozen. Copy before changing anything.
 */
(function () {
  'use strict';

  const root = typeof window !== 'undefined' ? window : globalThis;
  const FILM = (root.FILM = root.FILM || {});

  // Frame size. The default is the vertical film; a timeline may declare its own
  // (FILM.TIMELINE.width / height), which prepare() applies before anything is drawn — that is how
  // the photo-doodle mode gets its 1080 x 1080 square without touching the engine.
  FILM.W = 1080;
  FILM.H = 1920;

  // Photo registry (photo-doodle mode). src/photos.js, generated by tools/photos.cjs, fills this;
  // in a zero-asset film it stays empty and every path below is inert.
  FILM.PHOTOS = FILM.PHOTOS || {}; // id -> { w, h, uri }
  FILM.FPS = 24; // default; a timeline that declares fps (FILM.TIMELINE.fps) sets it in prepare()
  FILM.BOIL_FPS = 12;
  FILM.S = 1; // render scale: device pixels per logical pixel
  FILM.registry = {}; // id -> scene definition
  FILM.registered = []; // [{ id, file }] in registration order
  FILM.errors = []; // drawing errors collected by renderFrame (tools clear and read this)
  FILM.strict = false; // when true, renderFrame rethrows scene errors after recording them
  FILM.only = null; // shot id when a tool loaded only that shot's file (snap --only); transitions from an unloaded shot are skipped
  FILM.canvas = null;
  FILM.ctx = null;

  // Global time of the frame being drawn. Read-only for scenes (FILM.lib.T reads it); core sets it before each draw.
  let frameT = 0;
  Object.defineProperty(FILM, 'frameT', { get: () => frameT, enumerable: true, configurable: false });

  const EPS = 1e-6;
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

  // Small self-contained hash so core never depends on lib being healthy.
  function ihash(a, b, c) {
    let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x9e3779b1);
    h ^= h >>> 15;
    h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // ---------------------------------------------------------------------------
  // Scene registry
  // ---------------------------------------------------------------------------

  FILM.scene = function scene(def) {
    const doc = typeof document !== 'undefined' ? document : null;
    const src = doc && doc.currentScript && doc.currentScript.src ? doc.currentScript.src : '';
    const file = src ? decodeURIComponent(src.split('?')[0].split('/').pop()) : '';
    if (!def || typeof def.id !== 'string' || !def.id || typeof def.draw !== 'function') {
      const msg = `FILM.scene() needs { id: string, draw: function }${file ? ' (in ' + file + ')' : ''}`;
      FILM.errors.push({ T: null, shot: def && def.id, message: msg, file });
      if (typeof console !== 'undefined') console.error(msg);
      return def;
    }
    if (FILM.registry[def.id]) {
      const prev = FILM.registry[def.id].__file || '?';
      const msg = `duplicate scene id '${def.id}' registered by ${file || '?'} (already registered by ${prev})`;
      FILM.errors.push({ T: null, shot: def.id, message: msg, file });
      if (typeof console !== 'undefined') console.error(msg);
    }
    def.__file = file;
    FILM.registry[def.id] = def;
    FILM.registered.push({ id: def.id, file });
    return def;
  };

  // ---------------------------------------------------------------------------
  // Timeline
  // ---------------------------------------------------------------------------

  function modeOf(shot) {
    const m = String((shot && shot.mode) || 'illustrated').toLowerCase();
    if (m === 'none' || m === 'raw') return 'none';
    if (m.indexOf('schem') >= 0 || m.indexOf('blue') >= 0) return 'schematic';
    return 'illustrated';
  }
  FILM.modeOf = modeOf;

  function normTransition(tr) {
    if (!tr) return null;
    if (typeof tr === 'string') tr = { kind: tr };
    const kind = String(tr.kind || tr.type || 'cut').toLowerCase();
    const dur = Number(tr.dur != null ? tr.dur : tr.duration != null ? tr.duration : 0.25);
    return Object.assign({}, tr, { kind, dur: Math.max(0, dur) });
  }

  // Accepts start/end, start/dur, t0/t1, from/to; shots with only a dur chain after the previous one.
  // Writes normalised start, end and dur back onto each shot entry.
  let prepared = null;
  function prepare() {
    const tl = FILM.TIMELINE;
    if (!tl) throw new Error('FILM.TIMELINE is not defined: src/timeline.js did not load');
    const shots = tl.shots || [];
    if (prepared && prepared.tl === tl && prepared.src === shots && prepared.n === shots.length) return prepared;
    let cursor = 0;
    const out = [];
    for (let i = 0; i < shots.length; i++) {
      const s = shots[i];
      const pick = (...keys) => {
        for (const k of keys) if (s[k] != null && isFinite(Number(s[k]))) return Number(s[k]);
        return null;
      };
      let start = pick('start', 't0', 'from', 'in');
      if (start == null) start = cursor;
      let end = pick('end', 't1', 'to', 'out');
      if (end == null) {
        const d = pick('dur', 'duration', 'length');
        end = d != null ? start + d : start;
      }
      s.start = start;
      s.end = end;
      s.dur = end - start;
      s.index = i;
      s.transitionIn = normTransition(s.transitionIn);
      cursor = end;
      out.push(s);
    }
    if (tl.fps != null && Number(tl.fps) > 0) FILM.FPS = Number(tl.fps);
    if (tl.width != null && Number(tl.width) > 0) FILM.W = Number(tl.width);
    if (tl.height != null && Number(tl.height) > 0) FILM.H = Number(tl.height);
    const duration = tl.duration != null ? Number(tl.duration) : out.length ? out[out.length - 1].end : 0;
    prepared = { tl, src: shots, n: shots.length, shots: out, duration };
    return prepared;
  }
  FILM.prepare = prepare;

  Object.defineProperty(FILM, 'DURATION', {
    get() { return FILM.TIMELINE ? prepare().duration : 0; },
    enumerable: true,
    configurable: true,
  });
  Object.defineProperty(FILM, 'FRAMES', {
    get() { return Math.round(FILM.DURATION * FILM.FPS); },
    enumerable: true,
    configurable: true,
  });
  Object.defineProperty(FILM, 'shots', {
    get() { return FILM.TIMELINE ? prepare().shots : []; },
    enumerable: true,
    configurable: true,
  });

  function shotIndexAt(T) {
    const { shots } = prepare();
    if (!shots.length) return -1;
    for (let i = 0; i < shots.length; i++) {
      if (T < shots[i].end - EPS) return i;
    }
    return shots.length - 1;
  }
  FILM.shotIndexAt = shotIndexAt;
  FILM.activeShot = function activeShot(T) {
    const i = shotIndexAt(T);
    return i < 0 ? null : prepare().shots[i];
  };
  FILM.frameTime = (i) => i / FILM.FPS;
  FILM.shotById = (id) => prepare().shots.find((s) => s.id === id) || null;

  // ---------------------------------------------------------------------------
  // Canvas
  // ---------------------------------------------------------------------------

  function makeCanvas(w, h) {
    if (typeof document !== 'undefined') {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      return c;
    }
    return new OffscreenCanvas(w, h);
  }
  FILM.makeCanvas = makeCanvas;

  // Retro mode: a low-resolution frame buffer (FILM.TIMELINE.retro.native, default 320x180) that a
  // film opts into by calling FILM.native(); presentNearest scales it up. Inert unless called.
  let nativeBuf = null;
  FILM.native = function native() {
    if (!nativeBuf) {
      const r = FILM.TIMELINE && FILM.TIMELINE.retro && FILM.TIMELINE.retro.native;
      const w = r && Number(r[0]) > 0 ? Number(r[0]) : 320;
      const h = r && Number(r[1]) > 0 ? Number(r[1]) : 180;
      const canvas = makeCanvas(w, h);
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingEnabled = false;
      nativeBuf = { canvas, ctx, w, h };
    }
    return nativeBuf;
  };
  /** Whole-pixel nearest-neighbour upscale of src to fill ctx's canvas. */
  FILM.presentNearest = function presentNearest(src, ctx) {
    const c = ctx.canvas;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, 0, 0, c.width, c.height);
    ctx.restore();
  };

  let ctxAttrs = {};
  FILM.mount = function mount(canvas, opts) {
    opts = opts || {};
    if (FILM.TIMELINE) prepare(); // picks up a timeline-declared frame size before the canvas is sized
    const S = opts.scale && opts.scale > 0 ? opts.scale : 1;
    FILM.S = S;
    canvas.width = Math.max(2, Math.round((FILM.W * S) / 2) * 2);
    canvas.height = Math.max(2, Math.round((FILM.H * S) / 2) * 2);
    ctxAttrs = { alpha: false };
    if (opts.readback) ctxAttrs.willReadFrequently = true;
    FILM.canvas = canvas;
    FILM.ctx = canvas.getContext('2d', ctxAttrs);
    layers.length = 0;
    return FILM.ctx;
  };

  // Photos are decoded once, before the first frame: drawing an undecoded image would silently draw
  // nothing on the cold pass and the real photo later, which is a determinism failure. Scenes read
  // FILM.photo(id) and get an image, or null when there is none.
  const photoImgs = {};
  let photosPromise = null;
  FILM.loadPhotos = function loadPhotos() {
    if (photosPromise) return photosPromise;
    const ids = Object.keys(FILM.PHOTOS);
    photosPromise = Promise.all(
      ids.map((id) => {
        const img = new Image(); /* photo-io */
        img.src = FILM.PHOTOS[id].uri; /* photo-io */
        return img.decode().then(() => {
          photoImgs[id] = img;
        });
      })
    ).then(() => {
      // Brand typefaces (src/photos.js FILM.FONTS): registered and loaded before the first frame, so
      // no frame is ever drawn in a fallback face (that would be a determinism failure).
      const fonts = FILM.FONTS || [];
      if (!fonts.length || typeof document === 'undefined' || !document.fonts) return ids.length;
      return Promise.all(
        fonts.map((f) => {
          const face = new FontFace(f.family, 'url(' + f.uri + ')', { weight: f.weight || '100 900', unicodeRange: f.range || 'U+0-10FFFF' }); /* photo-io */
          document.fonts.add(face); /* photo-io */
          return face.load(); /* photo-io */
        })
      ).then(() => ids.length);
    });
    return photosPromise;
  };
  FILM.photo = (id) => photoImgs[id] || null;

  FILM.baseTransform = function baseTransform(ctx) {
    const c = ctx.canvas;
    ctx.setTransform(c.width / FILM.W, 0, 0, c.height / FILM.H, 0, 0);
  };

  const layers = [];
  function layer(i) {
    const w = FILM.canvas.width;
    const h = FILM.canvas.height;
    let L = layers[i];
    if (!L || L.canvas.width !== w || L.canvas.height !== h) {
      const canvas = makeCanvas(w, h);
      L = layers[i] = { canvas, ctx: canvas.getContext('2d', ctxAttrs) };
    }
    return L;
  }

  // clear=true wipes the bitmap as well (ctx.reset where available).
  // clear=false unwinds any save() a scene left open and restores default state, keeping pixels.
  function resetCtx(ctx, clear) {
    if (clear && typeof ctx.reset === 'function') {
      ctx.reset();
    } else {
      for (let i = 0; i < 64; i++) ctx.restore();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.filter = 'none';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.shadowColor = 'rgba(0,0,0,0)';
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
      ctx.lineWidth = 1;
      ctx.lineCap = 'butt';
      ctx.lineJoin = 'miter';
      ctx.miterLimit = 10;
      ctx.fillStyle = '#000';
      ctx.strokeStyle = '#000';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.beginPath();
    }
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }

  // ---------------------------------------------------------------------------
  // Global post: boiling grain
  // ---------------------------------------------------------------------------

  const TILE = 512;
  const VARIANTS = 4;
  const grainCache = {};

  function grainTile(mode, v) {
    const key = mode + v;
    if (grainCache[key]) return grainCache[key];
    const c = makeCanvas(TILE, TILE);
    const g = c.getContext('2d');
    const img = g.createImageData(TILE, TILE);
    const d = img.data;
    const seed = (mode === 'schematic' ? 9001 : 4242) + v * 131;
    for (let y = 0; y < TILE; y++) {
      for (let x = 0; x < TILE; x++) {
        const i = (y * TILE + x) * 4;
        const n = ihash(x, y, seed);
        // paper tooth: soft 2-3 px clumps from a wrapped coarse cell, plus a little per-pixel noise
        const cx0 = (x >> 2) % (TILE >> 2), cy0 = (y >> 2) % (TILE >> 2);
        const fx = ((x & 3) + 0.5) / 4, fy = ((y & 3) + 0.5) / 4;
        const q = TILE >> 2;
        const c00 = ihash(cx0, cy0, seed + 7), c10 = ihash((cx0 + 1) % q, cy0, seed + 7);
        const c01 = ihash(cx0, (cy0 + 1) % q, seed + 7), c11 = ihash((cx0 + 1) % q, (cy0 + 1) % q, seed + 7);
        const cn = (c00 * (1 - fx) + c10 * fx) * (1 - fy) + (c01 * (1 - fx) + c11 * fx) * fy;
        if (mode === 'schematic') {
          const v2 = n * 0.7 + cn * 0.3;
          if (v2 > 0.62) {
            d[i] = 214; d[i + 1] = 220; d[i + 2] = 255;
            d[i + 3] = Math.min(255, (v2 - 0.62) * 2.6 * 50);
          } else if (v2 < 0.3) {
            d[i] = 2; d[i + 1] = 3; d[i + 2] = 12;
            d[i + 3] = (0.3 - v2) * 3.3 * 60;
          }
        } else {
          const v2 = n * 0.35 + cn * 0.65;
          if (v2 > 0.56) {
            d[i] = 58; d[i + 1] = 38; d[i + 2] = 22;
            d[i + 3] = Math.min(255, (v2 - 0.56) * 2.27 * 34);
          } else if (v2 < 0.36) {
            d[i] = 255; d[i + 1] = 250; d[i + 2] = 236;
            d[i + 3] = (0.36 - v2) * 2.8 * 30;
          }
          // rare dark specks
          if (n > 0.99965) { d[i] = 40; d[i + 1] = 26; d[i + 2] = 16; d[i + 3] = 120; }
        }
      }
    }
    g.putImageData(img, 0, 0);
    grainCache[key] = c;
    return c;
  }

  function postShot(ctx, shot, def, T) {
    const mode = modeOf(shot);
    if (mode === 'none') return;
    if (FILM.post === false) return; // tools measure a bare frame; never set in the shipped player
    let cfg = def && def.post !== undefined ? def.post : shot.post;
    if (cfg === false) return;
    let amount = 1;
    if (typeof cfg === 'number') amount = cfg;
    else if (cfg && typeof cfg === 'object' && cfg.grain != null) amount = Number(cfg.grain);
    if (!(amount > 0)) return;
    const b = Math.floor(T * FILM.BOIL_FPS + EPS);
    const v = Math.floor(ihash(b, 17, 3) * VARIANTS);
    const tile = grainTile(mode, v);
    const ox = Math.floor(ihash(b, 29, 5) * TILE);
    const oy = Math.floor(ihash(b, 31, 7) * TILE);
    const c = ctx.canvas;
    // the tile is authored in logical pixels: scale it with the render so previews keep the grain size
    const S = c.width / FILM.W;
    const pattern = ctx.createPattern(tile, 'repeat');
    if (Math.abs(S - 1) > EPS && typeof pattern.setTransform === 'function' && typeof DOMMatrix !== 'undefined') {
      pattern.setTransform(new DOMMatrix([S, 0, 0, S, 0, 0]));
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = Math.min(1, amount);
    ctx.fillStyle = pattern;
    ctx.translate(-ox * S, -oy * S);
    ctx.fillRect(0, 0, c.width + ox * S, c.height + oy * S);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Drawing
  // ---------------------------------------------------------------------------

  function drawCard(ctx, title, lines, bg) {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, FILM.W, FILM.H);
    ctx.fillStyle = '#fff';
    ctx.font = '600 44px ui-monospace, Menlo, monospace';
    ctx.fillText(title, 60, 200);
    ctx.font = '28px ui-monospace, Menlo, monospace';
    let y = 270;
    for (const line of lines) {
      for (let k = 0; k < line.length; k += 56) {
        ctx.fillText(line.slice(k, k + 56), 60, y);
        y += 40;
      }
    }
  }

  function drawShot(ctx, shot, T, outgoing) {
    resetCtx(ctx, true);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    const def = FILM.registry[shot.id];
    let t = Math.max(0, T - shot.start);
    if (outgoing) t = Math.min(t, shot.dur);
    const info = {
      dur: shot.dur,
      p: shot.dur > 0 ? clamp01(t / shot.dur) : 0,
      T,
      frame: Math.floor(T * FILM.FPS + EPS),
      W: FILM.W,
      H: FILM.H,
      S: FILM.S,
      lib: FILM.lib,
      shot,
      mode: modeOf(shot),
      outgoing: !!outgoing,
    };
    frameT = T;
    FILM.baseTransform(ctx);
    if (!def) {
      const msg = `no scene registered for shot '${shot.id}' (expected in ${shot.file || 'src/scenes/?'})`;
      FILM.errors.push({ T, shot: shot.id, message: msg, missing: true });
      drawCard(ctx, 'missing scene', [shot.id, String(shot.file || '')], '#2a2a2a');
    } else {
      try {
        ctx.save();
        def.draw(ctx, t, info);
      } catch (e) {
        FILM.errors.push({ T, shot: shot.id, message: String((e && e.message) || e), stack: e && e.stack });
        resetCtx(ctx, false);
        FILM.baseTransform(ctx);
        drawCard(ctx, 'scene error', [shot.id, String((e && e.message) || e)], '#5a1010');
        if (FILM.strict) throw e;
      }
      resetCtx(ctx, false);
    }
    postShot(ctx, shot, def, T);
  }

  // fade, iris and wipe: A is the outgoing shot, B the incoming one, p in (0, 1) exclusive.
  function composite(ctx, A, B, tr, p) {
    resetCtx(ctx, true);
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    ctx.drawImage(A, 0, 0);
    switch (tr.kind) {
      case 'fade':
        ctx.globalAlpha = e;
        ctx.drawImage(B, 0, 0);
        break;
      case 'iris': {
        const S = w / FILM.W;
        const cx = (tr.x != null ? tr.x : FILM.W / 2) * S;
        const cy = (tr.y != null ? tr.y : FILM.H / 2) * S;
        const R = Math.hypot(Math.max(cx, w - cx), Math.max(cy, h - cy));
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(0.001, e * R), 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(B, 0, 0);
        break;
      }
      case 'wipe': {
        const dir = tr.dir || 'down';
        ctx.beginPath();
        if (dir === 'up') ctx.rect(0, h * (1 - e), w, h * e);
        else if (dir === 'left') ctx.rect(w * (1 - e), 0, w * e, h);
        else if (dir === 'right') ctx.rect(0, 0, w * e, h);
        else ctx.rect(0, 0, w, h * e);
        ctx.clip();
        ctx.drawImage(B, 0, 0);
        break;
      }
      default:
        ctx.drawImage(B, 0, 0);
    }
    resetCtx(ctx, false);
  }

  // Registered transition hooks: FILM.transitions[kind] = (ctx, prev, shot, T, k, n) => false | other.
  // Returning exactly false (or no hook) runs the built-in kind.
  FILM.transitions = {};
  const KINDS = { cut: 1, fade: 1, flash: 1, iris: 1, wipe: 1 };
  FILM.TRANSITION_KINDS = Object.keys(KINDS);

  /** Draws global time T (seconds) to FILM.canvas. Returns the active shot entry. */
  // Screen-fixed overlay drawn over every finished frame (subtitles, safe-area guides). The film's UI
  // kit (src/props.js) installs FILM.overlay; it is a pure function of (ctx, T) like any scene.
  FILM.renderFrame = function renderFrame(T) {
    const shot = renderFrameInner(T);
    if (typeof FILM.overlay === 'function' && FILM.ctx) {
      const ctx = FILM.ctx;
      resetCtx(ctx, false);
      FILM.baseTransform(ctx);
      try {
        ctx.save();
        FILM.overlay(ctx, Math.min(Math.max(0, Number(T) || 0), prepare().duration || Infinity));
      } catch (e) {
        FILM.errors.push({ T, shot: 'overlay', message: String((e && e.message) || e), stack: e && e.stack });
        if (FILM.strict) throw e;
      }
      resetCtx(ctx, false);
    }
    return shot;
  };

  function renderFrameInner(T) {
    const P = prepare();
    if (!FILM.ctx) throw new Error('FILM.renderFrame: call FILM.mount(canvas) first');
    T = Number(T) || 0;
    if (T < 0) T = 0;
    if (P.duration > 0 && T > P.duration) T = P.duration;
    const idx = shotIndexAt(T);
    const ctx = FILM.ctx;
    if (idx < 0) {
      resetCtx(ctx, true);
      FILM.baseTransform(ctx);
      drawCard(ctx, 'empty timeline', ['FILM.TIMELINE.shots is empty'], '#222');
      return null;
    }
    const shot = P.shots[idx];
    const tr = shot.transitionIn;
    const inT = T - shot.start;
    if (!(idx > 0 && tr && tr.kind !== 'cut' && tr.dur > 0 && inT < tr.dur - EPS)) {
      drawShot(ctx, shot, T, false);
      return shot;
    }
    const hook = FILM.transitions[tr.kind];
    if (typeof hook === 'function') {
      const prevShot = P.shots[idx - 1];
      if (!(FILM.only && !FILM.registry[prevShot.id])) {
        const hk = Math.max(0, inT * FILM.FPS);
        if (hook(ctx, prevShot, shot, T, hk, tr.dur * FILM.FPS) !== false) return shot;
      }

    }
    for (let i = 0; i <= k; i++) {
      const a = Math.PI / 2 + (i / k) * Math.PI;
      const x = -half + Math.cos(a) * r, y = Math.sin(a) * r;
      out.push([cx + x * cr - y * sr, cy + x * sr + y * cr]);
    }
    return out;
  };

  /** tracePath(ctx, pts, closed=true) : adds the polyline to the current path (no beginPath). */
  lib.tracePath = (ctx, pts, closed = true) => {
    for (let i = 0; i < pts.length; i++) {
      const p = XY(pts[i]);
      if (i === 0) ctx.moveTo(p[0], p[1]);
      else ctx.lineTo(p[0], p[1]);
    }
    if (closed) ctx.closePath();
  };

  /**
   * Centripetal Catmull-Rom resample (no overshoot or cusps where long and short segments meet).
   * Returns a flat [x0,y0,x1,y1,...] array (closed: no duplicate end).
   */
  function sampleFlat(P, closed, step, smooth) {
    const n = P.length;
    const out = [];
    const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const p1 = P[i];
      const p2 = P[(i + 1) % n];
      const d = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      const k = Math.max(1, Math.ceil(d / step));
      if (!smooth || n < 3) {
        for (let j = 0; j < k; j++) out.push(lerp(p1[0], p2[0], j / k), lerp(p1[1], p2[1], j / k));
        continue;
      }
      let p0, p3;
      if (closed) {
        p0 = P[(i - 1 + n) % n];
        p3 = P[(i + 2) % n];
      } else {
        p0 = i > 0 ? P[i - 1] : [2 * p1[0] - p2[0], 2 * p1[1] - p2[1]];
        p3 = i + 2 < n ? P[i + 2] : [2 * p2[0] - p1[0], 2 * p2[1] - p1[1]];
      }
      const t1 = Math.sqrt(Math.hypot(p1[0] - p0[0], p1[1] - p0[1])) || 1e-4;
      const t2 = t1 + (Math.sqrt(d) || 1e-4);
      const t3 = t2 + (Math.sqrt(Math.hypot(p3[0] - p2[0], p3[1] - p2[1])) || 1e-4);
      for (let j = 0; j < k; j++) {
        const t = t1 + (t2 - t1) * (j / k);
        const a1x = ((t1 - t) / t1) * p0[0] + (t / t1) * p1[0];
        const a1y = ((t1 - t) / t1) * p0[1] + (t / t1) * p1[1];
        const a2x = ((t2 - t) / (t2 - t1)) * p1[0] + ((t - t1) / (t2 - t1)) * p2[0];
        const a2y = ((t2 - t) / (t2 - t1)) * p1[1] + ((t - t1) / (t2 - t1)) * p2[1];
        const a3x = ((t3 - t) / (t3 - t2)) * p2[0] + ((t - t2) / (t3 - t2)) * p3[0];
        const a3y = ((t3 - t) / (t3 - t2)) * p2[1] + ((t - t2) / (t3 - t2)) * p3[1];
        const b1x = ((t2 - t) / t2) * a1x + (t / t2) * a2x;
        const b1y = ((t2 - t) / t2) * a1y + (t / t2) * a2y;
        const b2x = ((t3 - t) / (t3 - t1)) * a2x + ((t - t1) / (t3 - t1)) * a3x;
        const b2y = ((t3 - t) / (t3 - t1)) * a2y + ((t - t1) / (t3 - t1)) * a3y;
        out.push(((t2 - t) / (t2 - t1)) * b1x + ((t - t1) / (t2 - t1)) * b2x, ((t2 - t) / (t2 - t1)) * b1y + ((t - t1) / (t2 - t1)) * b2y);
      }
    }
    if (!closed) out.push(P[n - 1][0], P[n - 1][1]);
    return out;
  }

  /** smoothPts(pts, closed, step=6) : Catmull-Rom resampled points as [[x,y],...]. */
  lib.smoothPts = (pts, closed = true, step = 6) => {
    const f = sampleFlat(pts.map(XY), closed, step, true);
    const out = [];
    for (let i = 0; i < f.length; i += 2) out.push([f[i], f[i + 1]]);
    return out;
  };

  function toPolys(clip) {
    if (!Array.isArray(clip) || !clip.length) return null;
    const first = clip[0];
    if (Array.isArray(first) && typeof first[0] === 'number') return [clip];
    if (first && typeof first.x === 'number') return [clip.map(XY)];
    return clip.map((poly) => poly.map(XY));
  }

  /** polyContains(pointsOrPolys, x, y) : even-odd point-in-polygon. */
  function polysContain(polys, x, y) {
    let inside = false;
    for (let p = 0; p < polys.length; p++) {
      const poly = polys[p];
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
        if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
      }
    }
    return inside;
  }
  lib.polyContains = (clip, x, y) => polysContain(toPolys(clip), x, y);

  function polysBounds(polys) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const poly of polys) {
      for (const p of poly) {
        if (p[0] < x0) x0 = p[0];
        if (p[1] < y0) y0 = p[1];
        if (p[0] > x1) x1 = p[0];
        if (p[1] > y1) y1 = p[1];
      }
    }
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  lib.bounds = (pts) => polysBounds(toPolys(pts));

  function normBounds(b) {
    if (!b) return { x: 0, y: 0, w: W(), h: H() };
    if (Array.isArray(b)) return { x: b[0], y: b[1], w: b[2], h: b[3] };
    return b;
  }

  /** Resolves a clip argument into { polys, bounds, hard(ctx) }. */
  function shapeOf(clip, o) {
    const polys = toPolys(clip);
    if (polys) {
      const b = polysBounds(polys);
      const pad = o.pad != null ? o.pad : 0;
      return {
        polys,
        bounds: { x: b.x - pad, y: b.y - pad, w: b.w + 2 * pad, h: b.h + 2 * pad },
        apply(ctx) {
          ctx.beginPath();
          for (const poly of polys) lib.tracePath(ctx, poly, true);
          ctx.clip('evenodd');
        },
      };
    }
    const bounds = normBounds(o.bounds);
    if (typeof clip === 'function') {
      return { polys: null, bounds, apply(ctx) { ctx.beginPath(); clip(ctx); ctx.clip(o.fillRule || 'nonzero'); } };
    }
    if (typeof Path2D !== 'undefined' && clip instanceof Path2D) {
      return { polys: null, bounds, apply(ctx) { ctx.clip(clip, o.fillRule || 'nonzero'); } };
    }
    return { polys: null, bounds, apply: null };
  }

  // ===========================================================================
  // Canvas cache (pure: keyed by every input, LRU)
  // ===========================================================================

  // Sized from the timeline (read lazily: lib loads before timeline.js) so a looping player keeps
  // every shot's paper or blueprint plate warm and does not rebuild one at each shot change.
  const cache = new Map();
  function cacheMax() {
    const tl = FILM.TIMELINE;
    const shots = tl && Array.isArray(tl.shots) ? tl.shots.length : 0;
    return Math.max(24, shots * 2 + 8);
  }
  function cached(key, make) {
    if (cache.has(key)) {
      const v = cache.get(key);
      cache.delete(key);
      cache.set(key, v);
      return v;
    }
    const v = make();
    cache.set(key, v);
    const max = cacheMax();
    while (cache.size > max) cache.delete(cache.keys().next().value);
    return v;
  }
  function newCanvas(w, h) {
    if (FILM.makeCanvas) return FILM.makeCanvas(w, h);
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }
  lib.cached = cached;

  // ===========================================================================
  // Ink lines
  // ===========================================================================

  /*
   * One stroke pass over a resampled centreline (flat arrays X, Y with normals NX, NY and
   * arc length S). Builds a pressure-width ribbon out of quads so every overlap unions cleanly,
   * and fills it in one call.
   */
  function ribbon(ctx, X, Y, NX, NY, S, i0, i1, q) {
    const n = i1 - i0 + 1;
    if (n < 2) return null;
    const s0 = S[i0];
    const L = Math.max(1e-6, S[i1] - s0);
    const DX = new Float64Array(n);
    const DY = new Float64Array(n);
    const bs = q.boilSeed;
    const wf = q.wobbleFreq;
    for (let k = 0; k < n; k++) {
      const i = i0 + k;
      const s = S[i] - s0 + q.phase;
      let d =
        q.wobble * (0.72 * noise1(s * wf, q.seed) + 0.28 * noise1(s * wf * 3.3, q.seed + 1)) +
        q.tremble * noise1(s / 7.5, q.seed + 2) +
        q.boilAmp * noise1(s * wf * 2.2 + 0.37, bs) +
        q.tremble * 0.7 * noise1(s / 6.3, bs + 5) +
        q.offset;
      if (q.closeBlend > 0 && S[i1] - S[i] < q.closeBlend) {
        // pen returning to the start: pull toward the start's displacement, not all the way
        const u = 1 - (S[i1] - S[i]) / q.closeBlend;
        const s2 = s - q.loopLen;
        const d0 =
          q.wobble * (0.72 * noise1(s2 * wf, q.seed) + 0.28 * noise1(s2 * wf * 3.3, q.seed + 1)) +
          q.boilAmp * noise1(s2 * wf * 2.2 + 0.37, bs) +
          q.offset;
        d = lerp(d, d0, u * u * (3 - 2 * u) * 0.8);
      }
      DX[k] = X[i] + NX[i] * d;
      DY[k] = Y[i] + NY[i] * d;
    }
    // width profile
    const Wd = new Float64Array(n);
    const tIn = Math.min(q.taperIn, L * 0.45);
    const tOut = Math.min(q.taperOut, L * 0.45);
    for (let k = 0; k < n; k++) {
      const s = S[i0 + k] - s0;
      let w = q.width;
      if (tIn > 0 && s < tIn) w *= q.minW + (1 - q.minW) * Math.pow(s / tIn, 0.55);
      if (tOut > 0 && L - s < tOut) w *= q.minW + (1 - q.minW) * Math.pow((L - s) / tOut, 0.7);
      w *= 1 + q.widthJitter * (0.6 * noise1(s * 0.012 + 3.1, q.seed + 3) + 0.4 * noise1(s * 0.045, q.seed + 4));
      if (q.swell) w *= 1 + q.swell * Math.sin(Math.PI * clamp(s / L));
      if (q.pressure) w *= q.pressure(s / L);
      Wd[k] = Math.max(0.05, w) * 0.5;
    }
    // offset normals from the displaced line
    const LX = new Float64Array(n), LY = new Float64Array(n), RX = new Float64Array(n), RY = new Float64Array(n);
    for (let k = 0; k < n; k++) {
      const a = k > 0 ? k - 1 : k;
      const b = k < n - 1 ? k + 1 : k;
      let tx = DX[b] - DX[a], ty = DY[b] - DY[a];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl;
      ty /= tl;
      const s = S[i0 + k];
      const wl = Math.max(0.03, Wd[k] + q.rough * noise1(s / 3.1, q.seed + 20));
      const wr = Math.max(0.03, Wd[k] + q.rough * noise1(s / 3.1, q.seed + 21));
      LX[k] = DX[k] - ty * wl;
      LY[k] = DY[k] + tx * wl;
      RX[k] = DX[k] + ty * wr;
      RY[k] = DY[k] - tx * wr;
    }
    ctx.beginPath();
    for (let k = 0; k < n - 1; k++) {
      ctx.moveTo(LX[k], LY[k]);
      ctx.lineTo(LX[k + 1], LY[k + 1]);
      ctx.lineTo(RX[k + 1], RY[k + 1]);
      ctx.lineTo(RX[k], RY[k]);
      ctx.closePath();
    }
    // soft round ends
    ctx.moveTo(DX[0] + Wd[0], DY[0]);
    ctx.arc(DX[0], DY[0], Wd[0], 0, TAU);
    ctx.moveTo(DX[n - 1] + Wd[n - 1], DY[n - 1]);
    ctx.arc(DX[n - 1], DY[n - 1], Wd[n - 1], 0, TAU);
    ctx.fill('nonzero');
    return { DX, DY };
  }

  function centreline(pts, closed, step, smooth, startFrac, overlapPx) {
    const P = pts.map(XY);
    let F = sampleFlat(P, closed, step, smooth);
    let m = F.length / 2;
    let loopLen = 0;
    if (closed && m > 2) {
      // rotate so the pen starts at a seeded place, then run past the start
      const st = Math.floor(startFrac * m) % m;
      const R = new Array(F.length);
      for (let k = 0; k < m; k++) {
        R[2 * k] = F[2 * ((k + st) % m)];
        R[2 * k + 1] = F[2 * ((k + st) % m) + 1];
      }
      for (let k = 0; k < m; k++) loopLen += Math.hypot(R[(2 * (k + 1)) % R.length] - R[2 * k], R[((2 * (k + 1)) % R.length) + 1] - R[2 * k + 1]);
      R.push(R[0], R[1]);
      let acc = 0;
      for (let k = 1; k <= m && acc < overlapPx; k++) {
        const x = R[2 * (k % m)], y = R[2 * (k % m) + 1];
        acc += Math.hypot(x - R[R.length - 2], y - R[R.length - 1]);
        R.push(x, y);
      }
      F = R;
      m = F.length / 2;
    }
    const X = new Float64Array(m), Y = new Float64Array(m), S = new Float64Array(m);
    for (let k = 0; k < m; k++) {
      X[k] = F[2 * k];
      Y[k] = F[2 * k + 1];
      if (k > 0) S[k] = S[k - 1] + Math.hypot(X[k] - X[k - 1], Y[k] - Y[k - 1]);
    }
    const NX = new Float64Array(m), NY = new Float64Array(m);
    for (let k = 0; k < m; k++) {
      const a = Math.max(0, k - 2), b = Math.min(m - 1, k + 2);
      let tx = X[b] - X[a], ty = Y[b] - Y[a];
      const tl = Math.hypot(tx, ty) || 1;
      NX[k] = -ty / tl;
      NY[k] = tx / tl;
    }
    return { X, Y, S, NX, NY, m, loopLen };
  }

  /**
   * inkPath(ctx, points, opts) : a hand-inked line or closed shape.
   *   closed      false
   *   width       3        nominal pen width (art bible: hero 5, secondary 3, detail 1.8)
   *   color       pal.ink
   *   alpha       1
   *   seed        1        give each drawn object its own seed so their wobbles differ
   *   smooth      true     Catmull-Rom through the points (false = straight segments)
   *   step        2.5      resample spacing in px
   *   wobble      2        low-frequency drift amplitude (px)
   *   wobbleFreq  1/150    drift frequency (cycles per px)
   *   tremble     0.4      high-frequency hand tremble (px)
   *   rough       0.22+0.07*width  ragged ink edge (px), each side independent
   *   boil        auto     drawing index (default lib.boil(lib.T)); false freezes the line
   *   boilAmp     0.7      how far the line moves between boil drawings (px)
   *   taper       [18,34]  px of taper at start and end (number = both)
   *   minWidth    0.14     width fraction at the very tips
   *   swell       0.2      extra width through the middle of an open stroke
   *   widthJitter 0.34     pressure variation (slow plus a faster drag)
   *   pressure    null     fn(u 0..1) => width multiplier
   *   overlap     14       closed shapes: how far the pen runs past its start (px)
   *   fill        null     closed shapes: fill colour under the line (uses the wobbled outline)
   *   fillAlpha   1
   *   draw        1        draw-on progress 0..1 along the stroke (0 draws nothing; a fill waits for 1)
   *   double      false    true or { offset, width, alpha, from, to, seed }: a second quick retrace
   *                        (defaults: 30 percent of the width, min 1.5 px at 5 px, 3 px clear of the line, alpha 0.4)
   */
  function inkPath(ctx, pts, o = {}) {
    if (!pts || pts.length < 2) return;
    const drawP = o.draw == null ? 1 : clamp(o.draw);
    if (drawP <= 0) return;
    const closed = !!o.closed;
    const seed = seedInt(o.seed === undefined ? 1 : o.seed);
    const width = o.width != null ? o.width : 3;
    const step = o.step || 2.5;
    const smooth = o.smooth !== false;
    const taper = o.taper != null ? o.taper : closed ? [10, 22] : [18, 34];
    const tIn = Array.isArray(taper) ? taper[0] : taper;
    const tOut = Array.isArray(taper) ? taper[1] : taper;
    const overlap = closed ? (o.overlap != null ? o.overlap : 14) : 0;
    const C = centreline(pts, closed, step, smooth, closed ? h3(seed, 11, 3) : 0, overlap);
    if (C.m < 2) return;
    const b = boilIndex(o);
    const q = {
      seed,
      width,
      wobble: o.wobble != null ? o.wobble : 2,
      wobbleFreq: o.wobbleFreq || 1 / 150,
      tremble: o.tremble != null ? o.tremble : 0.4,
      rough: o.rough != null ? o.rough : 0.22 + width * 0.07,
      boilAmp: o.boil === false ? 0 : o.boilAmp != null ? o.boilAmp : 0.7,
      boilSeed: (hash(seed, b) | 0) & 0x7fffffff,
      taperIn: tIn,
      taperOut: tOut,
      minW: o.minWidth != null ? o.minWidth : 0.14,
      swell: closed ? 0 : o.swell != null ? o.swell : 0.2,
      widthJitter: o.widthJitter != null ? o.widthJitter : 0.34,
      pressure: o.pressure || null,
      offset: 0,
      phase: 0,
      closeBlend: closed ? Math.min(60, C.loopLen * 0.25) + overlap : 0,
      loopLen: C.loopLen,
    };
    let iEnd = C.m - 1;
    if (drawP < 1) {
      // stop the pen partway along the centreline; a partial closed shape gets no fill and no
      // close-blend, and its tip is blunt rather than tapered to nothing
      const Lp = C.S[C.m - 1] * drawP;
      while (iEnd > 1 && C.S[iEnd] > Lp) iEnd--;
      q.closeBlend = 0;
      q.taperOut = Math.min(q.taperOut, 6);
    }
    ctx.save();
    const color = o.color || pal.ink;
    const alpha = o.alpha != null ? o.alpha : 1;
    if (closed && o.fill && drawP >= 1) {
      // fill follows the wobbled outline (without the overlap run)
      const F = ribbonLine(C, q, 0, Math.max(1, C.m - 1));
      ctx.beginPath();
      for (let k = 0; k < F.n; k++) {
        if (C.S[k] > C.loopLen) break;
        if (k === 0) ctx.moveTo(F.DX[k], F.DY[k]);
        else ctx.lineTo(F.DX[k], F.DY[k]);
      }
      ctx.closePath();
      ctx.globalAlpha *= o.fillAlpha != null ? o.fillAlpha : 1;
      ctx.fillStyle = o.fill;
      ctx.fill();
      ctx.restore();
      ctx.save();
    }
    ctx.globalAlpha *= alpha;
    ctx.fillStyle = color;
    ribbon(ctx, C.X, C.Y, C.NX, C.NY, C.S, 0, iEnd, q);
    if (o.double && drawP >= 1) {
      const d = o.double === true ? {} : o.double;
      const ds = seedInt(d.seed != null ? d.seed : seed + 977);
      const r = rng(ds);
      const L = C.S[C.m - 1];
      let f0 = d.from != null ? d.from : closed ? r.range(0, 0.35) : r.range(0.03, 0.18);
      let f1 = d.to != null ? d.to : closed ? f0 + r.range(0.45, 0.75) : r.range(0.72, 0.95);
      f1 = Math.min(1, f1);
      let i0 = 0, i1 = C.m - 1;
      while (i0 < C.m - 1 && C.S[i0] < f0 * L) i0++;
      while (i1 > i0 && C.S[i1] > f1 * L) i1--;
      const q2 = Object.assign({}, q, {
        seed: ds,
        width: d.width != null ? width * d.width : Math.max(1.2, width * 0.3),
        rough: 0.15 + (d.width != null ? width * d.width : Math.max(1.2, width * 0.3)) * 0.07,
        offset: d.offset != null ? d.offset : (width / 2 + 3) * (r() < 0.5 ? -1 : 1),
        wobble: q.wobble * 1.3,
        boilSeed: (hash(ds, b) | 0) & 0x7fffffff,
        taperIn: Math.max(tIn, 26),
        taperOut: Math.max(tOut, 40),
        closeBlend: 0,
        swell: 0.35,
      });
      ctx.globalAlpha *= d.alpha != null ? d.alpha : 0.4;
      ribbon(ctx, C.X, C.Y, C.NX, C.NY, C.S, i0, i1, q2);
    }
    ctx.restore();
  }

  // displaced centreline only (for fills)
  function ribbonLine(C, q, i0, i1) {
    const n = i1 - i0 + 1;
    const DX = new Float64Array(n), DY = new Float64Array(n);
    const wf = q.wobbleFreq;
    for (let k = 0; k < n; k++) {
      const i = i0 + k;
      const s = C.S[i];
      const d =
        q.wobble * (0.72 * noise1(s * wf, q.seed) + 0.28 * noise1(s * wf * 3.3, q.seed + 1)) +
        q.boilAmp * noise1(s * wf * 2.2 + 0.37, q.boilSeed);
      DX[k] = C.X[i] + C.NX[i] * d;
      DY[k] = C.Y[i] + C.NY[i] * d;
    }
    return { DX, DY, n };
  }

  lib.inkPath = inkPath;

  // ===========================================================================
  // Photo-doodle mode: watercolour wash, photo cut-outs, handwriting
  // Inert in a zero-asset film — nothing below is called unless a scene calls it.
  // ===========================================================================

  /**
   * wash(ctx, pts, opts) : a translucent watercolour fill that deliberately misses its outline.
   *   color      pal.washYellow or pal.sunYellow   alpha 0.55   seed 1
   *   offset     [4, 3]   px shift off the ink outline (the mis-registration is the look)
   *   spread     3        px of edge wobble   p 1   fade-in 0..1 (the wash arrives after its outline)
   *   edge       0.35     darker pigment rim strength (0 = none)
   */
  lib.wash = (ctx, pts, o = {}) => {
    const p = o.p == null ? 1 : clamp(o.p);
    if (p <= 0 || !pts || pts.length < 3) return;
    const seed = seedInt(o.seed == null ? 1 : o.seed);
    const off = o.offset || [4, 3];
    const spread = o.spread != null ? o.spread : 3;
    const color = o.color || pal.washYellow || pal.sunYellow || pal.ink;
    const sm = lib.smoothPts(pts, true, 5);
    const n = sm.length;
    let cx = 0, cy = 0;
    for (const q of sm) { cx += q[0]; cy += q[1]; }
    cx /= n; cy /= n;
    const ring = (amp, sd) => {
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const [x, y] = sm[i];
        const dx = x - cx, dy = y - cy, dl = Math.hypot(dx, dy) || 1;
        const d = amp * noise1(i * 0.09, sd) + amp * 0.4 * noise1(i * 0.31, sd + 7);
        const X = x + off[0] + (dx / dl) * d, Y = y + off[1] + (dy / dl) * d;
        if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
      ctx.closePath();
    };
    ctx.save();
    ctx.globalAlpha *= (o.alpha != null ? o.alpha : 0.55) * p;
    ctx.fillStyle = color;
    ring(spread, seed);
    ctx.fill();
    const edge = o.edge != null ? o.edge : 0.35;
    if (edge > 0) {
      ctx.globalAlpha *= edge;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';
      ring(spread * 1.2, seed + 3);
      ctx.stroke();
    }
    ctx.restore();
  };

  /**
   * photo(ctx, id, cx, baseY, opts) : a background-removed photograph standing on the paper, with a
   * soft contact shadow. Positioned by bottom-centre, so objects sit on a floor line.
   *   h (height px, default 620) or w   rot 0 (radians, about the base centre)   scale 1 (pop-in)
   *   shadow 0.38 (contact shadow alpha, 0 = none)   alpha 1
   * Returns { x, y, w, h } of the unscaled, unrotated placement — anchor doodles off this rather
   * than off guessed pixels. Returns null when the id is not in FILM.PHOTOS.
   *
   * One caution the gate will catch late: drawing the SAME photo at two different sizes in one page
   * can resample differently once the browser has a texture history for it, which reads as
   * non-determinism. If a film needs a photo at two sizes (an end-card grid of every shot), draw the
   * small one through an offscreen canvas at 1:1 instead of scaling it live.
   */
  lib.photo = (ctx, id, cx, baseY, o = {}) => {
    const F = typeof window !== 'undefined' ? window.FILM : globalThis.FILM;
    const img = F && F.photo ? F.photo(id) : null;
    const meta = F && F.PHOTOS ? F.PHOTOS[id] : null;
    if (!img || !meta) return null;
    const h = o.w != null ? (o.w * meta.h) / meta.w : o.h != null ? o.h : 620;
    const w = (h * meta.w) / meta.h;
    const box = { x: cx - w / 2, y: baseY - h, w, h };
    const sc = o.scale != null ? o.scale : 1;
    if (sc <= 0) return box;
    ctx.save();
    ctx.globalAlpha *= o.alpha != null ? o.alpha : 1;
    const sh = o.shadow != null ? o.shadow : 0.38;
    if (sh > 0) {
      const g = ctx.createRadialGradient(cx, baseY, 0, cx, baseY, w * 0.62 * sc);
      g.addColorStop(0, `rgba(48,36,24,${sh})`);
      g.addColorStop(0.55, `rgba(48,36,24,${sh * 0.42})`);
      g.addColorStop(1, 'rgba(48,36,24,0)');
      ctx.save();
      ctx.translate(cx, baseY);
      ctx.scale(1, 0.14);
      ctx.translate(-cx, -baseY);
      ctx.fillStyle = g;
      ctx.fillRect(cx - w, baseY - w, w * 2, w * 2);
      ctx.restore();
    }
    ctx.translate(cx, baseY);
    if (o.rot) ctx.rotate(o.rot);
    ctx.scale(sc, sc);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, -w / 2, -h, w, h);
    ctx.restore();
    return box;
  };

  /**
   * hand(ctx, str, x, y, opts) : handwritten marker lettering in a system hand face (no font files),
   * revealed letter by letter with p. Weights above 700 fall out of the hand faces onto a geometric
   * fallback, so they are clamped.
   */
  lib.hand = (ctx, str, x, y, o = {}) => {
    const q = Object.assign({ size: 46, color: pal.ink }, o);
    q.family = HAND_STACK;
    q.weight = Math.min(700, Number(q.weight) || 400);
