<script>
// ---- src/scenes/12-cta.js
/*
 * 12 · Выбрать маршрут сейчас — s12
 * 60 cut: T 54–60 (6 s) · 45 cut: T 41–45 (4 s) · hard cut in from s11. The last frame IS the call to
 * action: no fade to black.
 *
 * Page ending (FILM.ui.variant(info) === 'page'):
 *   brand (brand position) · «Выбери маршрут ниже» 88 px (baseline 290) · «Сделай первый шаг сегодня»
 *   40 px text2 (baseline 350) · the three route cards on G1 (CARD_ROW, label 'both', «Начать маршрут»)
 *   · ui.arrowDown(960, 812, 56) under the middle card (ink ends at y 868).
 *   The route line s11 left on screen (same curve, ROUTE_PTS) retracts its tail behind the rising cards;
 *   only its last, vertical piece stays — exactly where the arrow's shaft is — and it becomes the arrow.
 *   Assembled by 56.0 (45: 41.5), then static except a barely visible glow breathing on the arrow.
 *
 * External ending ('external'):
 *   brand · «Открой бесплатный гид» 88 px · the address irreplaceable-ai.ru/learn in JetBrains Mono 600
 *   84 px accent inside a field — on screen from the scene's first frame to the last · «Выбери свой
 *   маршрут» 40 px · three glyph tiles (with their short route names) in a row. No arrow. The s11 line
 *   retracts into its head and goes out.
 *
 * Layers (back to front):
 *   1 ui.bg
 *   2 the s11 route line (retracting)
 *   3 page: route cards · arrow   |   external: address field · route tiles
 *   4 brand, title, second line
 */
(function () {
  'use strict';
  const ID = 's12';

  // identical copy of s11's final route pose (11-free.js) — the handoff across the cut
  const ROUTE_PTS = [[-40, 716], [380, 716], [760, 718], [920, 742], [958, 800], [960, 868]];
  const ROUTE_W = 5;
  const ARROW = { x: 960, y: 812, len: 56 };

  const URL = 'irreplaceable-ai.ru/learn';

  const SCHED = {
    60: {
      page: { cards: [0.0, 0.15, 0.3], cardD: 0.7, retract: [0.0, 1.0], brand: 0.1, title: 1.0, sub: 1.3, arrow: [1.2, 0.5], breathe: 2.0 },
      ext: { retract: [0.0, 0.9], brand: 0.1, title: 0.3, sub: 1.0, tiles: [1.2, 1.4, 1.6], breathe: 2.2 },
    },
    45: {
      page: { cards: [0.0, 0.03, 0.06], cardD: 0.44, retract: [0.0, 0.3], brand: 0.0, title: 0.05, sub: 0.1, arrow: [0.25, 0.25], breathe: 0.5 },
      ext: { retract: [0.0, 0.5], brand: 0.0, title: 0.05, sub: 0.3, tiles: [0.4, 0.5, 0.6], breathe: 1.1 },
    },
  };

  // arc-length fraction where the s11 curve enters the arrow shaft (y >= ARROW.y); t-independent
  let SPLIT = null;
  function splitFrac(U) {
    if (SPLIT != null) return SPLIT;
    const S = U.curve(ROUTE_PTS, 18);
    let tot = 0;
    let at = null;
    for (let i = 1; i < S.length; i++) {
      const d = Math.hypot(S[i][0] - S[i - 1][0], S[i][1] - S[i - 1][1]);
      if (at == null && S[i][1] >= ARROW.y) at = tot;
      tot += d;
    }
    SPLIT = at != null ? at / tot : 0.95;
    return SPLIT;
  }

  // routeCard with label 'both' + button stacks: glyph tile (y+44..138), short label (baseline y+208),
  // the full name (28 px, baseline y+260, wrapped at w-88) and the button (y+h-112..h-44). At the G1
  // size (480 x 360) the name runs into the button, so the card is drawn on a design box of height
  // >= CARD_MIN_H and uniformly scaled into G1; the box is also wide enough to keep every name on one
  // line. f depends only on the fonts; measured per frame (three measures), no state kept.
  const CARD_MIN_H = 400;
  function cardFit(U, ctx) {
    const R = U.CARD_ROW;
    let nw = 0;
    for (const r of U.ROUTES) nw = Math.max(nw, U.measure(ctx, r.name, { size: 28, weight: 400 }));
    return Math.min(R.h / CARD_MIN_H, R.w / (nw + 88 + 8), 1);
  }

  function drawPage(U, ctx, t, S, P) {
    const R = U.CARD_ROW;
    // 2 the s11 line: the tail retracts to the shaft, then the shaft hands over to the arrow
    const arrowA = U.k(t, S.arrow[0], S.arrow[1], 'inOutCubic');
    const ret = U.k(t, S.retract[0], S.retract[1] - S.retract[0], 'inOutCubic');
    const lineA = 1 - arrowA;
    if (lineA > 0) U.route(ctx, ROUTE_PTS, { from: ret * splitFrac(U), to: 1, width: ROUTE_W, alpha: 0.95 * lineA });

    // 3 route cards settle onto G1 (rise + fade) — they cover the retracting line
    const f = cardFit(U, ctx);
    for (let i = 0; i < 3; i++) {
      const a = U.k(t, S.cards[i], S.cardD, 'outCubic');
      if (a <= 0) continue;
      // exactly the G1 rect on screen; drawn on a taller design box and scaled by f so the 'both'
      // labels and the «Начать маршрут» button do not collide (see cardFit)
      ctx.save();
      ctx.translate(R.x[i], R.y);
      ctx.scale(f, f);
      U.routeCard(ctx, i, 0, 0, R.w / f, R.h / f, { a, label: 'both', button: true });
      ctx.restore();
    }

    // arrow + breathing glow (barely visible)
    if (arrowA > 0) {
      const br = t > S.breathe ? 0.5 - 0.5 * Math.cos(((t - S.breathe) / 2.0) * Math.PI * 2) : 0;
      U.arrowDown(ctx, ARROW.x, ARROW.y, ARROW.len, { p: 1, alpha: arrowA, glow: 0.25 * br });
    }

    // 4 brand + titles (hold still once in)
    U.brand(ctx, 960, 150, { size: 64, align: 'center', alpha: U.appear(t, S.brand, 0.4) });
    U.title(ctx, 'Выбери маршрут ниже', 960, 290, { size: 88, align: 'center', a: U.appear(t, S.title, 0.45) });
    const sa = U.appear(t, S.sub, 0.4);
    if (sa > 0) U.text(ctx, 'Сделай первый шаг сегодня', 960, 350 + (1 - sa) * 16, { size: 40, weight: 500, color: P.text2, align: 'center', alpha: sa });
  }

  function drawExternal(U, ctx, t, S, P, L) {
    // 2 the s11 line retracts into its head and goes out
    const ret = U.k(t, S.retract[0], S.retract[1] - S.retract[0], 'inOutCubic');
    if (ret < 1) U.route(ctx, ROUTE_PTS, { from: ret, to: 1, width: ROUTE_W, alpha: 0.95 * (1 - ret * ret) });

    // 3a the address — full from the first frame to the last
    const br = t > S.breathe ? 0.5 - 0.5 * Math.cos(((t - S.breathe) / 2.0) * Math.PI * 2) : 0;
    const fs = 84;
    const tw = U.measure(ctx, URL, { mono: true, size: fs, weight: 600 });
    const fw = Math.min(1640, tw + 128);
    const fh = 148;
    const fx = 960 - fw / 2;
    const fy = 376;
    U.card(ctx, fx, fy, fw, fh, { r: 28, fill: P.field, stroke: L.mix(P.border, P.accent, 0.7), lw: 2, glow: 0.55 + 0.15 * br });
    U.text(ctx, URL, 960, fy + fh / 2 + fs * 0.36, { mono: true, size: fs, weight: 600, color: P.accent, align: 'center' });

    // 3b «Выбери свой маршрут» + three route tiles
    const sa = U.appear(t, S.sub, 0.4);
    if (sa > 0) U.text(ctx, 'Выбери свой маршрут', 960, 622 + (1 - sa) * 16, { size: 40, weight: 500, color: P.text2, align: 'center', alpha: sa });
    const TW = 400;
    const TH = 112;
    const GAP = 40;
    const x0 = 960 - (3 * TW + 2 * GAP) / 2;
    for (let i = 0; i < 3; i++) {
      const a = U.appear(t, S.tiles[i], 0.4);
      if (a <= 0) continue;
      const R = U.ROUTES[i];
      const x = x0 + i * (TW + GAP);
      const y = 668 + (1 - a) * 20;
      ctx.save();
      ctx.globalAlpha *= a;
      U.card(ctx, x, y, TW, TH, { r: 22 });
      // glyph tile + short name, centred as a group in the tile
      const lw = U.measure(ctx, R.short, { size: 36, weight: 600 });
      const gx = x + TW / 2 - (60 + 26 + lw) / 2;
      U.glyph(ctx, R.glyph, gx + 30, y + TH / 2, 48, { draw: U.k(t, S.tiles[i], 0.5, 'outCubic') });
      U.text(ctx, R.short, gx + 60 + 26, y + TH / 2 + 13, { size: 36, weight: 600, color: P.text });
      ctx.restore();
    }

    // 4 brand + title
    U.brand(ctx, 960, 150, { size: 64, align: 'center', alpha: U.appear(t, S.brand, 0.4) });
    U.title(ctx, 'Открой бесплатный гид', 960, 300, { size: 88, align: 'center', a: U.appear(t, S.title, 0.45) });
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const U = FILM.ui;
      const L = FILM.lib;
      const P = L.pal;
      const t = Math.max(0, Math.min(tIn, info.dur));
      const S = SCHED[U.cut(info)];
      const external = U.variant(info) === 'external';

      // 1 background
      U.bg(ctx, { glow: { x: 960, y: external ? 470 : 560, r: 900, a: 0.1 } });

      if (external) drawExternal(U, ctx, t, S.ext, P, L);
      else drawPage(U, ctx, t, S.page, P);
    },
  });
})();

</script>
<script>
// ---- src/music.js
// music.js : the score and sound design of the film.
// Owner: music. Contract: docs/CONTRACT.md, section Audio.
//
// FILM.audio.render(ctx, { start = 0, dest = ctx.destination }) schedules the whole piece,
// music and effects, from global time `start` into any BaseAudioContext.
// Every sound is synthesised here: oscillators, periodic waves, seeded noise, filters, envelopes,
// a ping-pong delay, convolver reverbs on generated impulse responses, a glue compressor and a
// soft limiter. Randomness comes only from FILM.lib.rng, seeded per event, so any start time
// schedules the same notes at the same global times.
//
// The engine, instruments, effects and master chain below are film-agnostic. Per film the music
// agent replaces three things: the CH chord table, the MIX.ride section automation, and the whole
// score() function — composing against FILM.TIMELINE.bpm and FILM.TIMELINE.cues so hits land on
// the cuts. What ships here is a demo score that gives the stub pass a pulse; see the skill's
// reference/music.md before composing.
(function () {
  'use strict';
  const FILM = window.FILM;
  const lib = FILM.lib;
  const TAU = Math.PI * 2;
  const FLOOR = 1e-5;

  // DynamicsCompressorNode delays its output by a fixed 6 ms look-ahead (measured: 288 samples at
  // 48 kHz). Every event before the compressor is scheduled that much early, so it leaves the master
  // exactly on its cue. Only an event inside the first 6 ms of a render window can land late.
  const LAT = 0.006;

  // Mix constants, tuned by measurement (tools/audio): loudness, peaks, per-bar profile.
  const MIX = {
    trim: 1.05,
    ceiling: 0.66, // soft limiter output ceiling (about -3.6 dBFS)
    knee: 0.5,
    bus: { drums: 0.6, perc: 0.8, bass: 0.3, pad: 0.26, keys: 0.6, bells: 0.45, lead: 0.5, sfx: 0.62, amb: 0.5 },
    // Master tilt EQ in dB: a low shelf under the subs, presence and air for phone speakers.
    eq: { low: -4, presence: 5, air: 3 },
    comp: { threshold: -18, knee: 10, ratio: 2, attack: 0.006, release: 0.2 },
    // Section fader rides in dB at global times, pre-compressor: quiet egg, hushed pupa, full drop,
    // hushed winter, and an ending level that meets the opening level at the loop seam.
    // Per film: section fader rides in dB at global times, pre-compressor (see reference/music.md).
  };

  // ---------------------------------------------------------------- pitch
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
    const midi = 12 * (Number(m[3]) + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  // ---------------------------------------------------------------- envelopes
  // pts: [[dt, value, shape]] with dt from the note start; shape is the ramp INTO that point:
  // 'lin' (default), 'exp' or 'set'. The first point must sit at dt 0.
  // When the voice started before the render window (skip > 0) the value at `skip` is computed
  // and automation resumes from there, so a seek hears the same envelope.
  function setEnv(param, pts, c0, skip) {
    let i;
    let prev;
    if (skip > 0) {
      let v = pts[0][1];
      for (i = 1; i < pts.length; i++) {
        const a = pts[i - 1];
        const b = pts[i];
        if (skip < b[0]) {
          const f = (skip - a[0]) / Math.max(1e-9, b[0] - a[0]);
          const sh = b[2] || 'lin';
          if (sh === 'set') v = a[1];
          else if (sh === 'exp' && a[1] > 0) v = a[1] * Math.pow(Math.max(b[1], FLOOR) / a[1], f);
          else v = a[1] + (b[1] - a[1]) * f;
          break;
        }
        v = b[1];
      }
      param.setValueAtTime(v, c0 + skip);
      prev = v;
    } else {
      param.setValueAtTime(pts[0][1], c0);
      prev = pts[0][1];
      i = 1;
    }
    for (; i < pts.length; i++) {
      const v = pts[i][1];
      const sh = pts[i][2] || 'lin';
      const w = c0 + pts[i][0];
      if (sh === 'set') {
        param.setValueAtTime(v, w);
        prev = v;
      } else if (sh === 'exp' && prev > 0) {
        param.exponentialRampToValueAtTime(Math.max(v, FLOOR), w);
        prev = Math.max(v, FLOOR);
      } else {
        param.linearRampToValueAtTime(v, w);
        prev = v;
      }
    }
  }

  // Percussive amplitude envelope: attack then exponential decay to silence.
  const perc = (vel, att, dec) => [[0, 0], [att, vel], [att + dec, FLOOR, 'exp']];

  // ---------------------------------------------------------------- generated buffers
  function noiseBuffer(ctx, secs, channels, seed) {
    const n = Math.floor(secs * ctx.sampleRate);
    const buf = ctx.createBuffer(channels, n, ctx.sampleRate);
    for (let ch = 0; ch < channels; ch++) {
      const r = lib.rng(lib.hash('film-noise', seed, ch));
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = r() * 2 - 1;
    }
    return buf;
  }

  // Impulse response: seeded stereo noise, exponential decay to -60 dB at `secs`, a two-pole
  // lowpass that darkens over the tail, a pre-delay and a few early reflections.
  function impulse(ctx, secs, seed, o) {
    const sr = ctx.sampleRate;
    const n = Math.floor(secs * sr);
    const buf = ctx.createBuffer(2, n, sr);
    const pre = Math.floor(o.pre * sr);
    const tail = secs - o.pre;
    for (let ch = 0; ch < 2; ch++) {
      const r = lib.rng(lib.hash('film-ir', seed, ch));
      const d = buf.getChannelData(ch);
      let l1 = 0;
      let l2 = 0;
      for (let i = pre; i < n; i++) {
        const t = (i - pre) / sr;
        const u = t / tail;
        const env = Math.exp(-6.9 * u) * (t < 0.005 ? t / 0.005 : 1);
        const a = o.bright + (o.dark - o.bright) * Math.sqrt(u);
        l1 += a * (r() * 2 - 1 - l1);
        l2 += a * (l1 - l2);
        d[i] = l2 * env;
      }
      for (let k = 0; k < o.early; k++) {
        const i = pre + Math.floor((0.003 + r() * o.spread) * sr);
        if (i < n) d[i] += (r() * 2 - 1) * 0.35 * (1 - k / o.early);
      }
    }
    return buf;
  }

  // Grains rendered straight into a stereo buffer: band-passed noise flaps and clicks, or short sines.
  // g: { t, dur, amp, pan (-1..1), f, q, att, dec, sine }
  function grainBuffer(ctx, key, secs, grains) {
    const sr = ctx.sampleRate;
    const n = Math.max(1, Math.ceil(secs * sr));
    const buf = ctx.createBuffer(2, n, sr);
    const L = buf.getChannelData(0);
    const R = buf.getChannelData(1);
    const r = lib.rng(lib.hash('film-grain', key));
    for (const g of grains) {
      const i0 = Math.floor(g.t * sr);
      const m = Math.floor(g.dur * sr);
      const gl = Math.cos(((g.pan + 1) * Math.PI) / 4);
      const gr = Math.sin(((g.pan + 1) * Math.PI) / 4);
      const att = g.att || 0.002;
      const dec = g.dec || g.dur * 0.3;
      const w = (TAU * g.f) / sr;
      const al = Math.sin(w) / (2 * (g.q || 1));
      const cw = Math.cos(w);
      const a0 = 1 + al;
      let x1 = 0;
      let x2 = 0;
      let y1 = 0;
      let y2 = 0;
      const ph = r() * TAU;
      for (let k = 0; k < m; k++) {
        const j = i0 + k;
        if (j >= n) break;
        const tt = k / sr;
        let s;
        if (g.sine) s = Math.sin(ph + w * k);
        else {
          const x = r() * 2 - 1;
          s = (al * x - al * x2 + 2 * cw * y1 - (1 - al) * y2) / a0;
          x2 = x1;
          x1 = x;
          y2 = y1;
          y1 = s;
        }
        const env = tt < att ? tt / att : Math.exp(-(tt - att) / dec);
        const tailFade = k > m - 64 ? (m - k) / 64 : 1;
        const v = s * env * tailFade * g.amp;
        if (j >= 0) {
          L[j] += v * gl;
          R[j] += v * gr;
        }
      }
    }
    return buf;
  }

  // Stick-slip creak: irregular pulses, each ringing three damped wooden resonances.
  function creakBuffer(ctx, key, secs, rate0, rate1, formants) {
    const sr = ctx.sampleRate;
    const n = Math.ceil(secs * sr);
    const buf = ctx.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    const r = lib.rng(lib.hash('film-creak', key));
    let t = 0.004;
    while (t < secs - 0.01) {
      const u = t / secs;
      const swell = Math.sin(Math.PI * Math.min(1, u * 1.15)) * (0.55 + 0.45 * r());
      const i0 = Math.floor(t * sr);
      for (const [f, tau, a] of formants) {
        const m = Math.min(n - i0, Math.floor(tau * 5 * sr));
        const fj = f * (0.94 + 0.12 * r());
        for (let k = 0; k < m; k++) d[i0 + k] += swell * a * Math.exp(-k / sr / tau) * Math.sin((TAU * fj * k) / sr);
      }
      const rate = rate0 + (rate1 - rate0) * u;
      t += (1 / rate) * (0.7 + 0.6 * r());
    }
    for (let k = 0; k < 96 && k < n; k++) d[n - 1 - k] *= k / 96;
    return buf;
  }

  // Soft limiter transfer curve. The shaper is fed at half level, so the curve covers inputs up to
  // +6 dBFS: linear to the knee, then a tanh shoulder that never passes the ceiling.
  function limiterCurve(ceiling, knee) {
    const n = 16385;
    const c = new Float32Array(n);
    const room = ceiling - knee;
    for (let i = 0; i < n; i++) {
      const x = ((i / (n - 1)) * 2 - 1) * 2;
      const a = Math.abs(x);
      const y = a <= knee ? a : knee + room * Math.tanh((a - knee) / room);
      c[i] = x < 0 ? -y : y;
    }
    return c;
  }

  function periodic(ctx, n, amp) {
    const real = new Float32Array(n + 1);
    const imag = new Float32Array(n + 1);
    for (let k = 1; k <= n; k++) imag[k] = amp(k);
    return ctx.createPeriodicWave(real, imag);
  }

  // ---------------------------------------------------------------- engine
  function makeEngine(ctx, start, dest, DUR, MIX) {
    const base = ctx.currentTime;
    const E = { ctx, sr: ctx.sampleRate, start, base, DUR, duckTargets: [] };

    // A voice is a note or effect that starts at global time t0 and lasts len seconds (release included).
    // A sustained voice whose compensated start falls before the window resumes mid-envelope on time.
    // A short voice that starts inside the first 6 ms plays whole, up to 6 ms late; one that began
    // earlier is skipped.
    E.w0 = -Infinity;
    E.w1 = Infinity;
    E.voice = function (t0, len, sustain) {
      if (t0 < E.w0 || t0 >= E.w1) return null; // belongs to another scheduling window
      if (t0 >= DUR || t0 + len <= start) return null;
      const c = base + (t0 - start) - LAT;
      let c0 = c;
      let skip = 0;
      if (c < base) {
        if (sustain) skip = base - c;
        else if (t0 >= start) c0 = base;
        else return null;
      }
      return {
        c0,
        skip,
        len,
        env: (param, pts) => setEnv(param, pts, c0, skip),
        osc(node, stopDt) {
          node.start(c0 + skip);
          node.stop(c0 + Math.max(stopDt === undefined ? len : stopDt, skip + 0.002));
          return node;
        },
        buf(node, offset, stopDt) {
          const d = node.buffer.duration;
          let off = (offset || 0) + skip;
          if (node.loop) off %= d;
          else if (off >= d) return node;
          node.start(c0 + skip, off);
          node.stop(c0 + Math.max(stopDt === undefined ? len : stopDt, skip + 0.002));
          return node;
        },
      };
    };

    E.gain = (v) => {
      const g = ctx.createGain();
      g.gain.value = v === undefined ? 1 : v;
      return g;
    };
    E.osc = (type, f) => {
      const o = ctx.createOscillator();
      if (typeof type === 'string') o.type = type;
      else o.setPeriodicWave(type);
      o.frequency.value = f;
      return o;
    };
    E.filt = (type, f, q) => {
      const b = ctx.createBiquadFilter();
      b.type = type;
      b.frequency.value = f;
      b.Q.value = q === undefined ? 0.707 : q;
      return b;
    };
    E.panner = (p) => {
      const s = ctx.createStereoPanner();
      s.pan.value = p;
      return s;
    };
    E.rng = (...k) => lib.rng(lib.hash('film-score', ...k));

    // ---- master: highpass, glue compressor, trim, soft limiter, output fades
    const master = E.gain(1);
    const hp = E.filt('highpass', 26, 0.6);
    const lowShelf = E.filt('lowshelf', 140, 0.7);
    lowShelf.gain.value = MIX.eq.low;
    const presence = E.filt('peaking', 3000, 0.7);
    presence.gain.value = MIX.eq.presence;
    const air = E.filt('highshelf', 8000, 0.7);
    air.gain.value = MIX.eq.air;
    const comp = ctx.createDynamicsCompressor();
    for (const k in MIX.comp) comp[k].value = MIX.comp[k];
    const trim = E.gain(MIX.trim * 0.5);
    const lim = ctx.createWaveShaper();
    lim.curve = limiterCurve(MIX.ceiling, MIX.knee);
    lim.oversample = 'none';
    const out = E.gain(1);
    master.connect(hp);
    hp.connect(lowShelf);
    lowShelf.connect(presence);
    presence.connect(air);
    air.connect(comp);
    comp.connect(trim);
    trim.connect(lim);
    lim.connect(out);
    out.connect(dest);
    E.master = master;
    // Output fades sit after the compressor, so they use uncompensated times. The compressor's
    // first 6 ms are silent; the output then opens over 3 ms, and the last 10 ms taper to zero, so the
    // loop seam and every seek start without a click.
    out.gain.setValueAtTime(0, base);
    out.gain.setValueAtTime(0, base + LAT);
    out.gain.linearRampToValueAtTime(1, base + LAT + 0.003);
    const cEnd = base + (DUR - start);
    if (DUR - start > 0.05) {
      out.gain.setValueAtTime(1, cEnd - 0.01);
      out.gain.linearRampToValueAtTime(0, cEnd);
    }
    // Section rides on the master input, compensated like every other pre-compressor event.
    setEnv(master.gain, MIX.ride.map(([t, d], i) => [t, Math.pow(10, d / 20), i ? 'lin' : undefined]), base - start - LAT, start + LAT);

    // ---- shared buffers
    E.white = noiseBuffer(ctx, 2.5, 1, 'white');
    E.wide = noiseBuffer(ctx, 5, 2, 'wide');
    E.warmSaw = periodic(ctx, 48, (k) => Math.pow(k, -1.35) * (k > 24 ? Math.exp(-(k - 24) / 10) : 1));
    E.softSquare = periodic(ctx, 31, (k) => (k % 2 ? Math.pow(k, -1.5) : 0.04 / k));
    E.brassSaw = periodic(ctx, 40, (k) => Math.pow(k, -1.05));

    // ---- effects returns
    E.fx = {};
    const verb = (name, secs, o, ret) => {
      const c = ctx.createConvolver();
      c.buffer = impulse(ctx, secs, name, o);
      const g = E.gain(ret);
      c.connect(g);
      g.connect(master);
      E.fx[name] = c;
    };
    verb('room', 0.9, { pre: 0.006, bright: 0.55, dark: 0.18, early: 10, spread: 0.035 }, 0.9);
    verb('hall', 2.8, { pre: 0.018, bright: 0.45, dark: 0.09, early: 14, spread: 0.07 }, 0.9);
    verb('cave', 6.0, { pre: 0.03, bright: 0.35, dark: 0.05, early: 18, spread: 0.12 }, 0.85);

    // Ping-pong delay, a dotted 8th (0.375 s) each side.
    const dIn = E.gain(1);
    dIn.channelCount = 1;
    dIn.channelCountMode = 'explicit';
    const dL = ctx.createDelay(1);
    const dR = ctx.createDelay(1);
    dL.delayTime.value = 0.375;
    dR.delayTime.value = 0.375;
    const fL = E.filt('lowpass', 4200, 0.5);
    const fR = E.filt('lowpass', 3400, 0.5);
    const gL = E.gain(0.4);
    const gR = E.gain(0.4);
    dIn.connect(dL);
    dL.connect(fL);
    fL.connect(gL);
    gL.connect(dR);
    dR.connect(fR);
    fR.connect(gR);
    gR.connect(dL);
    const mrg = ctx.createChannelMerger(2);
    fL.connect(mrg, 0, 0);
    fR.connect(mrg, 0, 1);
    const dRet = E.gain(0.75);
    mrg.connect(dRet);
    dRet.connect(master);
    const dVerb = E.gain(0.25);
    dRet.connect(dVerb);
    dVerb.connect(E.fx.hall);
    E.fx.delay = dIn;

    // ---- buses
    E.bus = {};
    // Per-voice sends pass through a tap scaled by the bus gain, so a bus fader moves its reverb too.
    E.tap = {};
    const taps = (name) => {
      E.tap[name] = {};
      for (const k of ['room', 'hall', 'cave', 'delay']) {
        const g = E.gain(MIX.bus[name]);
        g.connect(E.fx[k]);
        E.tap[name][k] = g;
      }
    };
    const bus = (name, sends, duck, hpf) => {
      taps(name);
      const b = E.gain(MIX.bus[name]);
      let tail = b;
      if (hpf) {
        const h = E.filt('highpass', hpf, 0.6);
        tail.connect(h);
        tail = h;
      }
      if (duck) {
        const d = E.gain(1);
        b.connect(d);
        tail = d;
        E.duckTargets.push(d.gain);
      }
      tail.connect(master);
      for (const k in sends) {
        const s = E.gain(sends[k]);
        tail.connect(s);
        s.connect(E.fx[k]);
      }
      E.bus[name] = b;
    };
    // Drum bus: a gentle saturator adds harmonics so the kick reads on phone speakers.
    {
      const b = E.gain(MIX.bus.drums);
      const drive = E.gain(1.6);
      const sat = ctx.createWaveShaper();
      const curve = new Float32Array(2049);
      for (let i = 0; i < curve.length; i++) {
        const x = (i / (curve.length - 1)) * 2 - 1;
        curve[i] = Math.tanh(x * 1.4) / Math.tanh(1.4);
      }
      sat.curve = curve;
      const back = E.gain(0.72);
      b.connect(drive);
      drive.connect(sat);
      sat.connect(back);
      back.connect(master);
      const rs = E.gain(0.1);
      back.connect(rs);
      rs.connect(E.fx.room);
      E.bus.drums = b;
      taps('drums');
    }
    bus('perc', { room: 0.1 });
    bus('bass', {}, true);
    bus('pad', { hall: 0.22 }, true, 180);
    bus('keys', { room: 0.12, hall: 0.14, delay: 0.06 });
    bus('bells', { hall: 0.3, cave: 0.06, delay: 0.14 });
    bus('lead', { hall: 0.22, delay: 0.18 });
    bus('sfx', { room: 0.14 });
    bus('amb', { hall: 0.12 });

    // Route a voice's last node to a bus, with an optional pan and extra sends.
    E.out = (node, busName, o) => {
      o = o || {};
      let n = node;
      if (o.pan) {
        const p = E.panner(o.pan);
        n.connect(p);
        n = p;
      }
      n.connect(E.bus[busName]);
      for (const k of ['room', 'hall', 'cave', 'delay']) {
        if (o[k]) {
          const s = E.gain(o[k]);
          n.connect(s);
          s.connect(E.tap[busName][k]);
        }
      }
      return n;
    };

    // Looping noise source with a per-event deterministic read offset.
    E.noise = (V, key, stereo) => {
      const s = ctx.createBufferSource();
      s.buffer = stereo ? E.wide : E.white;
      s.loop = true;
      const off = ((lib.hash('film-nz', key) % 100003) / 100003) * s.buffer.duration;
      return V.buf(s, off);
    };

    // Sidechain-style pump: a decaying negative curve added to the pad and bass bus gains on a kick.
    const duckLen = 0.32;
    E.duckBuf = ctx.createBuffer(1, Math.floor(duckLen * E.sr), E.sr);
    {
      const d = E.duckBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        const t = i / E.sr;
        d[i] = -(t < 0.006 ? t / 0.006 : Math.exp(-(t - 0.006) / 0.085)) * (i > d.length - 48 ? (d.length - i) / 48 : 1);
      }
    }
    E.duck = (t, depth) => {
      const V = E.voice(t, duckLen, false);
      if (!V) return;
      const s = ctx.createBufferSource();
      s.buffer = E.duckBuf;
      for (const p of E.duckTargets) {
        const g = E.gain(depth);
        s.connect(g);
        g.connect(p);
      }
      V.buf(s, 0);
    };
    return E;
  }

  // ---------------------------------------------------------------- instruments
  function instruments(E) {
    const ctx = E.ctx;
    const I = {};

    // Felt, full, heartbeat or thud kick: a pitch-dropping sine with a short filtered click.
    I.kick = (t, vel, kind) => {
      const P = {
        felt: { f0: 125, f1: 50, fd: 0.055, dec: 0.36, click: 0.18, cf: 1600 },
        full: { f0: 165, f1: 47, fd: 0.065, dec: 0.5, click: 0.3, cf: 4200 },
        heart: { f0: 96, f1: 46, fd: 0.05, dec: 0.3, click: 0.16, cf: 1500 },
        thud: { f0: 95, f1: 52, fd: 0.04, dec: 0.2, click: 0.12, cf: 1200 },
      }[kind || 'felt'];
      const V = E.voice(t, P.dec + 0.03, false);
      if (!V) return;
      const o = E.osc('sine', P.f0);
      V.env(o.frequency, [[0, P.f0], [P.fd, P.f1, 'exp'], [P.dec, P.f1 * 0.92, 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.002, vel], [0.06, vel * 0.75, 'exp'], [P.dec, FLOOR, 'exp']]);
      o.connect(g);
      E.out(g, 'drums');
      V.osc(o);
      const n = E.noise(V, ['kick', t]);
      const f = E.filt('lowpass', P.cf, 0.7);
      const cg = E.gain(0);
      V.env(cg.gain, perc(vel * P.click, 0.0008, 0.012));
      n.connect(f);
      f.connect(cg);
      E.out(cg, 'drums');
    };

    I.brush = (t, vel, pan) => {
      const V = E.voice(t, 0.26, false);
      if (!V) return;
      const n = E.noise(V, ['brush', t]);
      const f = E.filt('bandpass', 3000, 0.55);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.004, vel], [0.05, vel * 0.45, 'exp'], [0.24, FLOOR, 'exp']]);
      n.connect(f);
      f.connect(g);
      E.out(g, 'perc', { pan: pan || 0.12 });
      const o = E.osc('sine', 185);
      const og = E.gain(0);
      V.env(og.gain, perc(vel * 0.35, 0.002, 0.06));
      o.connect(og);
      E.out(og, 'drums');
      V.osc(o, 0.1);
    };

    I.hat = (t, vel, open) => {
      const len = open ? 0.22 : 0.055;
      const V = E.voice(t, len + 0.01, false);
      if (!V) return;
      const n = E.noise(V, ['hat', t]);
      const f = E.filt('highpass', 7200, 0.8);
      const f2 = E.filt('peaking', 10500, 1.2);
      f2.gain.value = 5;
      const g = E.gain(0);
      V.env(g.gain, perc(vel, 0.001, len));
      n.connect(f);
      f.connect(f2);
      f2.connect(g);
      E.out(g, 'perc', { pan: -0.25 });
    };

    I.shaker = (t, vel, pan) => {
      const V = E.voice(t, 0.09, false);
      if (!V) return;
      const n = E.noise(V, ['shaker', t]);
      const f = E.filt('bandpass', 6500, 1.1);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.01, vel], [0.075, FLOOR, 'exp']]);
      n.connect(f);
      f.connect(g);
      E.out(g, 'perc', { pan: pan || 0.3 });
    };

    I.crash = (t, vel, o) => {
      o = o || {};
      const dec = o.dec || 1.55;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const n = E.noise(V, ['crash', t], true);
      const f = E.filt('highpass', 4800, 0.6);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.003, vel], [0.12, vel * 0.45, 'exp'], [dec, FLOOR, 'exp']]);
      n.connect(f);
      f.connect(g);
      E.out(g, 'perc', o);
    };

    // Woodblock tock or small wooden click.
    I.tock = (t, vel, f, o) => {
      o = o || {};
      const V = E.voice(t, 0.1, false);
      if (!V) return;
      const s = E.osc('sine', f * 1.5);
      V.env(s.frequency, [[0, f * 1.5], [0.006, f, 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, perc(vel, 0.001, o.dec || 0.06));
      s.connect(g);
      E.out(g, o.bus || 'perc', o);
      V.osc(s);
      const tri = E.osc('triangle', f * 2.71);
      const tg = E.gain(0);
      V.env(tg.gain, perc(vel * 0.25, 0.001, 0.025));
      tri.connect(tg);
      E.out(tg, o.bus || 'perc', o);
      V.osc(tri, 0.05);
      const n = E.noise(V, ['tock', t, f]);
      const nf = E.filt('bandpass', Math.min(9000, f * 2.4), 2.5);
      const ng = E.gain(0);
      V.env(ng.gain, perc(vel * 0.5, 0.0005, 0.01));
      n.connect(nf);
      nf.connect(ng);
      E.out(ng, o.bus || 'perc', o);
    };

    // FM marimba: soft-mallet FM attack on the fundamental, the tuned 4th partial, a mallet thump.
    I.marimba = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || Math.min(2.2, Math.max(0.35, 1.5 * Math.sqrt(220 / f)));
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const c = E.osc('sine', f);
      const m = E.osc('sine', f);
      const mg = E.gain(0);
      V.env(mg.gain, [[0, f * 1.4], [0.04, f * 0.04, 'exp'], [dec, FLOOR, 'exp']]);
      m.connect(mg);
      mg.connect(c.frequency);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.003, vel], [dec, FLOOR, 'exp']]);
      c.connect(g);
      E.out(g, o.bus || 'keys', o);
      V.osc(c);
      V.osc(m);
      if (f * 4 < 16000) {
        const p = E.osc('sine', f * 4);
        const pg = E.gain(0);
        V.env(pg.gain, perc(vel * 0.22, 0.002, 0.12));
        p.connect(pg);
        E.out(pg, o.bus || 'keys', o);
        V.osc(p, 0.2);
      }
      const n = E.noise(V, ['mar', t, f]);
      const nf = E.filt('lowpass', 1400, 0.7);
      const ng = E.gain(0);
      V.env(ng.gain, perc(vel * 0.12, 0.001, 0.012));
      n.connect(nf);
      nf.connect(ng);
      E.out(ng, o.bus || 'keys', o);
    };

    // Kalimba: sine tine with a small pitch settle, an inharmonic overtone and a thumb click.
    I.kalimba = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || 1.5;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const s = E.osc('sine', f);
      V.env(s.frequency, [[0, f * 1.007], [0.03, f, 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.002, vel], [0.09, vel * 0.55, 'exp'], [dec, FLOOR, 'exp']]);
      s.connect(g);
      E.out(g, o.bus || 'keys', o);
      V.osc(s);
      if (f * 5.93 < 17000) {
        const p = E.osc('sine', f * 5.93);
        const pg = E.gain(0);
        V.env(pg.gain, perc(vel * 0.28, 0.001, 0.07));
        p.connect(pg);
        E.out(pg, o.bus || 'keys', o);
        V.osc(p, 0.12);
      }
      const h = E.osc('sine', f * 2);
      const hg = E.gain(0);
      V.env(hg.gain, perc(vel * 0.1, 0.002, 0.35));
      h.connect(hg);
      E.out(hg, o.bus || 'keys', o);
      V.osc(h, 0.5);
      const n = E.noise(V, ['kal', t, f]);
      const nf = E.filt('bandpass', 3300, 1.8);
      const ng = E.gain(0);
      V.env(ng.gain, perc(vel * 0.3, 0.0005, 0.008));
      n.connect(nf);
      nf.connect(ng);
      E.out(ng, o.bus || 'keys', o);
    };

    // Glockenspiel: free-bar partial ratios, higher partials die first.
    I.glock = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || 1.8;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const parts = [
        [1, 1, 1],
        [2.756, 0.3, 0.35],
        [5.404, 0.11, 0.14],
        [8.933, 0.05, 0.06],
      ];
      for (const [ratio, a, d] of parts) {
        if (f * ratio > 18000) continue;
        const s = E.osc('sine', f * ratio);
        const g = E.gain(0);
        V.env(g.gain, perc(vel * a, 0.001, dec * d));
        s.connect(g);
        E.out(g, o.bus || 'bells', o);
        V.osc(s, dec * d + 0.02);
      }
    };

    // Glassy sine ping.
    I.glass = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || 1.6;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const parts = [
        [1, 1, 1],
        [2, 0.12, 0.35],
        [3.01, 0.05, 0.18],
      ];
      for (const [ratio, a, d] of parts) {
        const s = E.osc('sine', f * ratio);
        const g = E.gain(0);
        V.env(g.gain, perc(vel * a, o.att || 0.003, dec * d));
        s.connect(g);
        E.out(g, o.bus || 'bells', o);
        V.osc(s, dec * d + 0.02);
      }
    };

    // FM bell: modulator at an inharmonic or harmonic ratio, index decaying with the note.
    I.fmBell = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || 1.6;
      const ratio = o.ratio || 1.4;
      const idx = o.index || 3;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const c = E.osc('sine', f);
      const m = E.osc('sine', f * ratio);
      const mg = E.gain(0);
      V.env(mg.gain, [[0, f * idx], [dec * 0.5, f * idx * 0.08, 'exp']]);
      m.connect(mg);
      mg.connect(c.frequency);
      const g = E.gain(0);
      V.env(g.gain, perc(vel, o.att || 0.002, dec));
      c.connect(g);
      E.out(g, o.bus || 'bells', o);
      V.osc(c);
      V.osc(m);
    };

    // Soft FM gong.
    I.gong = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || 2.2;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const c = E.osc('sine', f);
      const m = E.osc('sine', f * 1.41);
      const mg = E.gain(0);
      V.env(mg.gain, [[0, f * 0.3], [0.09, f * 2.2], [dec, f * 0.15, 'exp']]);
      m.connect(mg);
      mg.connect(c.frequency);
      const lp = E.filt('lowpass', 1900, 0.5);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.012, vel], [dec, FLOOR, 'exp']]);
      c.connect(lp);
      lp.connect(g);
      E.out(g, o.bus || 'bells', o);
      V.osc(c);
      V.osc(m);
    };

    // Metallic FM ting for the gold dots.
    I.ting = (t, f, vel, o) => I.fmBell(t, f, vel, Object.assign({ ratio: 3.51, index: 1.6, dec: 0.45 }, o || {}));

    // Warm detuned pad: two warm-saw voices per note, spread left and right, one shared lowpass.
    // o: att, rel, cut0, cut1 (cutoff at the start and at t1), q, sine (hushed sine pad), bus, sends
    I.pad = (t0, t1, notes, vel, o) => {
      o = o || {};
      const att = Math.min(o.att === undefined ? 0.25 : o.att, t1 - t0);
      const rel = o.rel === undefined ? 0.35 : o.rel;
      const hold = t1 - t0;
      const len = hold + rel;
      const V = E.voice(t0, len, true);
      if (!V) return;
      const lp = E.filt('lowpass', o.cut0 || 1200, o.q || 0.6);
      V.env(lp.frequency, [[0, o.cut0 || 1200], [hold, o.cut1 || o.cut0 || 1200, 'exp'], [len, (o.cut1 || o.cut0 || 1200) * 0.7, 'exp']]);
      const g = E.gain(0);
      const pts = [[0, 0], [att, vel, o.attShape || 'lin']];
      if (hold > att) pts.push([hold, vel * (o.sus === undefined ? 1 : o.sus), 'lin']);
      pts.push([len, 0, 'lin']);
      V.env(g.gain, pts);
      lp.connect(g);
      E.out(g, o.bus || 'pad', o);
      const per = 1 / Math.sqrt(notes.length * 2);
      notes.forEach((nm, i) => {
        const f = hz(nm);
        const sides = o.sine ? [0] : [-1, 1];
        for (const side of sides) {
          const s = E.osc(o.sine ? 'sine' : E.warmSaw, f);
          s.detune.value = side * (o.detune || 8) + (i % 2 ? 1.5 : -1.5);
          const sg = E.gain(per * (o.sine ? 1.4 : 1));
          const p = E.panner(side * (o.width === undefined ? 0.55 : o.width) * (i % 2 ? 0.8 : 1));
          s.connect(sg);
          sg.connect(p);
          p.connect(lp);
          V.osc(s);
        }
      });
    };

    // Sub bass: sine with a little 2nd and 3rd harmonic so it survives small speakers.
    I.sub = (t0, t1, note, vel, o) => {
      o = o || {};
      const att = Math.min(o.att === undefined ? 0.008 : o.att, t1 - t0);
      const rel = o.rel === undefined ? 0.06 : o.rel;
      const hold = t1 - t0;
      const len = hold + rel;
      const V = E.voice(t0, len, true);
      if (!V) return;
      const f = hz(note);
      const g = E.gain(0);
      const pts = [[0, 0], [att, vel, o.attShape || 'lin']];
      if (hold > att) pts.push([hold, vel * (o.sus === undefined ? 0.85 : o.sus), 'lin']);
      pts.push([len, 0, 'lin']);
      V.env(g.gain, pts);
      const lp = E.filt('lowpass', 420, 0.5);
      for (const [k, a] of [
        [1, 1],
        [2, 0.3],
        [3, 0.1],
      ]) {
        const s = E.osc('sine', f * k);
        const sg = E.gain(a);
        s.connect(sg);
        sg.connect(lp);
        V.osc(s);
      }
      lp.connect(g);
      E.out(g, 'bass');
    };

    // Sub drop: a sine sweeping down under a hit.
    I.subDrop = (t, f0, f1, len, vel) => {
      const V = E.voice(t, len + 0.02, false);
      if (!V) return;
      const s = E.osc('sine', f0);
      V.env(s.frequency, [[0, f0], [len, f1, 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.004, vel], [len * 0.5, vel * 0.7, 'lin'], [len, FLOOR, 'exp']]);
      s.connect(g);
      E.out(g, 'bass');
      V.osc(s);
    };

    // Warm pluck: warm saw plus soft square an octave up, a fast lowpass sweep.
    I.pluck = (t, note, vel, o) => {
      o = o || {};
      const f = hz(note);
      const dec = o.dec || 0.8;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const lp = E.filt('lowpass', 2000, o.q || 1.2);
      const top = Math.min(11000, f * (o.bright || 9));
      V.env(lp.frequency, [[0, top], [0.16, Math.max(180, f * 1.8), 'exp'], [dec, Math.max(150, f * 1.2), 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.003, vel], [0.14, vel * 0.45, 'exp'], [dec, FLOOR, 'exp']]);
      const a = E.osc(E.warmSaw, f);
      a.detune.value = -5;
      const b = E.osc(E.softSquare, f * 2);
      b.detune.value = 6;
      const bg = E.gain(0.35);
      a.connect(lp);
      b.connect(bg);
      bg.connect(lp);
      lp.connect(g);
      E.out(g, o.bus || 'keys', o);
      V.osc(a);
      V.osc(b);
    };

    // FM boop with an upward bend (the molts).
    I.boop = (t, note, vel, o) => {
      o = o || {};
      const f = hz(note);
      const V = E.voice(t, 0.32, false);
      if (!V) return;
      const c = E.osc('sine', f * 0.8);
      V.env(c.frequency, [[0, f * 0.8], [0.06, f, 'exp']]);
      const m = E.osc('sine', f * 1.6);
      V.env(m.frequency, [[0, f * 1.6], [0.06, f * 2, 'exp']]);
      const mg = E.gain(0);
      V.env(mg.gain, [[0, f * 2.2], [0.14, f * 0.2, 'exp']]);
      m.connect(mg);
      mg.connect(c.frequency);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.004, vel], [0.08, vel * 0.6, 'exp'], [0.3, FLOOR, 'exp']]);
      c.connect(g);
      E.out(g, o.bus || 'keys', Object.assign({ room: 0.2 }, o));
      V.osc(c);
      V.osc(m);
    };

    // Detuned, band-passed saw stab.
    I.stab = (t, notes, vel, o) => {
      o = o || {};
      const len = o.len || 0.22;
      const V = E.voice(t, len + 0.02, false);
      if (!V) return;
      const bp = E.filt('bandpass', o.f || 1500, 1.4);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.003, vel], [len, FLOOR, 'exp']]);
      bp.connect(g);
      E.out(g, 'keys', o);
      for (const nm of notes) {
        for (const d of [-14, 14]) {
          const s = E.osc('sawtooth', hz(nm));
          s.detune.value = d;
          const sg = E.gain(0.5 / notes.length);
          s.connect(sg);
          sg.connect(bp);
          V.osc(s);
        }
      }
    };

    // Continuous FM lead with glides and delayed vibrato. phrase: [[t, note, glide]]
    I.lead = (phrase, tEnd, vel, o) => {
      o = o || {};
      const t0 = phrase[0][0];
      const rel = o.rel || 0.3;
      const len = tEnd - t0 + rel;
      const V = E.voice(t0, len, true);
      if (!V) return;
      const pitch = ctx.createConstantSource();
      const pp = [[0, hz(phrase[0][1])]];
      const vib = [[0, 0]];
      for (let i = 1; i < phrase.length; i++) {
        const dt = phrase[i][0] - t0;
        const gl = Math.max(0.005, phrase[i][2] || 0);
        pp.push([dt, hz(phrase[i - 1][1]), 'set']);
        pp.push([dt + gl, hz(phrase[i][1]), 'exp']);
      }
      for (let i = 0; i < phrase.length; i++) {
        const a = phrase[i][0] - t0;
        const b = (i + 1 < phrase.length ? phrase[i + 1][0] : tEnd + rel) - t0;
        const f = hz(phrase[i][1]);
        vib.push([a, 0, 'set']);
        if (b - a > 0.35) {
          vib.push([a + 0.18, 0, 'set']);
          vib.push([Math.min(b, a + 0.45), f * 0.008, 'lin']);
          vib.push([b, f * 0.008, 'lin']);
        }
      }
      V.env(pitch.offset, pp);
      const c = E.osc('sine', 0);
      const m = E.osc('sine', 0);
      const sub = E.osc('triangle', 0);
      pitch.connect(c.frequency);
      const mr = E.gain(1);
      pitch.connect(mr);
      mr.connect(m.frequency);
      const sr = E.gain(0.5);
      pitch.connect(sr);
      sr.connect(sub.frequency);
      const mg = E.gain(hz(phrase[0][1]) * 0.9);
      m.connect(mg);
      mg.connect(c.frequency);
      const lfo = E.osc('sine', 5.3);
      const vg = E.gain(0);
      V.env(vg.gain, vib);
      lfo.connect(vg);
      vg.connect(c.frequency);
      const lp = E.filt('lowpass', 3200, 0.8);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.012, vel], [tEnd - t0, vel * 0.9, 'lin'], [len, 0, 'lin']]);
      const sg = E.gain(0.35);
      c.connect(lp);
      sub.connect(sg);
      sg.connect(lp);
      lp.connect(g);
      E.out(g, 'lead', o);
      V.osc(pitch);
      V.osc(c);
      V.osc(m);
      V.osc(sub);
      V.osc(lfo);
    };

    // Synth horn: two brass saws with a filter swell per note and a scoop into pitch.
    I.horn = (phrase, tEnd, vel, o) => {
      o = o || {};
      const t0 = phrase[0][0];
      const rel = 0.25;
      const len = tEnd - t0 + rel;
      const V = E.voice(t0, len, true);
      if (!V) return;
      const pitch = ctx.createConstantSource();
      const pp = [];
      const cut = [];
      phrase.forEach(([t, nm], i) => {
        const dt = t - t0;
        const f = hz(nm);
        if (i === 0) pp.push([0, f * 0.97]);
        else pp.push([dt, f * 0.97, 'set']);
        pp.push([dt + 0.07, f, 'exp']);
        cut.push([dt, 300, i === 0 ? 'lin' : 'set']);
        cut.push([dt + 0.16, 2400, 'exp']);
        cut.push([dt + 0.45, 1500, 'exp']);
      });
      cut[0] = [0, 300];
      V.env(pitch.offset, pp);
      const lp = E.filt('lowpass', 300, 1.1);
      V.env(lp.frequency, cut);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.06, vel], [tEnd - t0, vel, 'lin'], [len, 0, 'lin']]);
      for (const d of [-7, 7]) {
        const s = E.osc(E.brassSaw, 0);
        s.detune.value = d;
        pitch.connect(s.frequency);
        const sg = E.gain(0.5);
        s.connect(sg);
        sg.connect(lp);
        V.osc(s);
      }
      lp.connect(g);
      E.out(g, 'lead', o);
      V.osc(pitch);
    };

    // Generic filtered noise: whooshes, sweeps, cracks, risers.
    // o: { type, f: env pts, q, amp: env pts, pan, panEnv, bus, sustain, stereo, sends }
    I.nz = (t, len, o) => {
      const V = E.voice(t, len, !!o.sustain);
      if (!V) return;
      const n = E.noise(V, ['nz', t, len, o.key || ''], !!o.stereo);
      const f = E.filt(o.type || 'bandpass', o.f[0][1], o.q || 0.8);
      V.env(f.frequency, o.f);
      const g = E.gain(0);
      V.env(g.gain, o.amp);
      n.connect(f);
      let last = f;
      if (o.type2) {
        const f2 = E.filt(o.type2, o.f2, o.q2 || 0.7);
        f.connect(f2);
        last = f2;
      }
      last.connect(g);
      let node = g;
      if (o.panEnv) {
        const p = E.panner(0);
        V.env(p.pan, o.panEnv);
        g.connect(p);
        node = p;
      }
      E.out(node, o.bus || 'sfx', o);
    };

    // A generated buffer played through an optional filter. make() builds the buffer only when the
    // voice is actually scheduled; secs must match its length.
    I.play = (t, secs, make, vel, o) => {
      o = o || {};
      const V = E.voice(t, secs + 0.01, o.sustain !== false);
      if (!V) return;
      const s = ctx.createBufferSource();
      s.buffer = make();
      let last = s;
      if (o.filt) {
        const f = E.filt(o.filt[0], o.filt[1], o.filt[2]);
        s.connect(f);
        last = f;
      }
      const g = E.gain(vel);
      last.connect(g);
      E.out(g, o.bus || 'sfx', o);
      V.buf(s, 0);
    };

    // Wing flutter: band-passed noise sweeping f0 to f1 with a flap on each listed offset.
    I.flutter = (t, len, flaps, o) => {
      const amp = [[0, 0]];
      const fl = o.floor || 0.08;
      flaps.forEach((dt, i) => {
        const pk = o.vel * (o.grow ? 0.6 + (0.4 * i) / Math.max(1, flaps.length - 1) : 1);
        amp.push([dt, amp.length > 1 ? o.vel * fl : 0, 'lin']);
        amp.push([dt + 0.008, pk, 'lin']);
        amp.push([dt + 0.06, o.vel * fl, 'exp']);
      });
      amp.push([len, FLOOR, 'exp']);
      I.nz(t, len, {
        type: 'bandpass',
        q: 1.1,
        f: [[0, o.f0], [len, o.f1, 'exp']],
        amp,
        panEnv: o.pan ? [[0, -o.pan], [len, o.pan, 'lin']] : null,
        bus: 'sfx',
        room: 0.25,
        key: 'flutter',
      });
    };

    I.chew = (t, vel, pan) =>
      I.nz(t, 0.02, { type: 'highpass', q: 0.7, f: [[0, 4200]], amp: perc(vel, 0.0008, 0.012), pan, key: 'chew' });

    I.plip = (t, f0, f1, vel, o) => {
      o = o || {};
      const V = E.voice(t, 0.14, false);
      if (!V) return;
      for (const [k, a] of [
        [1, 1],
        [2, 0.25],
      ]) {
        const s = E.osc('sine', f0 * k);
        V.env(s.frequency, [[0, f0 * k], [0.05, f1 * k, 'exp']]);
        const g = E.gain(0);
        V.env(g.gain, [[0, 0], [0.002, vel * a], [0.02, vel * a * 0.6, 'exp'], [0.12, FLOOR, 'exp']]);
        s.connect(g);
        E.out(g, 'sfx', Object.assign({ room: 0.2 }, o));
        V.osc(s);
      }
    };

    I.glide = (t, f0, f1, len, vel, o) => {
      o = o || {};
      const V = E.voice(t, len + 0.3, false);
      if (!V) return;
      const s = E.osc('sine', f0);
      V.env(s.frequency, [[0, f0], [len, f1, 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.003, vel], [len, vel * 0.5, 'exp'], [len + 0.28, FLOOR, 'exp']]);
      s.connect(g);
      E.out(g, o.bus || 'sfx', o);
      V.osc(s);
    };

    // Low whump for the wing pumps: a rising sine body plus a soft rising noise sweep.
    I.whump = (t, vel) => {
      const V = E.voice(t, 0.42, false);
      if (!V) return;
      const s = E.osc('sine', 55);
      V.env(s.frequency, [[0, 55], [0.14, 88, 'exp'], [0.4, 80, 'lin']]);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.006, vel], [0.12, vel * 0.7, 'exp'], [0.4, FLOOR, 'exp']]);
      s.connect(g);
      E.out(g, 'bass');
      V.osc(s);
      const h = E.osc('triangle', 110);
      V.env(h.frequency, [[0, 110], [0.14, 176, 'exp']]);
      const hg = E.gain(0);
      V.env(hg.gain, perc(vel * 0.25, 0.005, 0.18));
      h.connect(hg);
      E.out(hg, 'sfx');
      V.osc(h, 0.25);
      I.nz(t, 0.3, {
        type: 'bandpass',
        q: 1.5,
        f: [[0, 220], [0.26, 1500, 'exp']],
        amp: [[0, 0], [0.02, vel * 0.08], [0.2, vel * 0.18, 'lin'], [0.3, FLOOR, 'exp']],
        key: 'whump',
      });
    };

    I.whistle = (t, len, f0, f1, vel) => {
      const V = E.voice(t, len + 0.05, false);
      if (!V) return;
      const s = E.osc('sine', f0);
      V.env(s.frequency, [[0, f0], [len, f1, 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.015, vel], [len, FLOOR, 'exp']]);
      s.connect(g);
      E.out(g, 'sfx', { hall: 0.15 });
      V.osc(s);
    };

    I.bleep = (t, f, vel) => {
      const V = E.voice(t, 0.07, false);
      if (!V) return;
      const s = E.osc('sine', f);
      const lp = E.filt('lowpass', 6500, 0.7);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.002, vel], [0.062, FLOOR, 'exp']]);
      s.connect(lp);
      lp.connect(g);
      E.out(g, 'sfx', { room: 0.15 });
      V.osc(s);
    };

    // Striated buzz: a rising saw, chopped at 30 Hz, through a feedback comb.
    I.buzz = (t, len, vel) => {
      const V = E.voice(t, len + 0.05, false);
      if (!V) return;
      const s = E.osc('sawtooth', 98);
      V.env(s.frequency, [[0, 98], [len, 196, 'exp']]);
      const chop = E.gain(0.5);
      const lfo = E.osc('square', 30);
      const lg = E.gain(0.45);
      lfo.connect(lg);
      lg.connect(chop.gain);
      const d = ctx.createDelay(0.05);
      d.delayTime.value = 0.0034;
      const fb = E.gain(0.55);
      const bp = E.filt('bandpass', 1300, 0.8);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.04, vel * 0.5], [len * 0.85, vel, 'lin'], [len, FLOOR, 'exp']]);
      s.connect(chop);
      chop.connect(bp);
      chop.connect(d);
      d.connect(fb);
      fb.connect(d);
      d.connect(bp);
      bp.connect(g);
      E.out(g, 'sfx', { hall: 0.25 });
      V.osc(s);
      V.osc(lfo);
    };

    // Reverse swell: noise rising exponentially into a hard stop at t + len.
    I.revSwell = (t, len, vel, o) => {
      o = o || {};
      const hi = o.hi || false;
      I.nz(t, len, {
        type: hi ? 'highpass' : 'lowpass',
        q: 0.7,
        f: hi ? [[0, 9000], [len, 3500, 'exp']] : [[0, 400], [len, o.fTop || 3500, 'exp']],
        type2: hi ? 'peaking' : null,
        f2: 9500,
        amp: [[0, vel * 0.004], [len - 0.012, vel, 'exp'], [len, FLOOR, 'lin']],
        stereo: true,
        sustain: true,
        bus: o.bus || 'sfx',
        hall: o.hall || 0.2,
        key: 'rev',
      });
    };

    // Stereo wind bed: wide noise through a slowly wandering band-pass. amp: env pts.
    I.wind = (t0, t1, amp, o) => {
      o = o || {};
      const len = t1 - t0;
      const f = [[0, 700]];
      for (let k = 1; k * 0.25 < len; k++) f.push([k * 0.25, 650 + 380 * lib.noise1(k * 0.23 + t0, 'film-wind'), 'lin']);
      I.nz(t0, len, { type: 'bandpass', q: 0.45, f, type2: 'lowpass', f2: o.lp || 2600, amp, stereo: true, sustain: true, bus: 'amb', key: 'wind' });
    };

    return I;
  }

  // ---------------------------------------------------------------- grain textures
  function flapGrains(r, t0, len, rate, o) {
    const out = [];
    const n = Math.floor(len * rate);
    for (let i = 0; i < n; i++) {
      const t = t0 + r() * len;
      out.push({
        t,
        dur: 0.05 + r() * 0.05,
        amp: (o.amp || 0.3) * (0.4 + 0.6 * r()),
        pan: (r() * 2 - 1) * (o.width || 0.9),
        f: (o.f0 || 380) + r() * (o.f1 || 1200),
        q: 0.9,
        att: 0.008 + r() * 0.008,
        dec: 0.02 + r() * 0.02,
      });
    }
    return out;
  }
  function clickGrains(r, t0, len, count, o) {
    const out = [];
    for (let i = 0; i < count; i++) {
      const u = o.shape ? Math.pow(r(), o.shape) : r();
      out.push({
        t: t0 + u * len,
        dur: 0.008,
        amp: (o.amp || 0.3) * (0.3 + 0.7 * r()),
        pan: (r() * 2 - 1) * (o.width || 0.9),
        f: (o.f0 || 3000) + r() * (o.f1 || 5000),
        q: o.q || 1.2,
        att: 0.0004,
        dec: o.dec || 0.0015,
      });
    }
    return out;
  }

  // ---------------------------------------------------------------- the score
  // «Learn» — light instrumental electronic, 120 bpm grid in a half-time feel (60 felt), F major.
  // Two cuts share this file: every section time comes from SEC(), keyed by FILM.TIMELINE.cut, and the
  // effects are driven by FILM.TIMELINE.cues (the cue list is the spec, one sound per kind).
  //   intro (uncertain): a hushed Dm9 pad, wind, three hesitant kalimba notes, the question
  //   groove (from the guide's appearance): felt kick on 1, brush on 3, soft hats, sub, 8th arpeggio
  //   lift (the results): shaker 16ths and a glock counter-line
  //   hush (before the call): the ride drops ~5 dB, drums thin out
  //   final: drums stop, an Fmaj9 bloom rings out to the last frame.
  const CH = {
    F: { pad: ['F3', 'A3', 'C4', 'E4'], root: 'F1', arp: ['F4', 'A4', 'C5', 'E5', 'C5', 'A4', 'G4', 'A4'] },
    Am: { pad: ['E3', 'A3', 'C4', 'G4'], root: 'A1', arp: ['A4', 'C5', 'E5', 'G5', 'E5', 'C5', 'B4', 'C5'] },
    Dm: { pad: ['D3', 'F3', 'A3', 'E4'], root: 'D2', arp: ['D5', 'F5', 'A5', 'E5', 'A4', 'F4', 'E4', 'F4'] },
    Bb: { pad: ['D3', 'F3', 'A3', 'C4'], root: 'Bb1', arp: ['Bb4', 'D5', 'F5', 'A5', 'F5', 'D5', 'C5', 'D5'] },
    C: { pad: ['C3', 'G3', 'Bb3', 'E4'], root: 'C2', arp: ['C5', 'E5', 'G5', 'Bb5', 'G5', 'E5', 'D5', 'E5'] },
  };
  const PROG = ['F', 'Am', 'Dm', 'Bb'];

  function SEC() {
    const cut = FILM.TIMELINE && Number(FILM.TIMELINE.cut) === 45 ? 45 : 60;
    return cut === 45
      ? { dur: 45, groove: 3, lift: 34, hush: 39.5, stop: 41, final: 41.5, end: 45 }
      : { dur: 60, groove: 4, lift: 45, hush: 51.5, stop: 54, final: 56, end: 60 };
  }
  // Section rides (dB, pre-compressor) are computed per cut, so MIX.ride is a getter.
  Object.defineProperty(MIX, 'ride', {
    enumerable: true,
    get() {
      const S = SEC();
      return [[0, -7], [S.groove - 0.05, -6], [S.groove + 0.2, -1.5], [S.lift, -0.5], [S.hush, -0.5], [S.hush + 1, -5.5], [S.final, -5], [S.end - 1.2, -9], [S.end - 0.05, -30]];
    },
  });

  function score(E, I) {
    const { kick, brush, hat, shaker, tock, marimba, kalimba, glock, glass, ting, pad, sub, pluck, boop, nz, plip, glide, whump, revSwell, wind } = I;
    const S = SEC();
    const BEAT = 0.5;
    const BAR = 2;
    const r3 = (x) => Math.round(x * 1000) / 1000;

    // ---- intro: uncertainty
    wind(0, S.groove + 0.6, [[0, 0], [0.6, 0.05], [S.groove - 0.3, 0.07, 'lin'], [S.groove + 0.6, FLOOR, 'exp']], { lp: 2200 });
    pad(0, S.groove, ['D3', 'F3', 'A3', 'E4'], 0.16, { att: 0.9, rel: 0.4, cut0: 500, cut1: 900, hall: 0.3 });
    const hes = S.dur === 45 ? [[0.45, 'D5'], [1.25, 'F5']] : [[0.5, 'D5'], [1.3, 'F5'], [1.9, 'E5']];
    for (const [t, n] of hes) kalimba(t, hz(n), 0.16, { hall: 0.3, delay: 0.14, pan: -0.2 });

    // ---- groove: one chord per bar from the guide's appearance
    const g0 = S.groove;
    for (let k = 0; g0 + k * BAR < S.end - 1e-6; k++) {
      const t = r3(g0 + k * BAR);
      const inFinal = t >= S.final - 1e-6;
      const name = inFinal ? 'F' : t >= S.stop - 1e-6 ? 'C' : PROG[k % 4];
      const ch = CH[name];
      const t1 = Math.min(t + BAR, S.end);
      if (!inFinal) {
        pad(t, t1, ch.pad, 0.2, { att: 0.12, rel: 0.25, cut0: 1100, cut1: 1700, hall: 0.22 });
        sub(t, t1 - 0.02, ch.root, t >= S.stop ? 0.22 : 0.36, { att: 0.02, rel: 0.12 });
      }
      const drums = t < S.stop - 1e-6;
      const thin = t >= S.hush - 1e-6;
      for (let b = 0; b < 4; b++) {
        const tb = r3(t + b * BEAT);
        if (tb >= S.end - 1e-6) break;
        if (drums) {
          if (b === 0) { kick(tb, thin ? 0.45 : 0.62, 'felt'); E.duck(tb, 0.45); }
          if (b === 2 && !thin) brush(tb, 0.34, 0.1);
          if (b === 2 && k % 2 === 1 && !thin) kick(r3(tb + 0.75), 0.3, 'felt');
          hat(r3(tb + BEAT / 2), thin ? 0.05 : 0.08);
          if (b % 2 === 1) hat(tb, 0.035);
          if (t >= S.lift && !thin) for (let q = 0; q < 2; q++) shaker(r3(tb + q * 0.25 + 0.125), 0.05, q ? 0.3 : -0.3);
        }
        // arpeggio (8ths) from the first full bar of the groove
        if (!inFinal && k >= 0) {
          for (let e = 0; e < 2; e++) {
            const ta = r3(tb + e * 0.25);
            const step = b * 2 + e;
            const vel = (step === 0 ? 0.14 : 0.1) * (t < g0 + BAR ? 0.7 : 1) * (thin ? 0.7 : 1);
            pluck(ta, ch.arp[step], vel, { dec: 0.5, bright: 5, delay: 0.1, room: 0.1, pan: step % 2 ? 0.22 : -0.22 });
          }
        }
      }
      // glock counter-line during the lift
      if (t >= S.lift - 1e-6 && t < S.hush - 1e-6) {
        glock(r3(t + 0.75), hz(ch.arp[2]), 0.1, { hall: 0.25, delay: 0.15 });
        glock(r3(t + 1.25), hz(ch.arp[3]), 0.08, { hall: 0.25, delay: 0.15 });
      }
    }

    // ---- final bloom: Fmaj9, ringing to the end
    pad(S.final, S.end, ['F3', 'C4', 'E4', 'G4', 'A4'], 0.24, { att: 0.3, rel: 0.4, cut0: 1300, cut1: 2200, hall: 0.35 });
    sub(S.final, S.end - 0.3, 'F1', 0.3, { att: 0.05, rel: 0.3 });
    ['F5', 'A5', 'C6', 'E6', 'G6'].forEach((n, i) => glock(r3(S.final + i * 0.125), hz(n), 0.12 - i * 0.012, { hall: 0.4, delay: 0.2 }));

    // ---- effects, one per cue kind
    const cues = (FILM.TIMELINE && FILM.TIMELINE.cues) || [];
    const count = {};
    for (const c of cues) {
      const t = c.t;
      const n = (count[c.kind] = (count[c.kind] || 0) + 1) - 1;
      const R = E.rng('cue', c.kind, t);
      switch (c.kind) {
        case 'tab':
          tock(t, 0.22, 1700 + n * 180, { bus: 'sfx', pan: [-0.4, 0.4, 0.1][n % 3], room: 0.2 });
          nz(t, 0.05, { type: 'highpass', f: [[0, 5000]], amp: [[0, 0], [0.001, 0.05], [0.03, FLOOR, 'exp']], key: 'tab' + n });
          break;
        case 'question':
          glass(t, hz('A5'), 0.12, { bus: 'sfx', hall: 0.35, delay: 0.2 });
          plip(r3(t + 0.18), 520, 780, 0.1, { hall: 0.3 });
          break;
        case 'assemble':
          revSwell(r3(t - 0.7), 0.7, 0.16, { fTop: 2800 });
          whump(t, 0.35);
          break;
        case 'logo':
          glock(t, hz('C6'), 0.12, { bus: 'sfx', hall: 0.35, delay: 0.18 });
          glock(r3(t + 0.06), hz('F6'), 0.08, { bus: 'sfx', hall: 0.35, delay: 0.18 });
          break;
        case 'card':
          boop(t, ['C5', 'D5', 'F5', 'A5'][n % 4], 0.12, { bus: 'sfx', pan: [-0.3, 0, 0.3][n % 3] });
          break;
        case 'tick':
          tock(t, 0.26, [1250, 1400, 1580][n % 3], { bus: 'sfx', pan: [-0.35, 0, 0.35][n % 3], room: 0.15 });
          break;
        case 'zoom':
        case 'handoff':
        case 'settle': {
          const len = c.kind === 'zoom' ? 0.6 : 0.5;
          nz(t, len, { type: 'bandpass', q: 1.1, f: [[0, 350], [len, 2600, 'exp']], amp: [[0, 0], [len * 0.6, 0.07], [len, FLOOR, 'exp']], stereo: true, key: c.kind + n, panEnv: [[0, -0.4], [len, 0.4, 'lin']] });
          if (c.kind === 'handoff') glide(r3(t + 0.1), 520, 880, 0.35, 0.05, { hall: 0.2 });
          break;
        }
        case 'section':
          ting(t, hz(['C6', 'D6', 'E6'][n % 3]), 0.09, { bus: 'sfx', hall: 0.35, delay: 0.12 });
          break;
        case 'type':
          for (let i = 0; i < 7; i++) {
            const tt = r3(t + i * 0.075 + (i ? R() * 0.02 : 0));
            tock(tt, 0.1 + R() * 0.06, 2600 + R() * 900, { bus: 'sfx', pan: (R() - 0.5) * 0.3, dec: 0.03 });
          }
          break;
        case 'click':
        case 'select':
          tock(t, 0.28, 2300, { bus: 'sfx', dec: 0.03, room: 0.1 });
          tock(r3(t + 0.07), 0.14, 2000, { bus: 'sfx', dec: 0.025 });
          break;
        case 'verified':
        case 'done':
          marimba(t, hz('C6'), 0.16, { bus: 'sfx', hall: 0.25 });
          marimba(r3(t + 0.09), hz('E6'), 0.14, { bus: 'sfx', hall: 0.25 });
          marimba(r3(t + 0.18), hz('G6'), 0.14, { bus: 'sfx', hall: 0.3, delay: 0.12 });
          break;
        case 'connect':
          plip(t, 330 + n * 40, 660 + n * 80, 0.12, { hall: 0.15 });
          tock(t, 0.12, 900, { bus: 'sfx', room: 0.2 });
          break;
        case 'pulse':
          glide(t, 700, 1200, 0.45, 0.05, { hall: 0.25 });
          glide(r3(t + 0.55), 1200, 700, 0.45, 0.04, { hall: 0.25 });
          break;
        case 'sheet':
          nz(t, 0.35, { type: 'highpass', f: [[0, 1800], [0.35, 4200, 'exp']], amp: [[0, 0], [0.08, 0.05], [0.35, FLOOR, 'exp']], stereo: true, key: 'sheet' + n });
          break;
        case 'goal':
          pluck(t, 'C5', 0.14, { bus: 'sfx', dec: 0.6, hall: 0.2 });
          pluck(r3(t + 0.12), 'F5', 0.12, { bus: 'sfx', dec: 0.8, hall: 0.25, delay: 0.1 });
          break;
        case 'step':
          marimba(t, hz(['C5', 'D5', 'F5'][n % 3]), 0.14, { bus: 'sfx', room: 0.2 });
          break;
        case 'highlight':
          glass(t, hz('E6'), 0.07, { bus: 'sfx', hall: 0.35 });
          break;
        case 'focus':
          nz(t, 0.28, { type: 'bandpass', q: 1.4, f: [[0, 900], [0.28, 2400, 'exp']], amp: [[0, 0], [0.12, 0.035], [0.28, FLOOR, 'exp']], key: 'focus' + n });
          boop(t, ['A5', 'C6', 'D6'][n % 3], 0.05, { bus: 'sfx' });
          break;
        case 'appear':
          plip(t, 800, 1200, 0.07, { hall: 0.2 });
          break;
        case 'result':
          boop(t, ['F5', 'A5', 'C6'][n % 3], 0.12, { bus: 'sfx', pan: [-0.3, 0, 0.3][n % 3], hall: 0.15 });
          break;
        case 'word':
          whump(t, 0.2);
          glass(t, hz(['A5', 'C6'][n % 2]), 0.08, { bus: 'sfx', hall: 0.3 });
          break;
        case 'arrow':
          glide(t, 880, 587, 0.4, 0.04, { hall: 0.3 });
          break;
        default:
          break; // open, duck, final: handled by the sections above
      }
    }
  }

  FILM.audio = {
    render(ctx, opts) {
      const o = opts || {};
      const start = Math.max(0, Number(o.start) || 0);
      const dest = o.dest || ctx.destination;
      const DUR = (FILM.TIMELINE && FILM.TIMELINE.duration) || FILM.DURATION || 32;
      // opts.mix overrides the mix constants (bus gains, trim); the analysis tools use it for solo renders.
      const om = o.mix || {};
      const mix = Object.assign({}, MIX, om, {
        bus: Object.assign({}, MIX.bus, om.bus || {}),
        eq: Object.assign({}, MIX.eq, om.eq || {}),
        comp: Object.assign({}, MIX.comp, om.comp || {}),
      });
      const E = makeEngine(ctx, start, dest, DUR, mix);
      const I = instruments(E);
      // The score is scheduled one bar at a time, so the audio graph only ever holds the voices of
      // the next few seconds. Each voice belongs to exactly one bar by its start time, so the output
      // is the same as scheduling everything at once. The first bar also takes every earlier voice
      // still sounding at `start`.
      const BAR = 240 / ((FILM.TIMELINE && FILM.TIMELINE.bpm) || 120);
      const first = Math.floor(start / BAR);
      const last = Math.ceil(DUR / BAR) - 1;
      const run = (k) => {
        E.w0 = k === first ? -Infinity : k * BAR;
        E.w1 = k === last ? Infinity : (k + 1) * BAR;
        score(E, I);
      };
      const due = (k) => E.base + (k * BAR - start) - LAT; // context time of bar k's first event
      run(first);
      let k = first + 1;
      const isOffline = typeof OfflineAudioContext !== 'undefined' && ctx instanceof OfflineAudioContext;
      if (isOffline && typeof ctx.suspend !== 'function') {
        // An offline context that cannot pause mid-render gets every bar up front.
        for (; k <= last; k++) run(k);
      } else if (isOffline) {
        // Offline: pause the render 0.25 s before each bar, schedule it, resume.
        const q = 128 / ctx.sampleRate;
        const end = ctx.length / ctx.sampleRate;
        for (; k <= last; k++) {
          const j = k;
          const when = Math.floor((due(j) - 0.25) / q) * q;
          if (when >= end - q) break; // this bar starts after the render window ends
          let paused = null;
          if (when > ctx.currentTime + q) {
            try {
              paused = ctx.suspend(when);
            } catch (e) {
              paused = null;
            }
          }
          if (!paused) run(j);
          else
            paused.then(
              () => {
                run(j);
                ctx.resume();
              },
              () => run(j)
            );
        }
      } else {
        // Live: a look-ahead timer schedules each bar 1.5 s before it sounds.
        const AHEAD = 1.5;
        const pump = () => {
          while (k <= last && due(k) - ctx.currentTime < AHEAD) run(k++);
          return k <= last;
        };
        if (pump()) {
          const timer = setInterval(() => {
            if (ctx.state === 'closed' || !pump()) clearInterval(timer);
          }, 100);
        }
      }
    },
  };
})();

</script>
<script>
// ---- src/player.js
/*
 * player.js : the interactive page around the film.
 *
 *   click or space   play / pause (with audio)
 *   left / right     step one frame back / forward
 *   ?t=seconds       open paused on that global time
 *   ?shot=id         loop one shot
 *   ?render=1        no UI, canvas at native size, nothing drawn until asked (used by tools)
 *
 * The clock while playing is the AudioContext clock when there is music, otherwise the
 * requestAnimationFrame timestamp. Nothing here draws: it only calls FILM.renderFrame(T).
 */
(function () {
  'use strict';

  const FILM = window.FILM;
  if (!FILM || typeof FILM.renderFrame !== 'function') return;

  const params = new URLSearchParams(window.location.search);
  const renderMode = params.get('render') === '1';

  if (renderMode) {
    // tools mount their own canvas; keep the page inert
    document.documentElement.style.background = '#000';
    return;
  }

  function start() {
    if (FILM.TIMELINE) FILM.prepare(); // applies a timeline-declared fps before it is read
    const FPS = FILM.FPS;
    const duration = FILM.DURATION;
    const shotId = params.get('shot');
    const loopShot = shotId ? FILM.shotById(shotId) : null;
    const rangeStart = loopShot ? loopShot.start : 0;
    const rangeEnd = loopShot ? loopShot.end : duration;
    const tParam = params.get('t');

    const style = document.createElement('style');
    style.textContent = [
      'html,body{margin:0;height:100%;background:#000;overflow:hidden}',
      'body{display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-user-select:none;user-select:none}',
      `#film{display:block;height:min(100vh,calc(100vw*${FILM.H}/${FILM.W}));width:auto;` +
        `aspect-ratio:${FILM.W}/${FILM.H};background:#000}`,
      '#hud{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;font:12px/1.4 ui-monospace,Menlo,monospace;color:#bbb;',
      'display:flex;justify-content:space-between;pointer-events:none;transition:opacity .4s;text-shadow:0 1px 2px #000}',
      '#bar{position:fixed;left:0;bottom:0;height:2px;background:#e8e0cf;width:0;pointer-events:none}',
      'body.playing #hud{opacity:0}',
      'body.playing:hover #hud{opacity:.85}',
    ].join('');
    document.head.appendChild(style);

    const canvas = document.createElement('canvas');
    canvas.id = 'film';
    document.body.appendChild(canvas);
    FILM.mount(canvas);

    const hud = document.createElement('div');
    hud.id = 'hud';
    const left = document.createElement('span');
    const right = document.createElement('span');
    right.textContent = 'click or space: play/pause   ← →: step';
    hud.appendChild(left);
    hud.appendChild(right);
    document.body.appendChild(hud);
    const bar = document.createElement('div');
    bar.id = 'bar';
    document.body.appendChild(bar);

    let T = tParam != null && isFinite(Number(tParam)) ? Number(tParam) : rangeStart;
    let playing = false;
    let audio = null; // { ctx, anchor, startT }
    let rafStamp0 = null;
    let rafT0 = 0;
    let lastDrawn = -1;

    const quant = (t) => Math.floor(t * FPS + 1e-6) / FPS;

    function draw(force) {
      const q = quant(Math.min(Math.max(T, rangeStart), rangeEnd - 1 / FPS));
      if (!force && q === lastDrawn) return;
      lastDrawn = q;
      FILM.errors = [];
      const shot = FILM.renderFrame(q);
      if (FILM.errors.length && window.console) console.warn('FILM errors at', q, FILM.errors);
      left.textContent = `${q.toFixed(2)}s  f${Math.round(q * FPS)}  ${shot ? shot.id : ''}`;
      bar.style.width = `${(100 * (q - rangeStart)) / Math.max(1e-6, rangeEnd - rangeStart)}%`;
    }

    function stopAudio() {
      if (audio) {
        const c = audio.ctx;
        audio = null;
        c.close();
      }
    }

    function startAudio(fromT) {
      stopAudio();
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC || !FILM.audio || typeof FILM.audio.render !== 'function') return;
      const ctx = new AC({ latencyHint: 'playback', sampleRate: 48000 });
      const master = ctx.createGain();
      master.connect(ctx.destination);
      const anchor = ctx.currentTime;
      try {
        FILM.audio.render(ctx, { start: fromT, dest: master });
      } catch (e) {
        if (window.console) console.error('FILM.audio.render failed', e);
      }
      audio = { ctx, anchor, startT: fromT };
    }

    function play() {
      if (T >= rangeEnd - 1 / FPS) T = rangeStart;
      playing = true;
      document.body.classList.add('playing');
      startAudio(T);
      rafStamp0 = null;
      rafT0 = T;
    }

    function pause() {
      playing = false;
      document.body.classList.remove('playing');
      stopAudio();
      T = quant(T);
      draw(true);
    }

    function tick(stamp) {
      if (playing) {
        if (audio) {
          const lat = (audio.ctx.baseLatency || 0) + (audio.ctx.outputLatency || 0);
          T = audio.startT + Math.max(0, audio.ctx.currentTime - audio.anchor - lat);
        } else {
          if (rafStamp0 == null) rafStamp0 = stamp;
          T = rafT0 + (stamp - rafStamp0) / 1000;
        }
        if (T >= rangeEnd) {
          T = rangeStart;
          if (audio) startAudio(T);
          rafStamp0 = stamp;
          rafT0 = T;
        }
        draw(false);
      }
      window.requestAnimationFrame(tick);
    }

    function step(n) {
      if (playing) pause();
      const f = Math.round(quant(T) * FPS) + n;
      const f0 = Math.round(rangeStart * FPS);
      const f1 = Math.round(rangeEnd * FPS) - 1;
      T = Math.min(f1, Math.max(f0, f)) / FPS;
      draw(true);
    }

    canvas.addEventListener('click', () => (playing ? pause() : play()));
    document.body.addEventListener('click', (e) => {
      if (e.target === document.body) playing ? pause() : play();
    });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        playing ? pause() : play();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        step(1);
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        step(-1);
      }
    });

    draw(true);
    window.requestAnimationFrame(tick);
  }

  // Photos decode asynchronously and the hand-lettering face resolves asynchronously; drawing before
  // either is ready shows a half-built frame (and hashes differently from the same frame drawn later).
  const boot = () =>
    Promise.all([
      FILM.loadPhotos ? FILM.loadPhotos() : Promise.resolve(),
      document.fonts ? document.fonts.ready : Promise.resolve(),
    ]).then(start);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
