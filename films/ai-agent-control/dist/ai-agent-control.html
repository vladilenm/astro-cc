      ctx.arc(TRACK.x, ROWS[i].cy, 7, 0, Math.PI * 2);
      ctx.fillStyle = passed ? P.sig : P.panel;
      ctx.fill();
      ctx.strokeStyle = passed ? P.sig : P.hairHi;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawBarrier(ctx, L, t) {
    const P = L.pal, ui = L.ui;
    const k = ui.kf(t, ROWS[2].tIn, 6 * FR, 'outCubic');
    if (k <= 0) return;
    const cx = (BARRIER.x0 + BARRIER.x1) / 2;
    const half = ((BARRIER.x1 - BARRIER.x0) / 2) * k;
    const fl = t >= B_HIT - 1e-6 ? 1 - clamp((t - B_HIT) / (12 * FR)) : 0; // flash on the hit
    const white = t >= B_HIT - 1e-6 && t < B_HIT + 2 * FR ? 0.65 : 0;
    ui.glow(ctx, cx, BARRIER.y, 70 + 50 * fl, P.danger, 0.22 + 0.6 * fl);
    ctx.save();
    ctx.fillStyle = white ? L.mix(P.danger, P.txt, white) : P.danger;
    ctx.fillRect(cx - half, BARRIER.y - 3, half * 2, 6);
    // end posts
    ctx.fillRect(cx - half - 1, BARRIER.y - 11, 4, 22);
    ctx.fillRect(cx + half - 3, BARRIER.y - 11, 4, 22);
    ctx.restore();
  }

  function drawToken(ctx, L, t, tok) {
    const ui = L.ui, P = L.pal;
    const pk = ui.pop(t, B_HEAD);
    if (pk <= 0) return;
    const state = t >= B_HIT - 1e-6 ? 'blocked' : t >= M1[0] ? 'busy' : 'idle';
    const s = TOKEN_S * (0.6 + 0.4 * pk);
    // eyes glance at the row the token is working on
    const look = state === 'busy' && (t >= ROWS[0].tHit - 1e-6) ? 0.9 : 0;
    // one blink while it waits for the confirmation
    const blink = t >= 2.25 - 1e-6 && t < 2.25 + 2 * FR ? 1 : 0;
    // waiting ring around the token at row 2
    if (t >= WAIT[0] - 1e-6 && t < M3[0] + 2 * FR) {
      const a = ui.kf(t, WAIT[0], WAIT[1] - WAIT[0]);
      const fade = t > WAIT[1] ? 1 - clamp((t - WAIT[1]) / (0.25 + 2 * FR)) : 1;
      ctx.save();
      ctx.globalAlpha *= fade;
      ctx.strokeStyle = P.hairHi;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(tok.x, tok.y, 41, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = P.sig;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(tok.x, tok.y, 41, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * a);
      ctx.stroke();
      ctx.restore();
    }
    if (state === 'blocked') ui.glow(ctx, tok.x, tok.y, 90, P.danger, 0.3);
    ui.agent(ctx, tok.x, tok.y, s, { state, glow: state === 'busy' ? 0.9 : 0.5, look, blink });
  }

  function drawRequest(ctx, L, t) {
    const P = L.pal, ui = L.ui;
    const pk = ui.pop(t, B_REQ);
    if (pk <= 0) return;
    const a = clamp((t - B_REQ + FR) / (3 * FR));
    const sc = 0.86 + 0.14 * pk;
    const cx = REQ.x + REQ.w / 2, cy = REQ.y + REQ.h / 2;
    // glow breathes once per bar (2 s) after the pop
    const br = t > B_REQ ? 0.5 - 0.5 * Math.cos((Math.PI * 2 * (t - B_REQ)) / 2) : 0;
    const flash = 1 - clamp((t - B_REQ) / (10 * FR));
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.translate(cx, cy);
    ctx.scale(sc, sc);
    ctx.translate(-cx, -cy);
    ui.glow(ctx, cx, cy, 460, P.sig, 0.1 + 0.08 * br + 0.18 * flash);
    ui.panel(ctx, REQ.x, REQ.y, REQ.w, REQ.h, { r: REQ.r, fill: P.panel, stroke: P.sig, lw: 3, glow: L.rgba(P.sig, 0.55 + 0.35 * br), glowBlur: 34 });
    ui.user(ctx, REQ.x + 56, REQ.y + 58, 56);
    ui.label(ctx, 'Подтвердите действие', REQ.x + 104, REQ.y + 52, { size: 34, weight: 700, color: P.txt, tracking: -0.3 });
    ui.rich(ctx, [['агент: ', P.txtDim], ['rm -rf src/', P.txt]], REQ.x + 104, REQ.y + 92, { size: 28, font: 'mono', weight: 500 });
    // two answers; the developer's decision is not shown — the dialog only asks
    const by = REQ.y + REQ.h - 42;
    const allow = ui.chip(ctx, 'Разрешить', REQ.x + REQ.w - 28, by, { size: 28, weight: 600, color: P.txtDim, fill: P.panelHi, stroke: P.hairHi, align: 'right', h: 52, padX: 26, r: 14 });
    ui.chip(ctx, 'Отклонить', allow.x - 14, by, { size: 28, weight: 700, color: P.bg, fill: P.sig, stroke: null, align: 'right', h: 52, padX: 26, r: 14 });
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, ui = L.ui;
      const t = clamp(tIn, 0, info.dur);
      const T = info.shot.start + t;

      // 1 plate
      ui.bg(ctx, { plate: 'interface', oy: -T * 12 });

      // 2 tag + headline (screen-fixed)
      ui.tag(ctx, '// правила', t - B_HEAD);
      ui.headline(ctx, ['Доступ. Лимиты.', '[Подтверждение.]'], t - B_HEAD);

      // 3 rules panel: slides up 40 px and fades in over 6 frames
      const kP = ui.kf(t, 0, 6 * FR, 'outCubic');
      const tok = tokenPose(L, t);
      ctx.save();
      ctx.globalAlpha *= clamp(kP * 1.2);
      ctx.translate(0, (1 - kP) * 40);
      ui.panel(ctx, PANEL.x, PANEL.y, PANEL.w, PANEL.h, { r: PANEL.r, fill: P.panel, stroke: P.hairHi });
      drawHeader(ctx, L);

      // 4 rows (clipped to the panel so they slide in from under its right edge)
      ctx.save();
      ctx.beginPath();
      ui.rr(ctx, PANEL.x + 2, PANEL.y + 2, PANEL.w - 4, PANEL.h - 4, PANEL.r - 2);
      ctx.clip();
      for (let i = 0; i < ROWS.length; i++) drawRow(ctx, L, i, t);
      ctx.restore();

      // 5 track, stations, barrier
      drawTrack(ctx, L, t, tok);
      drawBarrier(ctx, L, t);

      // 6 the agent token
      drawToken(ctx, L, t, tok);
      ctx.restore();

      // 7 dim veil: the rules step back to 70 % when the request arrives
      const dim = ui.kf(t, B_REQ, 4 * FR, 'outCubic');
      if (dim > 0) {
        ctx.save();
        ctx.beginPath();
        ui.rr(ctx, PANEL.x - 2, PANEL.y - 2, PANEL.w + 4, PANEL.h + 4, PANEL.r + 2);
        ctx.fillStyle = L.rgba(P.bg, 0.3 * dim);
        ctx.fill();
        ctx.restore();
      }

      // 8 the confirmation request
      drawRequest(ctx, L, t);
    },
  });
})();

</script>
<script>
// ---- src/scenes/07-verify.js
/*
 * 07 verify : «Проверяем результат» — T 33.0–39.0 (6 s), interface plate, enters on a hard cut.
 *
 * After the changes, a check: the execution history lights step by step on an accelerating rhythm,
 * then the compact app slides back in, the query «оплат» finds ticket 1042 and a green test badge
 * lights on T 37.5 (the resolving chord).
 *
 * Layers, back to front:
 *   1 plate (ui.bg, dot grid drifting 6 px per beat)
 *   2 tag «// проверка» + headline «Видно, что сделал агент. / Видно, что работает.» (screen-fixed)
 *   3 history panel «история выполнения»: the step line, four step nodes, step labels
 *   4 compact app (ui.app at 0.859 scale, top 400 design px, bottom dissolving into the plate)
 *   5 test link (step 4 → badge) and the green test badge
 *
 * Beats (shot-local t, global T in comments):
 *   0.000 T 33.00  history panel slides up 40 px + fades (6 frames)
 *   0.250 T 33.25  tag + headline
 *   0.500 T 33.50  step 1 «Прочитал файлы»        1.500 T 34.50  step 2 «Предложил изменения»
 *   2.250 T 35.25  step 3 «Получил подтверждение»  2.750 T 35.75  step 4 «Проверил поиск»
 *   3.000 T 36.00  compact app slides in from the right (x 1100 → 162, outCubic, 8 frames)
 *   3.500 T 36.50  «оплат» typed on 16ths, one letter per click (36.5 … 37.0)
 *   4.250 T 37.25  filter 0 → 1
 *   4.500 T 37.50  mark → 1, test badge pops green, step 4's node turns green
 */
(function () {
  'use strict';

  const ID = 'verify';
  const FR = 1 / 24;

  // ---- geometry (docs/storyboard.md, shot 07) ----------------------------------
  const HIST = { x: 90, y: 572, w: 900, h: 396, r: 28 };
  const NODE_X = 146;
  const NODE_R = 16;
  const TEXT_X = 186;
  const STEPS = [
    { cy: 676, label: 'Прочитал файлы', t: 0.5 }, // T 33.50
    { cy: 752, label: 'Предложил изменения', t: 1.5 }, // T 34.50
    { cy: 828, label: 'Получил подтверждение', t: 2.25, user: true }, // T 35.25
    { cy: 904, label: 'Проверил поиск', t: 2.75 }, // T 35.75
  ];
  const APP = { x: 162, y: 1000, w: 756 };
  const APP_S = APP.w / 880;
  const APP_CLIP = 404; // design px kept (title bar, header, search, first row)
  const APP_BOTTOM = APP.y + APP_CLIP * APP_S; // ≈ 1347
  const FADE_H = 30; // the last 30 px dissolve into the plate
  const BADGE = { x: 918, y: 984, str: 'тест: поиск находит обращение', size: 28 };

  // ---- beats (shot-local seconds) ----------------------------------------------
  const B_HEAD = 0.25; // T 33.25
  const B_APP = 3.0; // T 36.00
  const B_TYPE = 3.5; // T 36.50
  const B_FILTER = 4.25; // T 37.25
  const B_PASS = 4.5; // T 37.50
  const QUERY = 'оплат';

  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, u) => a + (b - a) * u;

  // A scratch layer for the compact app's dissolve. Fully cleared and redrawn every frame it is used,
  // so nothing carries over between frames (it is a buffer, not a cache).
  let SCRATCH = null;
  function scratch(w, h) {
    if (!SCRATCH || SCRATCH.width !== w || SCRATCH.height !== h) {
      SCRATCH = FILM.makeCanvas(w, h);
    }
    return SCRATCH;
  }

  function drawHistory(ctx, L, t) {
    const P = L.pal, ui = L.ui;
    const k = ui.kf(t, 0, 6 * FR, 'outCubic');
    ctx.save();
    ctx.globalAlpha *= clamp(k * 1.2);
    ctx.translate(0, (1 - k) * 40);
    ui.panel(ctx, HIST.x, HIST.y, HIST.w, HIST.h, { r: HIST.r, fill: P.panel, stroke: P.hairHi });
    ui.label(ctx, 'история выполнения', 130, 618, { size: 26, font: 'mono', weight: 500, color: P.txtFaint, tracking: 0.5 });
    // step counter on the right: how many steps are done
    let done = 0;
    for (const s of STEPS) if (t >= s.t - 1e-6) done++;
    ui.label(ctx, `${done}/${STEPS.length}`, HIST.x + HIST.w - 40, 618, { size: 26, font: 'mono', weight: 500, color: done ? P.txtDim : P.txtFaint, align: 'right' });

    // the step line: a faint hair from node 1 to node 4, then orange segments drawing on
    const y0 = STEPS[0].cy, y3 = STEPS[STEPS.length - 1].cy;
    ctx.fillStyle = P.hair;
    ctx.fillRect(NODE_X - 1, y0, 2, y3 - y0);
    for (let i = 0; i < STEPS.length - 1; i++) {
      const s = STEPS[i], n = STEPS[i + 1];
      const d = ui.kf(t, s.t, 6 * FR, 'outCubic');
      if (d <= 0) continue;
      const a = s.cy + NODE_R, b = n.cy - NODE_R;
      ctx.fillStyle = P.sig;
      ctx.fillRect(NODE_X - 1.5, a, 3, (b - a) * d);
    }

    // steps
    for (let i = 0; i < STEPS.length; i++) {
      const s = STEPS[i];
      const on = t >= s.t - 1e-6;
      const pk = ui.pop(t, s.t);
      const lit = ui.kf(t, s.t, 4 * FR);
      // step 4 turns green when the test passes: a green node pops over the orange one (no muddy blend)
      const green = i === STEPS.length - 1 ? ui.pop(t, B_PASS) : 0;
      // hollow node (before)
      ctx.beginPath();
      ctx.arc(NODE_X, s.cy, NODE_R, 0, Math.PI * 2);
      ctx.fillStyle = P.panel;
      ctx.fill();
      ctx.strokeStyle = P.hairHi;
      ctx.lineWidth = 2;
      ctx.stroke();
      if (on) {
        // glow flash on the pop, and again (green) when the test passes
        const fl = 1 - clamp((t - s.t) / (12 * FR));
        ui.glow(ctx, NODE_X, s.cy, 70, P.sig, 0.55 * fl);
        if (green > 0) {
          const gf = 1 - clamp((t - B_PASS) / (14 * FR));
          ui.glow(ctx, NODE_X, s.cy, 80, P.ok, 0.18 + 0.6 * gf);
        }
        const r = NODE_R * Math.max(0, pk);
        ctx.beginPath();
        ctx.arc(NODE_X, s.cy, r, 0, Math.PI * 2);
        ctx.fillStyle = P.sig;
        ctx.fill();
        if (green > 0) {
          ctx.beginPath();
          ctx.arc(NODE_X, s.cy, NODE_R * green, 0, Math.PI * 2);
          ctx.fillStyle = P.ok;
          ctx.fill();
        }
        if (pk > 0.6) ui.icon(ctx, 'check', NODE_X, s.cy + 1, 20 * Math.min(1, pk), { color: P.bg, lw: 3.5 });
      }
      // label: faint before, bright after
      const col = on ? L.mix(P.txtFaint, P.txt, lit) : P.txtFaint;
      const lw = ui.label(ctx, s.label, TEXT_X, s.cy + 1, { size: 36, weight: 600, color: col, baseline: 'middle', tracking: -0.3 });
      if (s.user && on) {
        const up = ui.pop(t, s.t + 2 * FR);
        if (up > 0) {
          ctx.save();
          ctx.translate(TEXT_X + lw + 34, s.cy);
          ctx.scale(up, up);
          ui.user(ctx, 0, 0, 36, { ring: P.sigDeep });
          ctx.restore();
        }
      }
    }
    ctx.restore();
  }

  /** ui.app state at shot time t. «оплат» is typed one letter per 16th: 36.5, 36.625 … 37.0 (the five key clicks). */
  function appState(ui, t, T) {
    const typedN = t >= B_TYPE - 1e-6 ? Math.min(QUERY.length, Math.floor((t - B_TYPE) * 8 + 1e-6) + 1) : 0;
    const q = QUERY.slice(0, typedN);
    const typing = t >= B_TYPE - 1e-6 && t < B_TYPE + 0.5 + 2 * FR;
    return {
      search: 1,
      focus: 1,
      query: q,
      caret: true,
      t: typing ? 0 : T, // solid caret while typing, blinking otherwise
      filter: t >= B_FILTER - 1e-6 ? (t - B_FILTER + FR) / (B_PASS - B_FILTER) : 0,
      mark: ui.kf(t, B_PASS, 4 * FR),
    };
  }

  /** The compact app: top 404 design px only, its bottom 30 px dissolving into the plate. */
  function drawApp(ctx, L, x, st) {
    const S = ctx.canvas.width / FILM.W; // device pixels per logical pixel (the base transform)
    const pad = 44;
    const rx = Math.floor(x - pad), ry = APP.y - pad;
    const rw = Math.ceil(APP.w + pad * 2), rh = Math.ceil(APP_BOTTOM - ry);
    const cw = Math.max(2, Math.ceil(rw * S)), ch = Math.max(2, Math.ceil(rh * S));
    const c = scratch(cw, ch);
    const g = c.getContext('2d');
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, cw, ch);
    g.setTransform(S, 0, 0, S, -rx * S, -ry * S);
    L.ui.app(g, x, APP.y, APP.w, st);
    // dissolve the bottom edge
    g.globalCompositeOperation = 'destination-out';
    const gr = g.createLinearGradient(0, APP_BOTTOM - FADE_H, 0, APP_BOTTOM);
    gr.addColorStop(0, L.rgba(L.pal.bg, 0));
    gr.addColorStop(1, L.rgba(L.pal.bg, 1));
    g.fillStyle = gr;
    g.fillRect(rx, APP_BOTTOM - FADE_H, rw, FADE_H + 2);
    g.restore();
    ctx.drawImage(c, 0, 0, cw, ch, rx, ry, cw / S, ch / S);
  }

  /**
   * The empty slot where the app will land: a quiet dashed outline with the app icon, so the lower
   * stage is not a void while the history lights. Fades in with the headline, fades out as the app arrives.
   */
  function drawSlot(ctx, L, t, kA) {
    const P = L.pal, ui = L.ui;
    const a = ui.kf(t, B_HEAD, 8 * FR, 'outCubic') * (1 - kA);
    if (a <= 0) return;
    const x = APP.x, y = APP.y, w = APP.w, h = APP_BOTTOM - APP.y, r = 28 * APP_S;
    ctx.save();
    ctx.globalAlpha *= a;
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, L.rgba(P.hairHi, 1));
    g.addColorStop(0.6, L.rgba(P.hairHi, 0.6));
    g.addColorStop(1, L.rgba(P.hairHi, 0));
    ctx.strokeStyle = g;
    ctx.lineWidth = 2;
    ctx.setLineDash([12, 10]);
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h);
    ctx.stroke();
    ctx.setLineDash([]);
    ui.icon(ctx, 'app', 540, 1142, 48, { color: P.txtFaint, lw: 3 });
    ui.label(ctx, 'приложение', 540, 1212, { size: 26, font: 'mono', weight: 500, color: P.txtFaint, align: 'center', tracking: 0.5 });
    ctx.restore();
  }

  function drawBadge(ctx, L, t) {
    const P = L.pal, ui = L.ui;
    const pk = ui.pop(t, B_PASS);
    if (pk <= 0) return;
    const o = { size: BADGE.size, weight: 600, icon: 'check', color: P.ok, fill: P.okTint, stroke: P.ok, h: 52, padX: 20, lw: 2.5 };
    const tw = ui.measure(ctx, BADGE.str, { size: o.size, weight: o.weight });
    const w = tw + o.padX * 2 + o.size + 10;
    const cx = BADGE.x - w / 2;
    // green glow flash 0.6 → 0.2 over 12 frames, then holds
    const fl = 1 - clamp((t - B_PASS) / (12 * FR));
    ui.glow(ctx, cx, BADGE.y, 230, P.ok, 0.12 + 0.48 * fl);
    ctx.save();
    ctx.globalAlpha *= clamp(pk * 2);
    ctx.translate(cx, BADGE.y);
    ctx.scale(pk, pk);
    ui.chip(ctx, BADGE.str, -w / 2, 0, o);
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, P = L.pal, ui = L.ui;
      const t = clamp(tIn, 0, info.dur);
      const T = info.shot.start + t;

      // 1 plate
      ui.bg(ctx, { plate: 'interface', oy: -T * 12 });

      // 2 tag + headline (screen-fixed)
      ui.tag(ctx, '// проверка', t - B_HEAD);
      ui.headline(ctx, ['Видно, что сделал агент.', 'Видно, [что работает.]'], t - B_HEAD);

      // 3 execution history
      drawHistory(ctx, L, t);

      // 4 the compact app slides in from the right
      const kA = ui.kf(t, B_APP, 8 * FR, 'outCubic');
      drawSlot(ctx, L, t, kA);
      if (kA > 0) {
        const x = lerp(1100, APP.x, kA);
        drawApp(ctx, L, x, appState(ui, t, T));
      }

      // 5 the green test badge
      drawBadge(ctx, L, t);
    },
  });
})();

</script>
<script>
// ---- src/scenes/08-real-project.js
/*
 * 08 real-project : «Это можно разобрать самому». T 39–45 (6 s), interface — opens on the schematic plate. Hard cut in.
 *
 * The engineering frame from shot 05 is not abstract: the camera pulls back and the schema turns out to be a
 * tracing sheet lying over the real React project «Обращения клиентов». The schema thins to a faint line
 * overlay and a plain lesson card («Бесплатный урок», «React · TypeScript») frames the readable app.
 * Honesty (art bible §0.7, §10.6): no portrait, no player chrome, no play button, no REC dot, no timecode —
 * the card is a plain panel with two chips around the app UI.
 *
 * World placement: the app sits at G1 (x 100, y 590, w 880 — its 880 × 760 design size) under the canonical
 * schema. The camera pulls back from (540, 960) ×1 to (540, 945.56) ×0.9 (inOutCubic, zoom in log space),
 * which lands the app exactly on the card rect x 144, y 640, w 792, h 684 — the rect an editor can replace
 * with real lesson footage from T 41.0. At ×0.9 the whole schema (x 135–945, y 606–1320 on screen) lies
 * over the app.
 *
 * Layers, back to front:
 *   1. plate: schematic → interface crossfade, screen-fixed, drifting 6 px per beat (t 0.5–2.0)
 *   2. lesson card fill (screen, from t 2.0)
 *   3. camera: the app (fades in t 0.5–1.25), ui.schema at full strength (fades out), the thin line overlay
 *      (fades in, lines thin), the signal pulses (one per beat, one per bar from t 2.5)
 *   4. lesson card outline draw-on + chips (t 2.0, 2.125)
 *   5. tag + headline (t 1.0), screen-fixed
 */
(function () {
  'use strict';
  const ID = 'real-project';
  const FR = 1 / 24;

  // ---- beats (shot-local seconds; global T in comments) ----
  const B_PULL = 0.5; //    T 39.5   pull-back starts; the app fades in under the schema
  const PULL_DUR = 1.5; //  → T 41.0
  const APP_IN = 0.75; //   app alpha 0 → 1 by T 40.25
  const B_HEAD = 1.0; //    T 40.0   tag + headline
  const B_CARD = 2.0; //    T 41.0   lesson card draws on, chip 1 pops
  const B_CHIP2 = 2.125; // T 41.125 chip 2 pops
  const B_THIN = 2.5; //    T 41.5   overlay 0.22 → 0.12, pulses slow to one per bar
  const THIN_DUR = 0.5; //  → T 42.0 app fully readable («настоящем»)

  const OV_MID = 0.22; // overlay strength when the pull-back lands
  const OV_END = 0.12; // after T 42.0

  // ---- screen geometry (storyboard 08, Forms) ----
  // h 760 (storyboard: 736) so the card keeps the same 40 px margin left, right and below the app (bottom 1364,
  // still 32 px clear of the caption band); the top margin carries the chips.
  const CARD = { x: 104, y: 604, w: 872, h: 760, r: 32 };
  const CARD_APP = { x: 144, y: 640, w: 792 }; // h = 760 · 792 / 880 = 684 → bottom 1324

  const TAG = '// бесплатный урок';
  const HEAD = ['Бесплатный урок.', '[Реальный проект.]'];
  const CHIP1 = 'Бесплатный урок';
  const CHIP2 = 'React · TypeScript';

  /** Camera for shot-local t: identity until B_PULL, then ×1 → ×0.9 onto the card rect. */
  function camAt(L, t, W, H) {
    const A = L.GEO.APP;
    const z1 = CARD_APP.w / A.w; // 0.9
    const c1x = A.x - (CARD_APP.x - W / 2) / z1; // 540
    const c1y = A.y - (CARD_APP.y - H / 2) / z1; // 945.56
    const u = L.ease.inOutCubic(L.clamp((t - B_PULL) / PULL_DUR));
    return { x: L.lerp(W / 2, c1x, u), y: L.lerp(H / 2, c1y, u), zoom: Math.exp(Math.log(z1) * u), u };
  }

  /** The schema as a thin line tracing (no fills, no labels): rings, core outline, routes, gates, tool outlines. */
  function overlay(ctx, L, a, wk) {
    if (a <= 0.002) return;
    const G = L.GEO, ui = L.ui, P = L.pal;
    ctx.save();
    ctx.globalAlpha *= a;
    const ringC = P.txt;
    for (let i = G.RINGS.length - 1; i >= 0; i--) {
      ui.arrow(ctx, ui.ringPts(G.RINGS[i]), { head: false, r: 0, lw: 2 * wk, color: ringC });
    }
    const C = G.CORE;
    ctx.beginPath();
    ui.rr(ctx, C.x, C.y, C.w, C.h, 26);
    ctx.strokeStyle = P.sig;
    ctx.lineWidth = 3 * wk;
    ctx.stroke();
    for (const Rt of G.ROUTES) ui.arrow(ctx, Rt.pts, { lw: 4 * wk, color: P.sig, headSize: 18 * (0.55 + 0.45 * wk), r: 22 });
    ctx.strokeStyle = P.sig;
    ctx.fillStyle = P.sig;
    ctx.lineWidth = 3 * wk;
    for (const Rt of G.ROUTES) {
      for (const g of Rt.gates) {
        ctx.strokeRect(g[0] - 9, g[1] - 9, 18, 18);
        ctx.fillRect(g[0] - 3, g[1] - 3, 6, 6);
      }
    }
    ctx.strokeStyle = P.sig;
    ctx.lineWidth = 2 * wk;
    for (const Tn of G.TOOLS) {
      ctx.beginPath();
      ui.rr(ctx, Tn.x - Tn.w / 2, Tn.y - Tn.h / 2, Tn.w, Tn.h, 20);
      ctx.stroke();
    }
    ctx.restore();
  }

  /** Signal dots on the routes — the same motion as ui.schema's pulse (pT = the pulse clock). */
  function pulses(ctx, L, pT, a, soft) {
    if (a <= 0.002) return;
    const G = L.GEO, ui = L.ui, P = L.pal;
    const beat = 0.5;
    const ph = (((pT % beat) + beat) % beat) / beat;
    const e = L.ease.inOutSine(ph);
    // soft 0..1: once the pulse is slowed, the dot fades in at the core and out at the tool instead of jumping back
    const env = L.lerp(1, Math.pow(Math.sin(Math.PI * ph), 0.6), soft || 0);
    ctx.save();
    ctx.globalAlpha *= a * env;
    for (const Rt of G.ROUTES) {
      const q = ui.along(ui.roundPts(Rt.pts, 22), e);
      ui.glow(ctx, q.x, q.y, 34, P.sigHot, 0.7);
      ctx.fillStyle = P.sigHot;
      ctx.beginPath();
      ctx.arc(q.x, q.y, 7, 0, L.TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  /** Closed outline of the card as points, starting at its top centre, clockwise. */
  function cardLoop(ui) {
    const { x, y, w, h, r } = CARD;
    const cx = x + w / 2;
    return ui.roundPts([[cx, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y], [cx, y]], r, 4);
  }

  /** A chip popped about its own centre. */
  function popChip(ctx, ui, str, x, y, sc, o) {
    if (sc <= 0) return 0;
    const w = ui.measure(ctx, str, o) + (o.padX != null ? o.padX : 18) * 2;
    ctx.save();
    ctx.translate(x + w / 2, y);
    ctx.scale(sc, sc);
    ctx.globalAlpha *= Math.min(1, sc * 2);
    ui.chip(ctx, str, -w / 2, 0, o);
    ctx.restore();
    return w;
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, ui = L.ui, P = L.pal, E = L.ease;
      const clamp = L.clamp, lerp = L.lerp;
      const t = clamp(tIn, 0, info.dur);
      const T = info.shot.start + t;
      const W = info.W, H = info.H;
      const G = L.GEO;

      // ---- 1. plate: schematic → interface (screen-fixed, drifts 6 px per beat) ----
      const plateK = E.inOutSine(clamp((t - B_PULL) / PULL_DUR));
      if (plateK < 1) ui.bg(ctx, { plate: 'schematic', oy: -T * 12 });
      if (plateK > 0) {
        ctx.save();
        ctx.globalAlpha *= plateK;
        ui.bg(ctx, { plate: 'interface', oy: -T * 12 });
        ctx.restore();
      }

      // ---- timing values ----
      const cam = camAt(L, t, W, H);
      const u = cam.u; // pull-back progress 0..1 (inOutCubic)
      const appA = ui.kf(t, B_PULL, APP_IN, 'outCubic');
      const rowsP = lerp(0.25, 1, ui.kf(t, B_PULL + 0.125, 0.75, 'outCubic'));
      // the full schema (ui.schema, fills and labels) gives way to the thin tracing
      const aFull = 1 - E.inOutSine(clamp((t - B_PULL) / 1.1));
      const tabA = 1 - E.inOutSine(clamp((t - B_PULL) / 0.45)); // ring tabs leave first, so no labels fight the app's type
      let strength = lerp(1, OV_MID, u);
      strength = lerp(strength, OV_END, E.inOutSine(clamp((t - B_THIN) / THIN_DUR)));
      const aLine = strength * (1 - aFull);
      const wk = lerp(1, 0.55, u); // line widths thin
      // pulse clock: on the beat until T 41.5, then a quarter rate (one traversal per bar)
      const tp = t <= B_THIN ? t : B_THIN + (t - B_THIN) / 4;
      const pT = info.shot.start + tp;
      const dotA = (1 - aFull) * lerp(1, 0.5, u) * lerp(1, 0.8, E.inOutSine(clamp((t - B_THIN) / THIN_DUR)));

      // lesson card
      const cK = ui.kf(t, B_CARD, 8 * FR, 'outCubic');

      // ---- 2. lesson card fill (behind the app) ----
      if (cK > 0) {
        ui.panel(ctx, CARD.x, CARD.y, CARD.w, CARD.h, { r: CARD.r, fill: P.panel, stroke: null, alpha: cK });
      }

      // ---- 3. world: app under the schema ----
      L.camera(ctx, cam, (c) => {
        if (appA > 0) {
          ui.app(c, G.APP.x, G.APP.y, G.APP.w, {
            search: 1, query: '', rows: rowsP, alpha: appA,
            caret: t >= B_CARD, t: T,
          });
        }
        if (aFull > 0.002) {
          ui.schema(c, {
            agent: 1, agentLabel: 'модель', core: 1, rings: [1, 1, 1, 1], tools: 1, toolsActive: [1, 1, 1],
            routes: 1, gates: 1, pulse: pT, alpha: aFull, labels: tabA,
          });
        }
        overlay(c, L, aLine, wk);
        pulses(c, L, pT, dotA, E.inOutSine(clamp((t - B_THIN) / THIN_DUR)));
      });

      // ---- 4. lesson card outline (draws on from the top centre both ways) + chips ----
      if (cK > 0) {
        const loop = cardLoop(ui);
        const settle = ui.k(t, B_CARD + 8 * FR, 0.5, 'inOutSine');
        const col = L.mix(P.sig, P.hairHi, settle);
        const half = 0.5 * cK;
        const glowA = cK < 1 ? 0.55 : 0;
        ui.arrow(ctx, loop, { p: half, head: false, r: 0, lw: 2, color: col, glow: glowA });
        ui.arrow(ctx, loop.slice().reverse(), { p: half, head: false, r: 0, lw: 2, color: col, glow: glowA });
      }
      const o1 = { size: 28, weight: 700, color: P.bg, fill: P.sig, stroke: null, padX: 20 };
      const o2 = { size: 24, weight: 500, font: 'mono', color: P.txt, fill: P.panelHi, stroke: P.hairHi, h: 48, padX: 18 };
      const w1 = ui.measure(ctx, CHIP1, o1) + o1.padX * 2;
      popChip(ctx, ui, CHIP1, 136, CARD.y, ui.pop(t, B_CARD), o1);
      popChip(ctx, ui, CHIP2, 136 + w1 + 12, CARD.y, ui.pop(t, B_CHIP2), o2);
      if (cK > 0 && cK < 1) ui.glow(ctx, 136 + w1 / 2, CARD.y, 120, P.sig, 0.35 * (1 - cK));

      // ---- 5. tag + headline (screen-fixed) ----
      ui.tag(ctx, TAG, t - B_HEAD);
      ui.headline(ctx, HEAD, t - B_HEAD);
    },
  });
})();

</script>
<script>
// ---- src/scenes/09-whats-inside.js
/*
 * 09 whats-inside : «Содержание и аудитория». T 45–52 (7 s), schematic. Hard cut in; shot 10 fades in over this
 * shot's held last pose from T 52.0 (core).
 *
 * The lesson's path as two sequential cards: «Готовый агент» (шаг 1) collapses into a done pill, then
 * «Свой агент на TypeScript» (шаг 2) holds three blocks — модель / инструменты / цикл — that snap onto one loop
 * with the exact shape of ring 2 from shot 05 (600 × 410, r 42, here centred on (540, 1060)). The source
 * folder chip «Запись + исходный код» slides in from the frame edge. An orange signal then circulates the
 * loop, one lap per bar, lighting each block as it passes.
 *
 * Layers, back to front:
 *   1. plate: schematic, drifting 6 px per beat (screen-fixed)
 *   2. stage under the final push-in camera (t 6.5–7.0, ×1 → ×1.03):
 *      a. card 2 (rises in at t 1.5): step label, title, loop guide, loop, blocks, signal, folder chip
 *      b. card 1 (pops at t 0) collapsing into the pill (t 1.5)
 *   3. tag + headline (t 0.25), screen-fixed
 */
(function () {
  'use strict';
  const ID = 'whats-inside';
  const FR = 1 / 24;

  // ---- beats (shot-local seconds; global T in comments) ----
  const B_CARD1 = 0.0; //  T 45.0   card 1 pops (6 frames)
  const B_HEAD = 0.25; //  T 45.25  tag + headline
  const B_SWAP = 1.5; //   T 46.5   card 1 → pill, card 2 rises in (8 frames)
  const B_FOLDER = 3.5; // T 48.5   folder chip slides in from the left edge (8 frames)
  const B_CIRC = 5.5; //   T 50.5   the loop closes at «модель»; the signal circulates, one lap per bar
  const LAP = 2.0; //      one bar
  const B_PUSH = 6.5; //   T 51.5   push-in ×1 → ×1.03 into the fade

  // Loop draw-on keys [t, fraction of the loop from «модель», clockwise]: the tip reaches each block's slot as
  // that block lands (49.25 / 49.75 / 50.25) and closes on the beat at 50.5.
  const LOOP_KEYS = [[4.0, 0], [4.75, 0.25], [5.25, 0.75], [5.5, 1]];

  // ---- geometry (storyboard 09, Forms) ----
  const CARD1 = { x: 100, y: 640, w: 880, h: 300, r: 28 };
  const PILL = { x: 100, y: 572, w: 880, h: 72, r: 36 };
  const CARD2 = { x: 100, y: 664, w: 880, h: 676, r: 28 };
  const LOOP_C = [540, 1060];
  const BLK = { w: 250, h: 88 };
  // The row reads цикл · модель · инструменты (x 270 / 540 / 810) so each block moves the short way onto its
  // slot and nothing crosses; the pops still run модель → инструменты → цикл, the loop's clockwise order.
  // frac = where the block sits on the loop, measured clockwise from the top centre.
  const BLOCKS = [
    { label: 'модель', mark: 'agent', row: [540, 1010], slot: [540, 855], pop: 2.0, move: 4.0, frac: 0 }, //       T 47.0 / 49.0
    { label: 'инструменты', icon: 'terminal', row: [810, 1010], slot: [840, 1060], pop: 2.5, move: 4.5, frac: 0.25 }, // T 47.5 / 49.5
    { label: 'цикл', icon: 'loop', row: [270, 1010], slot: [240, 1060], pop: 3.0, move: 5.0, frac: 0.75 }, //         T 48.0 / 50.0
  ];
  const BLK_PAD = 12, BLK_ICON = 30, BLK_GAP = 10;
  // The folder chip straddles card 2's bottom edge (y 1340): inside the card the loop's bottom edge (y 1265)
  // leaves no room for a 64 px chip.
  const FOLDER = { x: 124, y: 1340, x0: -420, h: 64, label: 'Запись + исходный код' };

  const TAG = '// для кого';
  const HEAD = ['Для JavaScript /', '[TypeScript]-разработчиков'];

  let LOOP_PTS = null;
  /** The loop: ring 2's shape (L.GEO.RINGS[1]) centred on LOOP_C, as points from its top centre, clockwise. */
  function loopPts(L) {
    if (LOOP_PTS) return LOOP_PTS;
    const R = L.GEO.RINGS[1];
    const x = LOOP_C[0] - R.w / 2, y = LOOP_C[1] - R.h / 2;
    const cx = LOOP_C[0];
    LOOP_PTS = L.ui.roundPts([[cx, y], [x + R.w, y], [x + R.w, y + R.h], [x, y + R.h], [x, y], [cx, y]], R.r, 4);
    return LOOP_PTS;
  }

  /** Piecewise-linear through [[t, v], ...] keys (held outside). */
  function keyed(keys, t) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) {
        const a = keys[i - 1], b = keys[i];
        return a[1] + ((b[1] - a[1]) * (t - a[0])) / (b[0] - a[0]);
      }
    }
    return keys[keys.length - 1][1];
  }

  /** One label size for all three blocks: 30 px, or what fits «инструменты» in 250 px (never under 26). */
  function blockSize(ctx, ui) {
    const room = BLK.w - 2 * BLK_PAD - BLK_ICON - BLK_GAP;
    let size = 30;
    for (const B of BLOCKS) {
      const w = ui.measure(ctx, B.label, { size: 30, weight: 600, tracking: -0.3 });
      if (w > room) size = Math.min(size, Math.floor((30 * room) / w));
    }
    return Math.max(26, size);
  }

  /** A schematic block (ui.node's look: panel, orange border + glow when active), icon/mark + label centred. */
  function block(ctx, L, B, cx, cy, sc, act, size) {
    if (sc <= 0) return;
    const ui = L.ui, P = L.pal;
    const w = BLK.w, h = BLK.h;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(sc, sc);
    ctx.globalAlpha *= L.clamp(sc * 1.6);
    ui.panel(ctx, -w / 2, -h / 2, w, h, {
      r: 20, fill: P.panel, lw: 2,
      stroke: act > 0 ? L.mix(P.hairHi, P.sig, act) : P.hairHi,
      glow: act > 0.01 ? L.rgba(P.sig, 0.55 * act) : null,
    });
    const iconW = BLK_ICON, gap = BLK_GAP;
    const tw = ui.measure(ctx, B.label, { size, weight: 600, tracking: -0.3 });
    const x0 = -(iconW + gap + tw) / 2;
    const ic = act > 0.5 ? P.sig : P.txt;
    if (B.mark === 'agent') ui.agent(ctx, x0 + iconW / 2, 4, 30, { glow: 0.6 + 0.4 * act });
    else ui.icon(ctx, B.icon, x0 + iconW / 2, 0, 32, { color: ic, lw: 3 });
    ui.label(ctx, B.label, x0 + iconW + gap, 1, { size, weight: 600, color: P.txt, baseline: 'middle', tracking: -0.3 });
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, ui = L.ui, P = L.pal, E = L.ease;
      const clamp = L.clamp, lerp = L.lerp;
      const t = clamp(tIn, 0, info.dur);
      const T = info.shot.start + t;
      const W = info.W, H = info.H;

      // ---- 1. plate ----
      ui.bg(ctx, { plate: 'schematic', oy: -T * 12 });

      // ---- 2. stage (final push-in) ----
      const push = E.inOutSine(clamp((t - B_PUSH) / (info.dur - B_PUSH)));
      const zoom = lerp(1, 1.03, push);
      L.camera(ctx, { x: W / 2, y: H / 2, zoom }, (c) => {
        // ---- 2a. card 2 ----
        const k2 = ui.kf(t, B_SWAP, 8 * FR, 'outCubic');
        if (k2 > 0) {
          c.save();
          c.translate(0, (1 - k2) * 60);
          c.globalAlpha *= k2;
          ui.panel(c, CARD2.x, CARD2.y, CARD2.w, CARD2.h, { r: CARD2.r, fill: P.panel, stroke: P.hairHi });
          ui.label(c, 'шаг 2', 144, 712, { font: 'mono', size: 24, weight: 500, color: P.sig, tracking: 1 });
          ui.rich(c, 'Свой агент на [TypeScript]', 144, 772, { size: 44, weight: 700, tracking: -0.5 });
          c.restore();
        }

        const pts = loopPts(L);
        // loop guide: ring 2's outline, dashed and faint, marks where the blocks will lock in
        const guideK = ui.kf(t, 2.0, 0.5, 'outCubic') * (1 - ui.k(t, 5.5, 0.5, 'inOutSine'));
        if (guideK > 0) ui.arrow(c, pts, { p: guideK, head: false, r: 0, lw: 2, color: P.hairHi, dash: [10, 12] });

        // the loop itself, drawn on through the slots
        // loop, signal and flashes run one frame ahead (like ui.kf) so each key is visible ON its beat frame
        const tl = t + FR;
        const lp = keyed(LOOP_KEYS, tl);
        if (lp > 0) {
          ui.arrow(c, pts, { p: lp, head: false, r: 0, lw: 3, color: P.sig });
          ui.arrow(c, pts, { p: lp, head: false, r: 0, lw: 9, color: P.sig, alpha: 0.12 });
        }
        // direction chevrons on the two free stretches (bottom and top-right / top-left halves), after closing
        const chevK = ui.kf(t, B_CIRC, 6 * FR, 'outCubic');
        if (chevK > 0) {
          for (const f of [0.125, 0.5, 0.875]) {
            const q = ui.along(pts, f);
            c.save();
            c.translate(q.x, q.y);
            c.rotate(q.a);
            c.globalAlpha *= chevK;
            c.fillStyle = P.bgDeep;
            c.fillRect(-14, -14, 28, 28);
            ui.icon(c, 'chevronRight', 0, 0, 30, { color: P.sig, lw: 3.5 });
            c.restore();
          }
        }

        // the signal: the draw-on tip, then one lap per bar
        let sigF = -1;
        if (lp > 0 && lp < 1) sigF = lp;
        else if (tl >= B_CIRC) sigF = ((tl - B_CIRC) / LAP) % 1;
        if (sigF >= 0) {
          const q = ui.along(pts, sigF);
          const trail = 0.06;
          if (tl >= B_CIRC) {
            const a0 = sigF - trail;
            if (a0 >= 0) ui.arrow(c, pts, { from: a0, p: sigF, head: false, r: 0, lw: 5, color: P.sigHot, alpha: 0.55 });
            else {
              ui.arrow(c, pts, { from: 0, p: sigF, head: false, r: 0, lw: 5, color: P.sigHot, alpha: 0.55 });
              ui.arrow(c, pts, { from: 1 + a0, p: 1, head: false, r: 0, lw: 5, color: P.sigHot, alpha: 0.55 });
            }
          }
          ui.glow(c, q.x, q.y, 46, P.sigHot, 0.75);
          c.fillStyle = P.sigHot;
          c.beginPath();
          c.arc(q.x, q.y, 8, 0, L.TAU);
          c.fill();
        }

        // blocks: pop in a row, then snap onto the loop
        const bSize = blockSize(c, ui);
        for (const B of BLOCKS) {
          const sc = ui.pop(t, B.pop);
          if (sc <= 0) continue;
          const m = ui.kf(t, B.move, 6 * FR);
          const mb = E.outBack(m);
          const x = lerp(B.row[0], B.slot[0], mb);
          const y = lerp(B.row[1], B.slot[1], mb);
          // orange flash: on landing, and each time the signal passes the block
          const land = B.move + 5 * FR; // kf lands one frame early
          let act = t >= land ? Math.exp(-(t - land) / 0.3) : 0;
          if (tl >= B_CIRC) {
            const since = (((tl - B_CIRC - B.frac * LAP) % LAP) + LAP) % LAP;
            if (tl - B_CIRC >= B.frac * LAP - 1e-6) act = Math.max(act, Math.exp(-since / 0.3));
            const until = LAP - since; // pre-light as the signal approaches
            if (until < 0.12) act = Math.max(act, 1 - until / 0.12);
          }
          block(c, L, B, x, y, sc, clamp(act), bSize);
        }

        // folder chip: slides in from the frame's left edge
        const fk = ui.kf(t, B_FOLDER, 8 * FR, 'outCubic');
        if (fk > 0) {
          const fx = lerp(FOLDER.x0, FOLDER.x, fk);
          const size = 28, iconS = 40, padL = 20, padR = 26, gap = 14;
          const tw = ui.measure(c, FOLDER.label, { size, weight: 600 });
          const fw = padL + iconS + gap + tw + padR;
          const fy = FOLDER.y;
          c.save();
          c.beginPath();
          ui.rr(c, fx, fy - FOLDER.h / 2, fw, FOLDER.h, FOLDER.h / 2);
          c.fillStyle = P.panelHi;
          c.fill();
          c.strokeStyle = P.sig;
          c.lineWidth = 2;
          c.stroke();
          ui.icon(c, 'folder', fx + padL + iconS / 2, fy, iconS, { color: P.sig, lw: 3, fill: P.sigTint });
          ui.label(c, FOLDER.label, fx + padL + iconS + gap, fy + 1, { size, weight: 600, color: P.txt, baseline: 'middle' });
          c.restore();
          if (fk < 1) ui.glow(c, fx + fw, fy, 70, P.sig, 0.4 * (1 - fk));
        }

        // ---- 2b. card 1 → pill ----
        const pop1 = ui.kf(t, B_CARD1, 6 * FR);
        const mk = ui.kf(t, B_SWAP, 8 * FR, 'outCubic');
        const rx = lerp(CARD1.x, PILL.x, mk), ry = lerp(CARD1.y, PILL.y, mk);
        const rw = lerp(CARD1.w, PILL.w, mk), rh = lerp(CARD1.h, PILL.h, mk);
        const rr = lerp(CARD1.r, PILL.r, mk);
        const sc1 = 0.92 + 0.08 * E.outBack(pop1);
        c.save();
        c.translate(rx + rw / 2, ry + rh / 2);
        c.scale(sc1, sc1);
        c.translate(-(rx + rw / 2), -(ry + rh / 2));
        c.globalAlpha *= clamp(0.45 + pop1 * 1.8);
        ui.panel(c, rx, ry, rw, rh, { r: rr, fill: P.panel, stroke: P.hairHi });
        c.save();
        c.beginPath();
        ui.rr(c, rx, ry, rw, rh, rr);
        c.clip();
        // big content rides with the card's top edge and fades as it collapses
        const bigA = 1 - clamp(mk * 2.2);
        if (bigA > 0) {
          c.save();
          c.translate(0, ry - CARD1.y);
          c.globalAlpha *= bigA;
          ui.label(c, 'шаг 1', 144, 700, { font: 'mono', size: 24, weight: 500, color: P.sig, tracking: 1 });
          const blink = t > 1.0 && t < 1.0 + 3 * FR ? 1 : 0;
          ui.agent(c, 200, 810, 90, { glow: 1, blink });
          ui.label(c, 'Готовый агент', 280, 828, { size: 48, weight: 700, color: P.txt, tracking: -0.5 });
          c.restore();
        }
        const pillA = clamp((mk - 0.45) / 0.55);
        if (pillA > 0) {
          const cy = PILL.y + PILL.h / 2;
          c.save();
          c.globalAlpha *= pillA;
          ui.icon(c, 'check', 150, cy, 30, { color: P.sig, lw: 4 });
          ui.label(c, 'Готовый агент', 184, cy + 1, { size: 30, weight: 600, color: P.txt, baseline: 'middle' });
          ui.label(c, 'шаг 1', PILL.x + PILL.w - 40, cy + 1, { font: 'mono', size: 22, weight: 500, color: P.txtDim, baseline: 'middle', align: 'right', tracking: 1 });
          c.restore();
        }
        c.restore();
        c.restore();
      });

      // ---- 3. tag + headline (screen-fixed) ----
      ui.tag(ctx, TAG, t - B_HEAD);
      ui.headline(ctx, HEAD, t - B_HEAD);
    },
  });
})();

</script>
<script>
// ---- src/scenes/10-cta.js
/*
 * 10 cta: Переход на форму. T 52.0–60.0 (shot-local t 0–8), interface plate.
 * Enters with a 0.5 s fade from 09 (core); grain 0.6 (timeline). No captions in this shot.
 *
 * One clear action: the free lesson + source code. The link is Instagram's native sticker, placed by the
 * author inside L.GEO.STICKER; this shot only points at it. Nothing is drawn inside the zone and nothing
 * here looks tappable (no drawn button): type, one arrow, four corner ticks.
 *
 * Layers, back to front:
 *   1. plate          ui.bg interface, fixed offset (no drift: the CTA holds perfectly still)
 *   2. app ghost      ui.app at GEO.APP with the search bar (no query), blurred 4 px, alpha ~0.1, masked to a
 *                     soft band so it fades out well above the sticker zone; a cached sprite (pure of FILM.S)
 *   3. tag            // бесплатный урок, centred
 *   4. headline       От AI-кодинга / к [AI Engineering], 92 px, centred
 *   5. subline        Бесплатный урок + исходный код
 *   6. action line    Забрать бесплатный урок
 *   7. arrow          orange, down into the zone; its glow stays above the zone edge
 *   8. corner ticks   ui.corners just outside the zone, converging onto it (focus lock)
 *
 * Beats (global T): 52.25 tag + headline · 52.75 subline · 53.25 action line · 53.50 arrow draws on ·
 * 53.625 ticks lock in · settled 53.92 · static 54.00–60.00 (t is frozen at SETTLE below).
 */
(function () {
  'use strict';

  const ID = 'cta';
  const FR = 1 / 24;

  // ---- beats (shot-local seconds) ----------------------------------------------
  const B_HEAD = 0.25; // T 52.25 tag types in, headline rises in
  const B_SUB = 0.75; // T 52.75 subline fades up
  const B_ACT = 1.25; // T 53.25 action line rises in
  const B_ARROW = 1.5; // T 53.50 arrow draws on (9 frames) — sfx blip
  const B_TICKS = 1.625; // T 53.625 corner ticks lock onto the zone (8 frames)
  const SETTLE = 2.0; // T 54.00 every value above has saturated; the frame is frozen from here to 60.0

  // ---- layout (1080-frame px; baselines) ------------------------------------------
  const CX = 540;
  const Y_TAG = 330;
  const Y_HEAD = 470; // first baseline; the second sits at 470 + 92 * 1.1 = 571.2
  const HEAD_SIZE = 92;
  const Y_SUB = 680;
  const Y_ACT = 1054;
  const ARROW_Y0 = 1094;
  const ARROW_Y1 = 1172; // head tip lands at 1172 + 0.35 * 22 = 1179.7, ~10 px above the zone
  const ARROW_LW = 5;
  const ARROW_HEAD = 22;
  const TICK_LEN = 30;
  const TICK_LW = 3;
  const PLATE_OY = -52 * 12; // the drift value at this shot's first frame, held constant

  const TAG = '// бесплатный урок';
  const HEAD = ['От AI-кодинга', 'к [AI Engineering]'];
  const SUB = 'Бесплатный урок + исходный код';
  const ACT = 'Забрать бесплатный урок';

  // ---- the app ghost: sharp render → blur → vertical band mask, cached per render scale ----
  const APP_ALPHA = 0.1;
  const GHOST_M = 64; // margin around the window for the blur and the panel shadow
  // band mask stops [y, alpha] (logical px): opens below the subline (the title bar and header would muddy it),
  // full over the search field and the first ticket row, gone before the action line and far above the zone
  const GHOST_MASK = [
    [690, 0],
    [735, 0.45],
    [790, 1],
    [945, 1],
    [1000, 0.45],
    [1045, 0.1],
    [1090, 0],
  ];

  function ghostSprite(L, S) {
    const G = L.GEO.APP;
    const ui = L.ui;
    const h = (G.w * ui.APP_H) / ui.APP_W;
    const x0 = G.x - GHOST_M;
    const y0 = G.y - GHOST_M;
    const w = G.w + GHOST_M * 2;
    const hh = h + GHOST_M * 2;
    const sprite = L.cached(`cta-app-ghost@${S}`, () => {
      const cw = Math.max(2, Math.ceil(w * S));
      const ch = Math.max(2, Math.ceil(hh * S));
      // 1. the app, sharp
      const a = FILM.makeCanvas(cw, ch);
      const ga = a.getContext('2d');
      ga.scale(S, S);
      ga.translate(-x0, -y0);
      ui.app(ga, G.x, G.y, G.w, { search: 1, caret: false });
      // 2. blurred copy (the blur radius scales with the render so previews match the full frame)
      const b = FILM.makeCanvas(cw, ch);
      const gb = b.getContext('2d');
      if ('filter' in gb) {
        gb.filter = `blur(${4 * S}px)`;
        gb.drawImage(a, 0, 0);
        gb.filter = 'none';
      } else {
        // no canvas filter (older Safari): a down-and-up resample reads as the same soft blur
        const q = FILM.makeCanvas(Math.max(2, Math.ceil(cw / 4)), Math.max(2, Math.ceil(ch / 4)));
        const gq = q.getContext('2d');
        gq.imageSmoothingQuality = 'high';
        gq.drawImage(a, 0, 0, q.width, q.height);
        gb.imageSmoothingQuality = 'high';
        gb.drawImage(q, 0, 0, cw, ch);
      }
      // 3. keep only a soft vertical band
      gb.save();
      gb.scale(S, S);
      gb.translate(-x0, -y0);
      gb.globalCompositeOperation = 'destination-in';
      const gr = gb.createLinearGradient(0, y0, 0, y0 + hh);
      for (const [y, al] of GHOST_MASK) gr.addColorStop(L.clamp((y - y0) / hh), L.rgba(L.pal.txt, al));
      gb.fillStyle = gr;
      gb.fillRect(x0, y0, w, hh);
      gb.restore();
      return b;
    });
    return { sprite, x0, y0, w, hh };
  }

  // ---- draw ------------------------------------------------------------------------
  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib;
      const P = L.pal;
      const ui = L.ui;
      const Z = L.GEO.STICKER;
      // clamp first; then freeze at SETTLE so nothing can move from T 54.0 on
      const t = Math.min(L.clamp(tIn, 0, info.dur), SETTLE);

      // 1. plate: fixed offset, no drift
      ui.bg(ctx, { plate: 'interface', oy: PLATE_OY });

      // 2. app ghost (static from frame 0; core's fade brings it in)
      const g = ghostSprite(L, FILM.S || 1);
      ctx.save();
      ctx.globalAlpha *= APP_ALPHA;
      ctx.drawImage(g.sprite, g.x0, g.y0, g.w, g.hh);
      ctx.restore();

      // 3. tag, centred as one unit (14 px square + 14 px gap + mono text)
      const tagW = 28 + ui.measure(ctx, TAG, { font: 'mono', size: 26, weight: 500, tracking: 1 });
      ui.tag(ctx, TAG, t - B_HEAD, { x: Math.round(CX - tagW / 2), y: Y_TAG });

      // 4. headline
      ui.headline(ctx, HEAD, t - B_HEAD, { align: 'center', x: CX, y: Y_HEAD, size: HEAD_SIZE });

      // 5. subline: fades up
      const kSub = ui.kf(t, B_SUB, 8 * FR, 'outExpo');
      if (kSub > 0) {
        ui.label(ctx, SUB, CX, Y_SUB + (1 - kSub) * 18, { size: 42, weight: 500, color: P.txtDim, align: 'center', alpha: kSub });
      }

      // 6. action line: rises in
      const kAct = ui.kf(t, B_ACT, 8 * FR, 'outExpo');
      if (kAct > 0) {
        ui.label(ctx, ACT, CX, Y_ACT + (1 - kAct) * 26, { size: 50, weight: 700, color: P.txt, align: 'center', tracking: -0.5, alpha: kAct });
      }

      // 7. arrow into the zone; the glow sits on the head and ends above the zone's top edge
      const kArrow = ui.kf(t, B_ARROW, 9 * FR, 'outCubic');
      if (kArrow > 0) {
        const tip = ui.arrow(ctx, [[CX, ARROW_Y0], [CX, ARROW_Y1]], { lw: ARROW_LW, headSize: ARROW_HEAD, p: kArrow, color: P.sig });
        if (tip) {
          const gy = tip.y - 12;
          const gr = Math.min(44, Z.y - 2 - gy);
          ui.glow(ctx, tip.x, gy, gr, P.sig, 0.5 * kArrow);
        }
      }

      // 8. corner ticks: just outside the zone (stroke's inner edge on the zone edge), converging 18 px → 0
      const kTicks = ui.kf(t, B_TICKS, 8 * FR, 'outCubic');
      if (kTicks > 0) {
        const off = TICK_LW / 2 + (1 - kTicks) * 18;
        const len = TICK_LEN * (0.35 + 0.65 * kTicks);
        ui.corners(ctx, Z.x - off, Z.y - off, Z.w + off * 2, Z.h + off * 2, { color: P.sig, alpha: 0.85 * kTicks, len, lw: TICK_LW });
      }
    },
  });
})();

<script>
// ---- src/music.js
// music.js : the score and sound design of the film.
// Owner: music. Contract: docs/CONTRACT.md, section Audio.
//
// FILM.audio.render(ctx, { start = 0, dest = ctx.destination }) schedules the whole piece,
// music and effects, from global time `start` into any BaseAudioContext.
// Every sound is synthesised here: oscillators, periodic waves, seeded noise, filters, envelopes,
// a ping-pong delay, convolver reverbs on generated impulse responses, a glue compressor and a
// soft limiter. Randomness comes only from FILM.lib.rng, seeded per event, so any start time
// schedules the same notes at the same global times.
//
// The engine, instruments, effects and master chain below are film-agnostic. Per film the music
// agent replaces three things: the CH chord table, the MIX.ride section automation, and the whole
// score() function — composing against FILM.TIMELINE.bpm and FILM.TIMELINE.cues so hits land on
// the cuts. What ships here is a demo score that gives the stub pass a pulse; see the skill's
// reference/music.md before composing.
(function () {
  'use strict';
  const FILM = window.FILM;
  const lib = FILM.lib;
  const TAU = Math.PI * 2;
  const FLOOR = 1e-5;

  // DynamicsCompressorNode delays its output by a fixed 6 ms look-ahead (measured: 288 samples at
  // 48 kHz). Every event before the compressor is scheduled that much early, so it leaves the master
  // exactly on its cue. Only an event inside the first 6 ms of a render window can land late.
  const LAT = 0.006;

  // Mix constants, tuned by measurement (tools/audio): loudness, peaks, per-bar profile.
  const MIX = {
    trim: 1.05,
    ceiling: 0.66, // soft limiter output ceiling (about -3.6 dBFS)
    knee: 0.5,
    bus: { drums: 0.6, perc: 0.8, bass: 0.3, pad: 0.26, keys: 0.6, bells: 0.45, lead: 0.5, sfx: 0.62, amb: 0.5 },
    // Master tilt EQ in dB: a low shelf under the subs, presence and air for phone speakers.
    eq: { low: -4, presence: 5, air: 3 },
    comp: { threshold: -18, knee: 10, ratio: 2, attack: 0.006, release: 0.2 },
    // Section fader rides in dB at global times, pre-compressor. The whole piece is a bed under a
    // voice-over, so it sits well below a solo mix; the rides only shape the acts and fade the final
    // chord to silence by 59.8 (the seam then meets the opening air swell from silence).
    ride: [[0, -7], [6.45, -7], [6.5, -6], [37.0, -6], [37.5, -5], [44.5, -5], [46.0, -6], [56.5, -6], [58.0, -12], [59.2, -26], [59.8, -70]],
  };

  // ---------------------------------------------------------------- pitch
  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
    const midi = 12 * (Number(m[3]) + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  // ---------------------------------------------------------------- envelopes
  // pts: [[dt, value, shape]] with dt from the note start; shape is the ramp INTO that point:
  // 'lin' (default), 'exp' or 'set'. The first point must sit at dt 0.
  // When the voice started before the render window (skip > 0) the value at `skip` is computed
  // and automation resumes from there, so a seek hears the same envelope.
  function setEnv(param, pts, c0, skip) {
    let i;
    let prev;
    if (skip > 0) {
      let v = pts[0][1];
      for (i = 1; i < pts.length; i++) {
        const a = pts[i - 1];
        const b = pts[i];
        if (skip < b[0]) {
          const f = (skip - a[0]) / Math.max(1e-9, b[0] - a[0]);
          const sh = b[2] || 'lin';
          if (sh === 'set') v = a[1];
          else if (sh === 'exp' && a[1] > 0) v = a[1] * Math.pow(Math.max(b[1], FLOOR) / a[1], f);
          else v = a[1] + (b[1] - a[1]) * f;
          break;
        }
        v = b[1];
      }
      param.setValueAtTime(v, c0 + skip);
      prev = v;
    } else {
      param.setValueAtTime(pts[0][1], c0);
      prev = pts[0][1];
      i = 1;
    }
    for (; i < pts.length; i++) {
      const v = pts[i][1];
      const sh = pts[i][2] || 'lin';
      const w = c0 + pts[i][0];
      if (sh === 'set') {
        param.setValueAtTime(v, w);
        prev = v;
      } else if (sh === 'exp' && prev > 0) {
        param.exponentialRampToValueAtTime(Math.max(v, FLOOR), w);
        prev = Math.max(v, FLOOR);
      } else {
        param.linearRampToValueAtTime(v, w);
        prev = v;
      }
    }
  }

  // Percussive amplitude envelope: attack then exponential decay to silence.
  const perc = (vel, att, dec) => [[0, 0], [att, vel], [att + dec, FLOOR, 'exp']];

  // ---------------------------------------------------------------- generated buffers
  function noiseBuffer(ctx, secs, channels, seed) {
    const n = Math.floor(secs * ctx.sampleRate);
    const buf = ctx.createBuffer(channels, n, ctx.sampleRate);
    for (let ch = 0; ch < channels; ch++) {
      const r = lib.rng(lib.hash('film-noise', seed, ch));
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = r() * 2 - 1;
    }
    return buf;
  }

  // Impulse response: seeded stereo noise, exponential decay to -60 dB at `secs`, a two-pole
  // lowpass that darkens over the tail, a pre-delay and a few early reflections.
  function impulse(ctx, secs, seed, o) {
    const sr = ctx.sampleRate;
    const n = Math.floor(secs * sr);
    const buf = ctx.createBuffer(2, n, sr);
    const pre = Math.floor(o.pre * sr);
    const tail = secs - o.pre;
    for (let ch = 0; ch < 2; ch++) {
      const r = lib.rng(lib.hash('film-ir', seed, ch));
      const d = buf.getChannelData(ch);
      let l1 = 0;
      let l2 = 0;
      for (let i = pre; i < n; i++) {
        const t = (i - pre) / sr;
        const u = t / tail;
        const env = Math.exp(-6.9 * u) * (t < 0.005 ? t / 0.005 : 1);
        const a = o.bright + (o.dark - o.bright) * Math.sqrt(u);
        l1 += a * (r() * 2 - 1 - l1);
        l2 += a * (l1 - l2);
        d[i] = l2 * env;
      }
      for (let k = 0; k < o.early; k++) {
        const i = pre + Math.floor((0.003 + r() * o.spread) * sr);
        if (i < n) d[i] += (r() * 2 - 1) * 0.35 * (1 - k / o.early);
      }
    }
    return buf;
  }

  // Grains rendered straight into a stereo buffer: band-passed noise flaps and clicks, or short sines.
  // g: { t, dur, amp, pan (-1..1), f, q, att, dec, sine }
  function grainBuffer(ctx, key, secs, grains) {
    const sr = ctx.sampleRate;
    const n = Math.max(1, Math.ceil(secs * sr));
    const buf = ctx.createBuffer(2, n, sr);
    const L = buf.getChannelData(0);
    const R = buf.getChannelData(1);
    const r = lib.rng(lib.hash('film-grain', key));
    for (const g of grains) {
      const i0 = Math.floor(g.t * sr);
      const m = Math.floor(g.dur * sr);
      const gl = Math.cos(((g.pan + 1) * Math.PI) / 4);
      const gr = Math.sin(((g.pan + 1) * Math.PI) / 4);
      const att = g.att || 0.002;
      const dec = g.dec || g.dur * 0.3;
      const w = (TAU * g.f) / sr;
      const al = Math.sin(w) / (2 * (g.q || 1));
      const cw = Math.cos(w);
      const a0 = 1 + al;
      let x1 = 0;
      let x2 = 0;
      let y1 = 0;
      let y2 = 0;
      const ph = r() * TAU;
      for (let k = 0; k < m; k++) {
        const j = i0 + k;
        if (j >= n) break;
        const tt = k / sr;
        let s;
        if (g.sine) s = Math.sin(ph + w * k);
        else {
          const x = r() * 2 - 1;
          s = (al * x - al * x2 + 2 * cw * y1 - (1 - al) * y2) / a0;
          x2 = x1;
          x1 = x;
          y2 = y1;
          y1 = s;
        }
        const env = tt < att ? tt / att : Math.exp(-(tt - att) / dec);
        const tailFade = k > m - 64 ? (m - k) / 64 : 1;
        const v = s * env * tailFade * g.amp;
        if (j >= 0) {
          L[j] += v * gl;
          R[j] += v * gr;
        }
      }
    }
    return buf;
  }

  // Stick-slip creak: irregular pulses, each ringing three damped wooden resonances.
  function creakBuffer(ctx, key, secs, rate0, rate1, formants) {
    const sr = ctx.sampleRate;
    const n = Math.ceil(secs * sr);
    const buf = ctx.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    const r = lib.rng(lib.hash('film-creak', key));
    let t = 0.004;
    while (t < secs - 0.01) {
      const u = t / secs;
      const swell = Math.sin(Math.PI * Math.min(1, u * 1.15)) * (0.55 + 0.45 * r());
      const i0 = Math.floor(t * sr);
      for (const [f, tau, a] of formants) {
        const m = Math.min(n - i0, Math.floor(tau * 5 * sr));
        const fj = f * (0.94 + 0.12 * r());
        for (let k = 0; k < m; k++) d[i0 + k] += swell * a * Math.exp(-k / sr / tau) * Math.sin((TAU * fj * k) / sr);
      }
      const rate = rate0 + (rate1 - rate0) * u;
      t += (1 / rate) * (0.7 + 0.6 * r());
    }
    for (let k = 0; k < 96 && k < n; k++) d[n - 1 - k] *= k / 96;
    return buf;
  }

  // Soft limiter transfer curve. The shaper is fed at half level, so the curve covers inputs up to
  // +6 dBFS: linear to the knee, then a tanh shoulder that never passes the ceiling.
  function limiterCurve(ceiling, knee) {
    const n = 16385;
    const c = new Float32Array(n);
    const room = ceiling - knee;
    for (let i = 0; i < n; i++) {
      const x = ((i / (n - 1)) * 2 - 1) * 2;
      const a = Math.abs(x);
      const y = a <= knee ? a : knee + room * Math.tanh((a - knee) / room);
      c[i] = x < 0 ? -y : y;
    }
    return c;
  }

  function periodic(ctx, n, amp) {
    const real = new Float32Array(n + 1);
    const imag = new Float32Array(n + 1);
    for (let k = 1; k <= n; k++) imag[k] = amp(k);
    return ctx.createPeriodicWave(real, imag);
  }

  // ---------------------------------------------------------------- engine
  function makeEngine(ctx, start, dest, DUR, MIX) {
    const base = ctx.currentTime;
    const E = { ctx, sr: ctx.sampleRate, start, base, DUR, duckTargets: [] };

    // A voice is a note or effect that starts at global time t0 and lasts len seconds (release included).
    // A sustained voice whose compensated start falls before the window resumes mid-envelope on time.
    // A short voice that starts inside the first 6 ms plays whole, up to 6 ms late; one that began
    // earlier is skipped.
    E.w0 = -Infinity;
    E.w1 = Infinity;
    E.voice = function (t0, len, sustain) {
      if (t0 < E.w0 || t0 >= E.w1) return null; // belongs to another scheduling window
      if (t0 >= DUR || t0 + len <= start) return null;
      const c = base + (t0 - start) - LAT;
      let c0 = c;
      let skip = 0;
      if (c < base) {
        if (sustain) skip = base - c;
        else if (t0 >= start) c0 = base;
        else return null;
      }
      return {
        c0,
        skip,
        len,
        env: (param, pts) => setEnv(param, pts, c0, skip),
        osc(node, stopDt) {
          node.start(c0 + skip);
          node.stop(c0 + Math.max(stopDt === undefined ? len : stopDt, skip + 0.002));
          return node;
        },
        buf(node, offset, stopDt) {
          const d = node.buffer.duration;
          let off = (offset || 0) + skip;
          if (node.loop) off %= d;
          else if (off >= d) return node;
          node.start(c0 + skip, off);
          node.stop(c0 + Math.max(stopDt === undefined ? len : stopDt, skip + 0.002));
          return node;
        },
      };
    };

    E.gain = (v) => {
      const g = ctx.createGain();
      g.gain.value = v === undefined ? 1 : v;
      return g;
    };
    E.osc = (type, f) => {
      const o = ctx.createOscillator();
      if (typeof type === 'string') o.type = type;
      else o.setPeriodicWave(type);
      o.frequency.value = f;
      return o;
    };
    E.filt = (type, f, q) => {
      const b = ctx.createBiquadFilter();
      b.type = type;
      b.frequency.value = f;
      b.Q.value = q === undefined ? 0.707 : q;
      return b;
    };
    E.panner = (p) => {
      const s = ctx.createStereoPanner();
      s.pan.value = p;
      return s;
    };
    E.rng = (...k) => lib.rng(lib.hash('film-score', ...k));

    // ---- master: highpass, glue compressor, trim, soft limiter, output fades
    const master = E.gain(1);
    const hp = E.filt('highpass', 26, 0.6);
    const lowShelf = E.filt('lowshelf', 140, 0.7);
    lowShelf.gain.value = MIX.eq.low;
    const presence = E.filt('peaking', 3000, 0.7);
    presence.gain.value = MIX.eq.presence;
    const air = E.filt('highshelf', 8000, 0.7);
    air.gain.value = MIX.eq.air;
    const comp = ctx.createDynamicsCompressor();
    for (const k in MIX.comp) comp[k].value = MIX.comp[k];
    const trim = E.gain(MIX.trim * 0.5);
    const lim = ctx.createWaveShaper();
    lim.curve = limiterCurve(MIX.ceiling, MIX.knee);
    lim.oversample = 'none';
    const out = E.gain(1);
    master.connect(hp);
    hp.connect(lowShelf);
    lowShelf.connect(presence);
    presence.connect(air);
    air.connect(comp);
    comp.connect(trim);
    trim.connect(lim);
    lim.connect(out);
    out.connect(dest);
    E.master = master;
    // Output fades sit after the compressor, so they use uncompensated times. The compressor's
    // first 6 ms are silent; the output then opens over 3 ms, and the last 10 ms taper to zero, so the
    // loop seam and every seek start without a click.
    out.gain.setValueAtTime(0, base);
    out.gain.setValueAtTime(0, base + LAT);
    out.gain.linearRampToValueAtTime(1, base + LAT + 0.003);
    const cEnd = base + (DUR - start);
    if (DUR - start > 0.05) {
      out.gain.setValueAtTime(1, cEnd - 0.01);
      out.gain.linearRampToValueAtTime(0, cEnd);
    }
    // Section rides on the master input, compensated like every other pre-compressor event.
    setEnv(master.gain, MIX.ride.map(([t, d], i) => [t, Math.pow(10, d / 20), i ? 'lin' : undefined]), base - start - LAT, start + LAT);

    // ---- shared buffers
    E.white = noiseBuffer(ctx, 2.5, 1, 'white');
    E.wide = noiseBuffer(ctx, 5, 2, 'wide');
    E.warmSaw = periodic(ctx, 48, (k) => Math.pow(k, -1.35) * (k > 24 ? Math.exp(-(k - 24) / 10) : 1));
    E.softSquare = periodic(ctx, 31, (k) => (k % 2 ? Math.pow(k, -1.5) : 0.04 / k));
    E.brassSaw = periodic(ctx, 40, (k) => Math.pow(k, -1.05));

    // ---- effects returns
    E.fx = {};
    const verb = (name, secs, o, ret) => {
      const c = ctx.createConvolver();
      c.buffer = impulse(ctx, secs, name, o);
      const g = E.gain(ret);
      c.connect(g);
      g.connect(master);
      E.fx[name] = c;
    };
    verb('room', 0.9, { pre: 0.006, bright: 0.55, dark: 0.18, early: 10, spread: 0.035 }, 0.9);
    verb('hall', 2.8, { pre: 0.018, bright: 0.45, dark: 0.09, early: 14, spread: 0.07 }, 0.9);
    verb('cave', 6.0, { pre: 0.03, bright: 0.35, dark: 0.05, early: 18, spread: 0.12 }, 0.85);

    // Ping-pong delay, a dotted 8th (0.375 s) each side.
    const dIn = E.gain(1);
    dIn.channelCount = 1;
    dIn.channelCountMode = 'explicit';
    const dL = ctx.createDelay(1);
    const dR = ctx.createDelay(1);
    dL.delayTime.value = 0.375;
    dR.delayTime.value = 0.375;
    const fL = E.filt('lowpass', 4200, 0.5);
    const fR = E.filt('lowpass', 3400, 0.5);
    const gL = E.gain(0.4);
    const gR = E.gain(0.4);
    dIn.connect(dL);
    dL.connect(fL);
    fL.connect(gL);
    gL.connect(dR);
    dR.connect(fR);
    fR.connect(gR);
    gR.connect(dL);
    const mrg = ctx.createChannelMerger(2);
    fL.connect(mrg, 0, 0);
    fR.connect(mrg, 0, 1);
    const dRet = E.gain(0.75);
    mrg.connect(dRet);
    dRet.connect(master);
    const dVerb = E.gain(0.25);
    dRet.connect(dVerb);
    dVerb.connect(E.fx.hall);
    E.fx.delay = dIn;

    // ---- buses
    E.bus = {};
    // Per-voice sends pass through a tap scaled by the bus gain, so a bus fader moves its reverb too.
    E.tap = {};
    const taps = (name) => {
      E.tap[name] = {};
      for (const k of ['room', 'hall', 'cave', 'delay']) {
        const g = E.gain(MIX.bus[name]);
        g.connect(E.fx[k]);
        E.tap[name][k] = g;
      }
    };
    const bus = (name, sends, duck, hpf) => {
      taps(name);
      const b = E.gain(MIX.bus[name]);
      let tail = b;
      if (hpf) {
        const h = E.filt('highpass', hpf, 0.6);
        tail.connect(h);
        tail = h;
      }
      if (duck) {
        const d = E.gain(1);
        b.connect(d);
        tail = d;
        E.duckTargets.push(d.gain);
      }
      tail.connect(master);
      for (const k in sends) {
        const s = E.gain(sends[k]);
        tail.connect(s);
        s.connect(E.fx[k]);
      }
      E.bus[name] = b;
    };
    // Drum bus: a gentle saturator adds harmonics so the kick reads on phone speakers.
    {
      const b = E.gain(MIX.bus.drums);
      const drive = E.gain(1.6);
      const sat = ctx.createWaveShaper();
      const curve = new Float32Array(2049);
      for (let i = 0; i < curve.length; i++) {
        const x = (i / (curve.length - 1)) * 2 - 1;
        curve[i] = Math.tanh(x * 1.4) / Math.tanh(1.4);
      }
      sat.curve = curve;
      const back = E.gain(0.72);
      b.connect(drive);
      drive.connect(sat);
      sat.connect(back);
      back.connect(master);
      const rs = E.gain(0.1);
      back.connect(rs);
      rs.connect(E.fx.room);
      E.bus.drums = b;
      taps('drums');
    }
    bus('perc', { room: 0.1 });
    bus('bass', {}, true);
    bus('pad', { hall: 0.22 }, true, 180);
    bus('keys', { room: 0.12, hall: 0.14, delay: 0.06 });
    bus('bells', { hall: 0.3, cave: 0.06, delay: 0.14 });
    bus('lead', { hall: 0.22, delay: 0.18 });
    bus('sfx', { room: 0.14 });
    bus('amb', { hall: 0.12 });

    // Route a voice's last node to a bus, with an optional pan and extra sends.
    E.out = (node, busName, o) => {
      o = o || {};
      let n = node;
      if (o.pan) {
        const p = E.panner(o.pan);
        n.connect(p);
        n = p;
      }
      n.connect(E.bus[busName]);
      for (const k of ['room', 'hall', 'cave', 'delay']) {
        if (o[k]) {
          const s = E.gain(o[k]);
          n.connect(s);
          s.connect(E.tap[busName][k]);
        }
      }
      return n;
    };

    // Looping noise source with a per-event deterministic read offset.
    E.noise = (V, key, stereo) => {
      const s = ctx.createBufferSource();
      s.buffer = stereo ? E.wide : E.white;
      s.loop = true;
      const off = ((lib.hash('film-nz', key) % 100003) / 100003) * s.buffer.duration;
      return V.buf(s, off);
    };

    // Sidechain-style pump: a decaying negative curve added to the pad and bass bus gains on a kick.
    const duckLen = 0.32;
    E.duckBuf = ctx.createBuffer(1, Math.floor(duckLen * E.sr), E.sr);
    {
      const d = E.duckBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        const t = i / E.sr;
        d[i] = -(t < 0.006 ? t / 0.006 : Math.exp(-(t - 0.006) / 0.085)) * (i > d.length - 48 ? (d.length - i) / 48 : 1);
      }
    }
    E.duck = (t, depth) => {
      const V = E.voice(t, duckLen, false);
      if (!V) return;
      const s = ctx.createBufferSource();
      s.buffer = E.duckBuf;
      for (const p of E.duckTargets) {
        const g = E.gain(depth);
        s.connect(g);
        g.connect(p);
      }
      V.buf(s, 0);
    };
    return E;
  }

  // ---------------------------------------------------------------- instruments
  function instruments(E) {
    const ctx = E.ctx;
    const I = {};

    // Felt, full, heartbeat or thud kick: a pitch-dropping sine with a short filtered click.
    I.kick = (t, vel, kind) => {
      const P = {
        felt: { f0: 125, f1: 50, fd: 0.055, dec: 0.36, click: 0.18, cf: 1600 },
        full: { f0: 165, f1: 47, fd: 0.065, dec: 0.5, click: 0.3, cf: 4200 },
        heart: { f0: 96, f1: 46, fd: 0.05, dec: 0.3, click: 0.16, cf: 1500 },
        thud: { f0: 95, f1: 52, fd: 0.04, dec: 0.2, click: 0.12, cf: 1200 },
      }[kind || 'felt'];
      const V = E.voice(t, P.dec + 0.03, false);
      if (!V) return;
      const o = E.osc('sine', P.f0);
      V.env(o.frequency, [[0, P.f0], [P.fd, P.f1, 'exp'], [P.dec, P.f1 * 0.92, 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.002, vel], [0.06, vel * 0.75, 'exp'], [P.dec, FLOOR, 'exp']]);
      o.connect(g);
      E.out(g, 'drums');
      V.osc(o);
      const n = E.noise(V, ['kick', t]);
      const f = E.filt('lowpass', P.cf, 0.7);
      const cg = E.gain(0);
      V.env(cg.gain, perc(vel * P.click, 0.0008, 0.012));
      n.connect(f);
      f.connect(cg);
      E.out(cg, 'drums');
    };

    I.brush = (t, vel, pan) => {
      const V = E.voice(t, 0.26, false);
      if (!V) return;
      const n = E.noise(V, ['brush', t]);
      const f = E.filt('bandpass', 3000, 0.55);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.004, vel], [0.05, vel * 0.45, 'exp'], [0.24, FLOOR, 'exp']]);
      n.connect(f);
      f.connect(g);
      E.out(g, 'perc', { pan: pan || 0.12 });
      const o = E.osc('sine', 185);
      const og = E.gain(0);
      V.env(og.gain, perc(vel * 0.35, 0.002, 0.06));
      o.connect(og);
      E.out(og, 'drums');
      V.osc(o, 0.1);
    };

    I.hat = (t, vel, open) => {
      const len = open ? 0.22 : 0.055;
      const V = E.voice(t, len + 0.01, false);
      if (!V) return;
      const n = E.noise(V, ['hat', t]);
      const f = E.filt('highpass', 7200, 0.8);
      const f2 = E.filt('peaking', 10500, 1.2);
      f2.gain.value = 5;
      const g = E.gain(0);
      V.env(g.gain, perc(vel, 0.001, len));
      n.connect(f);
      f.connect(f2);
      f2.connect(g);
      E.out(g, 'perc', { pan: -0.25 });
    };

    I.shaker = (t, vel, pan) => {
      const V = E.voice(t, 0.09, false);
      if (!V) return;
      const n = E.noise(V, ['shaker', t]);
      const f = E.filt('bandpass', 6500, 1.1);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.01, vel], [0.075, FLOOR, 'exp']]);
      n.connect(f);
      f.connect(g);
      E.out(g, 'perc', { pan: pan || 0.3 });
    };

    I.crash = (t, vel, o) => {
      o = o || {};
      const dec = o.dec || 1.55;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const n = E.noise(V, ['crash', t], true);
      const f = E.filt('highpass', 4800, 0.6);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.003, vel], [0.12, vel * 0.45, 'exp'], [dec, FLOOR, 'exp']]);
      n.connect(f);
      f.connect(g);
      E.out(g, 'perc', o);
    };

    // Woodblock tock or small wooden click.
    I.tock = (t, vel, f, o) => {
      o = o || {};
      const V = E.voice(t, 0.1, false);
      if (!V) return;
      const s = E.osc('sine', f * 1.5);
      V.env(s.frequency, [[0, f * 1.5], [0.006, f, 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, perc(vel, 0.001, o.dec || 0.06));
      s.connect(g);
      E.out(g, o.bus || 'perc', o);
      V.osc(s);
      const tri = E.osc('triangle', f * 2.71);
      const tg = E.gain(0);
      V.env(tg.gain, perc(vel * 0.25, 0.001, 0.025));
      tri.connect(tg);
      E.out(tg, o.bus || 'perc', o);
      V.osc(tri, 0.05);
      const n = E.noise(V, ['tock', t, f]);
      const nf = E.filt('bandpass', Math.min(9000, f * 2.4), 2.5);
      const ng = E.gain(0);
      V.env(ng.gain, perc(vel * 0.5, 0.0005, 0.01));
      n.connect(nf);
      nf.connect(ng);
      E.out(ng, o.bus || 'perc', o);
    };

    // FM marimba: soft-mallet FM attack on the fundamental, the tuned 4th partial, a mallet thump.
    I.marimba = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || Math.min(2.2, Math.max(0.35, 1.5 * Math.sqrt(220 / f)));
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const c = E.osc('sine', f);
      const m = E.osc('sine', f);
      const mg = E.gain(0);
      V.env(mg.gain, [[0, f * 1.4], [0.04, f * 0.04, 'exp'], [dec, FLOOR, 'exp']]);
      m.connect(mg);
      mg.connect(c.frequency);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.003, vel], [dec, FLOOR, 'exp']]);
      c.connect(g);
      E.out(g, o.bus || 'keys', o);
      V.osc(c);
      V.osc(m);
      if (f * 4 < 16000) {
        const p = E.osc('sine', f * 4);
        const pg = E.gain(0);
        V.env(pg.gain, perc(vel * 0.22, 0.002, 0.12));
        p.connect(pg);
        E.out(pg, o.bus || 'keys', o);
        V.osc(p, 0.2);
      }
      const n = E.noise(V, ['mar', t, f]);
      const nf = E.filt('lowpass', 1400, 0.7);
      const ng = E.gain(0);
      V.env(ng.gain, perc(vel * 0.12, 0.001, 0.012));
      n.connect(nf);
      nf.connect(ng);
      E.out(ng, o.bus || 'keys', o);
    };

    // Kalimba: sine tine with a small pitch settle, an inharmonic overtone and a thumb click.
    I.kalimba = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || 1.5;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const s = E.osc('sine', f);
      V.env(s.frequency, [[0, f * 1.007], [0.03, f, 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.002, vel], [0.09, vel * 0.55, 'exp'], [dec, FLOOR, 'exp']]);
      s.connect(g);
      E.out(g, o.bus || 'keys', o);
      V.osc(s);
      if (f * 5.93 < 17000) {
        const p = E.osc('sine', f * 5.93);
        const pg = E.gain(0);
        V.env(pg.gain, perc(vel * 0.28, 0.001, 0.07));
        p.connect(pg);
        E.out(pg, o.bus || 'keys', o);
        V.osc(p, 0.12);
      }
      const h = E.osc('sine', f * 2);
      const hg = E.gain(0);
      V.env(hg.gain, perc(vel * 0.1, 0.002, 0.35));
      h.connect(hg);
      E.out(hg, o.bus || 'keys', o);
      V.osc(h, 0.5);
      const n = E.noise(V, ['kal', t, f]);
      const nf = E.filt('bandpass', 3300, 1.8);
      const ng = E.gain(0);
      V.env(ng.gain, perc(vel * 0.3, 0.0005, 0.008));
      n.connect(nf);
      nf.connect(ng);
      E.out(ng, o.bus || 'keys', o);
    };

    // Glockenspiel: free-bar partial ratios, higher partials die first.
    I.glock = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || 1.8;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const parts = [
        [1, 1, 1],
        [2.756, 0.3, 0.35],
        [5.404, 0.11, 0.14],
        [8.933, 0.05, 0.06],
      ];
      for (const [ratio, a, d] of parts) {
        if (f * ratio > 18000) continue;
        const s = E.osc('sine', f * ratio);
        const g = E.gain(0);
        V.env(g.gain, perc(vel * a, 0.001, dec * d));
        s.connect(g);
        E.out(g, o.bus || 'bells', o);
        V.osc(s, dec * d + 0.02);
      }
    };

    // Glassy sine ping.
    I.glass = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || 1.6;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const parts = [
        [1, 1, 1],
        [2, 0.12, 0.35],
        [3.01, 0.05, 0.18],
      ];
      for (const [ratio, a, d] of parts) {
        const s = E.osc('sine', f * ratio);
        const g = E.gain(0);
        V.env(g.gain, perc(vel * a, o.att || 0.003, dec * d));
        s.connect(g);
        E.out(g, o.bus || 'bells', o);
        V.osc(s, dec * d + 0.02);
      }
    };

    // FM bell: modulator at an inharmonic or harmonic ratio, index decaying with the note.
    I.fmBell = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || 1.6;
      const ratio = o.ratio || 1.4;
      const idx = o.index || 3;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const c = E.osc('sine', f);
      const m = E.osc('sine', f * ratio);
      const mg = E.gain(0);
      V.env(mg.gain, [[0, f * idx], [dec * 0.5, f * idx * 0.08, 'exp']]);
      m.connect(mg);
      mg.connect(c.frequency);
      const g = E.gain(0);
      V.env(g.gain, perc(vel, o.att || 0.002, dec));
      c.connect(g);
      E.out(g, o.bus || 'bells', o);
      V.osc(c);
      V.osc(m);
    };

    // Soft FM gong.
    I.gong = (t, f, vel, o) => {
      o = o || {};
      const dec = o.dec || 2.2;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const c = E.osc('sine', f);
      const m = E.osc('sine', f * 1.41);
      const mg = E.gain(0);
      V.env(mg.gain, [[0, f * 0.3], [0.09, f * 2.2], [dec, f * 0.15, 'exp']]);
      m.connect(mg);
      mg.connect(c.frequency);
      const lp = E.filt('lowpass', 1900, 0.5);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.012, vel], [dec, FLOOR, 'exp']]);
      c.connect(lp);
      lp.connect(g);
      E.out(g, o.bus || 'bells', o);
      V.osc(c);
      V.osc(m);
    };

    // Metallic FM ting for the gold dots.
    I.ting = (t, f, vel, o) => I.fmBell(t, f, vel, Object.assign({ ratio: 3.51, index: 1.6, dec: 0.45 }, o || {}));

    // Warm detuned pad: two warm-saw voices per note, spread left and right, one shared lowpass.
    // o: att, rel, cut0, cut1 (cutoff at the start and at t1), q, sine (hushed sine pad), bus, sends
    I.pad = (t0, t1, notes, vel, o) => {
      o = o || {};
      const att = Math.min(o.att === undefined ? 0.25 : o.att, t1 - t0);
      const rel = o.rel === undefined ? 0.35 : o.rel;
      const hold = t1 - t0;
      const len = hold + rel;
      const V = E.voice(t0, len, true);
      if (!V) return;
      const lp = E.filt('lowpass', o.cut0 || 1200, o.q || 0.6);
      V.env(lp.frequency, [[0, o.cut0 || 1200], [hold, o.cut1 || o.cut0 || 1200, 'exp'], [len, (o.cut1 || o.cut0 || 1200) * 0.7, 'exp']]);
      const g = E.gain(0);
      const pts = [[0, 0], [att, vel, o.attShape || 'lin']];
      if (hold > att) pts.push([hold, vel * (o.sus === undefined ? 1 : o.sus), 'lin']);
      pts.push([len, 0, 'lin']);
      V.env(g.gain, pts);
      lp.connect(g);
      E.out(g, o.bus || 'pad', o);
      const per = 1 / Math.sqrt(notes.length * 2);
      notes.forEach((nm, i) => {
        const f = hz(nm);
        const sides = o.sine ? [0] : [-1, 1];
        for (const side of sides) {
          const s = E.osc(o.sine ? 'sine' : E.warmSaw, f);
          s.detune.value = side * (o.detune || 8) + (i % 2 ? 1.5 : -1.5);
          const sg = E.gain(per * (o.sine ? 1.4 : 1));
          const p = E.panner(side * (o.width === undefined ? 0.55 : o.width) * (i % 2 ? 0.8 : 1));
          s.connect(sg);
          sg.connect(p);
          p.connect(lp);
          V.osc(s);
        }
      });
    };

    // Sub bass: sine with a little 2nd and 3rd harmonic so it survives small speakers.
    I.sub = (t0, t1, note, vel, o) => {
      o = o || {};
      const att = Math.min(o.att === undefined ? 0.008 : o.att, t1 - t0);
      const rel = o.rel === undefined ? 0.06 : o.rel;
      const hold = t1 - t0;
      const len = hold + rel;
      const V = E.voice(t0, len, true);
      if (!V) return;
      const f = hz(note);
      const g = E.gain(0);
      const pts = [[0, 0], [att, vel, o.attShape || 'lin']];
      if (hold > att) pts.push([hold, vel * (o.sus === undefined ? 0.85 : o.sus), 'lin']);
      pts.push([len, 0, 'lin']);
      V.env(g.gain, pts);
      const lp = E.filt('lowpass', 420, 0.5);
      for (const [k, a] of [
        [1, 1],
        [2, 0.3],
        [3, 0.1],
      ]) {
        const s = E.osc('sine', f * k);
        const sg = E.gain(a);
        s.connect(sg);
        sg.connect(lp);
        V.osc(s);
      }
      lp.connect(g);
      E.out(g, 'bass');
    };

    // Sub drop: a sine sweeping down under a hit.
    I.subDrop = (t, f0, f1, len, vel) => {
      const V = E.voice(t, len + 0.02, false);
      if (!V) return;
      const s = E.osc('sine', f0);
      V.env(s.frequency, [[0, f0], [len, f1, 'exp']]);
      const g = E.gain(0);
      V.env(g.gain, [[0, 0], [0.004, vel], [len * 0.5, vel * 0.7, 'lin'], [len, FLOOR, 'exp']]);
      s.connect(g);
      E.out(g, 'bass');
      V.osc(s);
    };

    // Warm pluck: warm saw plus soft square an octave up, a fast lowpass sweep.
    I.pluck = (t, note, vel, o) => {
      o = o || {};
      const f = hz(note);
      const dec = o.dec || 0.8;
      const V = E.voice(t, dec + 0.05, false);
      if (!V) return;
      const lp = E.filt('lowpass', 2000, o.q || 1.2);
      const top = Math.min(11000, f * (o.bright || 9));
