  /**
   * schema(ctx, s) : the control schema of shots 04, 05, 08 (storyboard G4/G5) in its canonical geometry.
   * s (all 0..1 unless noted): dev, devStop, agent, agentLabel ('агент'|'модель'), core, rings [4] (draw-on),
   * ringGlow [4], tools, toolsActive [3], routes, gates, pulse (global T → signal dots travel the routes on
   * beats; null = none), alpha, labels 1 (ring tabs).
   */
  ui.schema = (ctx, s = {}) => {
    const G = lib.GEO;
    ctx.save();
    ctx.globalAlpha *= s.alpha != null ? s.alpha : 1;
    // rings (outermost first so inner tabs sit on top)
    const rings = s.rings || [0, 0, 0, 0];
    const glow = s.ringGlow || [0, 0, 0, 0];
    for (let i = G.RINGS.length - 1; i >= 0; i--) {
      const R = G.RINGS[i];
      const p = clamp(rings[i] || 0);
      if (p <= 0) continue;
      const pts = ui.ringPts(R);
      const g = clamp(glow[i] || 0);
      ui.arrow(ctx, pts, { p, head: false, r: 0, lw: 2, color: g > 0 ? lib.mix(lib.mix(pal.bgDeep, pal.txt, 0.5), pal.sig, g) : lib.mix(pal.bgDeep, pal.txt, 0.5) });
      if (g > 0) ui.arrow(ctx, pts, { p, head: false, r: 0, lw: 6, alpha: 0.25 * g, color: pal.sig });
      const tabP = clamp(p * 3);
      if ((s.labels == null || s.labels > 0) && tabP > 0) {
        const sc = ease.outBack(tabP);
        ctx.save();
        ctx.translate(R.x + 24, R.y);
        ctx.scale(sc, sc);
        ctx.globalAlpha *= clamp(tabP * 2) * (s.labels != null ? s.labels : 1);
        const c = ui.chip(ctx, R.label, 0, 0, { size: 26, weight: 600, fill: pal.bgDeep, stroke: g > 0.3 ? pal.sig : pal.hairHi, h: 44, padX: 16, color: pal.txt });
        ctx.restore();
        void c;
      }
    }
    // routes and gates
    const rp = clamp(s.routes || 0);
    if (rp > 0) {
      for (const Rt of G.ROUTES) ui.arrow(ctx, Rt.pts, { p: rp, lw: 4, color: pal.sig, headSize: 18, r: 22, glow: rp < 1 ? 0.5 : 0 });
    }
    const gp = clamp(s.gates || 0);
    if (gp > 0) {
      for (const Rt of G.ROUTES) for (let j = 0; j < Rt.gates.length; j++) {
        const q = clamp(gp * 4 - j);
        if (q <= 0) continue;
        const [gx, gy] = Rt.gates[j];
        const sz = 18 * ease.outBack(q);
        ctx.save();
        ctx.fillStyle = pal.bgDeep;
        ctx.strokeStyle = pal.sig;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.rect(gx - sz / 2, gy - sz / 2, sz, sz);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = pal.sig;
        ctx.fillRect(gx - sz / 6, gy - sz / 6, sz / 3, sz / 3);
        ctx.restore();
      }
    }
    if (s.pulse != null && rp >= 1) {
      const beat = 0.5;
      const ph = ((s.pulse % beat) + beat) % beat / beat;
      for (const Rt of G.ROUTES) {
        const q = ui.along(ui.roundPts(Rt.pts, 22), ease.inOutSine(ph));
        ui.glow(ctx, q.x, q.y, 34, pal.sigHot, 0.7);
        ctx.fillStyle = pal.sigHot;
        ctx.beginPath();
        ctx.arc(q.x, q.y, 7, 0, TAU);
        ctx.fill();
      }
    }
    // developer node
    const dp = clamp(s.dev || 0);
    if (dp > 0) {
      const D = G.DEV;
      ui.node(ctx, D.x, D.y, D.w, D.h, { p: dp, size: 30, align: 'left', icon: null });
      ctx.save();
      ctx.globalAlpha *= clamp(dp * 1.6);
      ui.user(ctx, D.x - D.w / 2 + 52, D.y, 60);
      // label starts after the user mark and stays clear of the stop button (right − 50)
      ui.label(ctx, 'разработчик', D.x - D.w / 2 + 96, D.y + 1, { size: 30, weight: 600, baseline: 'middle', maxW: D.w - 96 - 90 });
      ctx.restore();
      const st = clamp(s.devStop || 0);
      if (st > 0) {
        const bx = D.x + D.w / 2 - 50, by = D.y;
        const sc = ease.outBack(clamp(st * 1.5));
        ctx.save();
        ctx.translate(bx, by);
        ctx.scale(sc, sc);
        ui.glow(ctx, 0, 0, 70, pal.sig, 0.5 * st);
        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, TAU);
        ctx.fillStyle = pal.sigTint;
        ctx.fill();
        ctx.strokeStyle = pal.sig;
        ctx.lineWidth = 3;
        ctx.stroke();
        ui.icon(ctx, 'stop', 0, 0, 30, { color: pal.sig });
        ctx.restore();
      }
    }
    // core, agent/model
    const cp = clamp(s.core || 0);
    if (cp > 0) {
      const C = G.CORE;
      const pts = ui.ringPts({ x: C.x, y: C.y, w: C.w, h: C.h, r: 26 });
      ctx.save();
      ctx.globalAlpha *= clamp(cp * 2);
      ctx.beginPath();
      ui.rr(ctx, C.x, C.y, C.w, C.h, 26);
      ctx.fillStyle = pal.panel;
      ctx.fill();
      ctx.restore();
      ui.arrow(ctx, pts, { p: cp, head: false, r: 0, lw: 3, color: pal.sig });
      ui.glow(ctx, C.x + C.w / 2, C.y + C.h / 2, 220, pal.sig, 0.12 * cp);
    }
    const ap = clamp(s.agent || 0);
    if (ap > 0) {
      const A = G.AGENT;
      const sc = 0.8 + 0.2 * ease.outBack(ap);
      ctx.save();
      ctx.globalAlpha *= clamp(ap * 1.6);
      ui.agent(ctx, A.x, A.y, A.s * sc, { glow: 1, state: s.agentState || 'idle' });
      ui.label(ctx, s.agentLabel || 'агент', A.x, 968, { size: 28, font: 'mono', weight: 500, color: pal.txtDim, align: 'center' });
      ctx.restore();
    }
    // tools
    const tp = clamp(s.tools || 0);
    if (tp > 0) {
      const acts = s.toolsActive || [0, 0, 0];
      G.TOOLS.forEach((T, i) => ui.node(ctx, T.x, T.y, T.w, T.h, { p: clamp(tp * 3 - i), label: T.label, icon: T.icon, font: 'mono', size: 32, active: acts[i] || 0 }));
    }
    ctx.restore();
  };

  for (const key of Object.keys(ui)) if (typeof ui[key] === 'function') Object.freeze(ui[key]);
  lib.ui = Object.freeze(ui);

  // ===========================================================================
  // Read-only
  // ===========================================================================

  // A scene that changed lib, lib.pal or lib.ease would leak into every shot drawn after it, in
  // whatever order frames happen to be drawn (and differently in each render worker). So all of
  // it is frozen:
  //   - lib itself is a plain frozen object: a write throws in strict code and is ignored in
  //     non-strict code, so nothing leaks, and reading lib.fn in a hot loop stays at full speed.
  //   - pal and ease are also wrapped so a write throws even from non-strict scene code (core
  //     records it as a draw error, tools/check.cjs reports it). The wrapper makes each read about
  //     20 ns slower, so hoist colours out of per-point loops (const ink = P.ink). Code inside lib
  //     uses the raw objects and pays nothing.
  function readOnly(target, name) {
    const fail = (verb, prop) => {
      throw new TypeError(
        `${name} is read-only: a scene cannot ${verb} '${String(prop)}' (it would leak into other shots). ` +
          `Make a local copy instead, for example const P = Object.assign({}, FILM.lib.pal, { ink: '#000' }).`
      );
    };
    return new Proxy(Object.freeze(target), {
      set: (t, prop) => fail('set', prop),
      defineProperty: (t, prop) => fail('define', prop),
      deleteProperty: (t, prop) => fail('delete', prop),
      setPrototypeOf: () => fail('change the prototype of', name),
    });
  }
  for (const key of Object.keys(ease)) Object.freeze(ease[key]);
  lib.pal = readOnly(pal, 'FILM.lib.pal');
  lib.ease = readOnly(ease, 'FILM.lib.ease');
  for (const key of Object.keys(lib)) {
    const v = Object.getOwnPropertyDescriptor(lib, key).value;
    if (typeof v === 'function') Object.freeze(v);
  }
  Object.defineProperty(FILM, 'lib', { value: Object.freeze(lib), writable: false, enumerable: true, configurable: false });
})();

<script>
// ---- src/scenes/01-instant-result.js
/*
 * 01 · instant-result · «Мгновенный результат» · T 0–5 · interface plate
 *
 * The React app «Обращения клиентов» grows out of the dark; a developer prompt is typed over it,
 * an orange line runs from the prompt to three code cards, the whole request flies into the app as
 * its new search field, «вход» is typed and the list filters down to ticket 1043. Ends on H1.
 *
 * Layers, back to front:
 *   1  plate (ui.bg, dot grid drifting 6 px per beat)
 *   2  the app at G1 — entrance scale 0.94 → 1 about (540, 970), 15 % ghost outline, orange scan line
 *   3  scrim over the app while the request overlay is up (0.5 → 3.25)
 *   4  request overlay group: orange line, prompt card, code cards, agent mark (flies into the search slot at 3.0)
 *   5  found-row ring pulse (4.0)
 *   6  tag + headline (screen-fixed, from 0.5)
 * Captions are core's.
 */
(function () {
  'use strict';

  const ID = 'instant-result';
  const FR = 1 / 24;

  // ===== shared H1 block — identical in 01-instant-result.js, 02-price-of-done.js, 03-one-wrong-step.js =====
  /** H1 (storyboard handoff, T 5.0): the app's final state; the caret blinks on the global clock. */
  function h1AppState(T) {
    return { search: 1, query: 'вход', filter: 1, mark: 1, focus: 1, t: T };
  }
  /** H1 tag + headline of shot 01; `out` = seconds since their exit began (negative = still in). */
  function h1Titles(ctx, L, T, out) {
    L.ui.tag(ctx, '// ai-кодинг', T - 0.5, { out });
    L.ui.headline(ctx, ['AI уже пишет [код]'], T - 0.5, { out, outDur: 0.25 });
  }
  // ===== end shared H1 block =====

  const APP = { x: 100, y: 590, w: 880, h: 760, r: 28 };
  const PROMPT = 'Добавь поиск по обращениям';
  // code cards, top to bottom; they pop bottom → top as the orange line reaches them
  const CARDS = [
    { name: 'SearchBar.tsx', add: '+24', y: 800, t0: 2.75 },
    { name: 'TicketList.tsx', add: '+8', y: 890, t0: 2.5 },
    { name: 'App.tsx', add: '+6', y: 980, t0: 2.25 },
  ];

  const B_IN = 0.5; // T 0.5  tag, headline, prompt card
  const B_SEND = 2.0; // T 2.0  send, orange line, agent mark
  const B_FLY = 3.0; // T 3.0  overlay flies into the app, search field lands
  const B_TYPE = 3.25; // T 3.25 «вход» on 16ths
  const B_FIND = 4.0; // T 4.0  filter, ring pulse

  /** App state at shot time t (T = t here: the shot starts at 0). */
  function appState(ui, E, t, T) {
    if (t >= 4.375) return h1AppState(T);
    const clamp = FILM.lib.clamp;
    const nq = t < B_TYPE - 1e-6 ? 0 : Math.min(4, Math.floor((t - B_TYPE) * 8 + 1e-6) + 1);
    return {
      search: ui.kf(t, B_FLY, 0.25),
      query: 'вход'.slice(0, nq),
      filter: ui.kf(t, B_FIND, 0.25),
      mark: ui.kf(t, 4.125, 0.25, 'outCubic'),
      focus: ui.kf(t, 3.125, 0.125),
      caret: t >= 3.125 - 1e-6,
      // solid caret while the field lands and the query is typed, then it blinks on the global clock
      t: t < 3.75 ? 0 : T,
      rows: 0.2 + 0.8 * clamp(t / 0.6),
    };
  }

  function rrPath(ctx, ui, x, y, w, h, r) {
    ctx.beginPath();
    ui.rr(ctx, x, y, w, h, r);
  }

  /** Orange scan line sweeping the window during the entrance (0 → 0.5). */
  function scanLine(ctx, L, t) {
    const ui = L.ui, P = L.pal;
    const p = L.clamp(t / 0.5);
    if (p >= 1) return;
    const sy = APP.y + 2 + (APP.h - 4) * L.ease.inOutSine(p);
    const a = 1 - L.smoothstep(0.72, 1, p);
    ctx.save();
    rrPath(ctx, ui, APP.x, APP.y, APP.w, APP.h, APP.r);
    ctx.clip();
    const band = ctx.createLinearGradient(0, sy - 110, 0, sy);
    band.addColorStop(0, L.rgba(P.sig, 0));
    band.addColorStop(1, L.rgba(P.sig, 0.2 * a));
    ctx.fillStyle = band;
    ctx.fillRect(APP.x, sy - 110, APP.w, 110);
    ctx.fillStyle = L.rgba(P.sig, a);
    ctx.fillRect(APP.x, sy - 1, APP.w, 2);
    ctx.fillStyle = L.rgba(P.sigHot, 0.8 * a);
    ctx.fillRect(APP.x + 40, sy - 0.5, APP.w - 80, 1);
    ctx.restore();
    ui.glow(ctx, 540, sy, 140, P.sig, 0.35 * a);
  }

  /** The developer's prompt card (0.5 → flies at 3.0). */
  function promptCard(ctx, L, t, T) {
    const ui = L.ui, P = L.pal;
    const pe = ui.kf(t, B_IN, 6 * FR, 'outCubic');
    if (pe <= 0) return;
    const dy = 30 * (1 - pe);
    ctx.save();
    ctx.globalAlpha *= pe;
    ui.panel(ctx, 130, 1150 + dy, 820, 140, { r: 24, fill: P.panelHi, stroke: P.hairHi });
    ui.user(ctx, 190, 1220 + dy, 64);
    ui.label(ctx, 'разработчик', 240, 1196 + dy, { font: 'mono', size: 22, weight: 500, color: P.txtFaint });
    const n = t < B_IN - 1e-6 ? 0 : Math.min(PROMPT.length, Math.floor((t - B_IN) * 21 + 1e-6) + 1);
    const tw = ui.label(ctx, PROMPT.slice(0, n), 240, 1246 + dy, { size: 34, weight: 500, color: P.txt });
    const done = n >= PROMPT.length;
    if (t < B_SEND - 1e-6 && (!done || ui.caretOn(T))) {
      ctx.fillStyle = P.sig;
      ctx.fillRect(240 + tw + 4, 1246 + dy - 30, 3, 38);
    }
    // send button: waits dim, wakes when the text is complete, flashes orange on send
    const bx = 888, by = 1220 + dy;
    const sent = t >= B_SEND - 1e-6;
    const bp = ui.kf(t, B_SEND, 6 * FR);
    const bs = sent ? 1 + 0.2 * Math.sin(Math.PI * bp) : 1;
    if (sent) ui.glow(ctx, bx, by, 90, P.sig, 0.55 * (1 - bp) + 0.18);
    ctx.save();
    ctx.translate(bx, by);
    ctx.scale(bs, bs);
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fillStyle = sent ? P.sig : P.panelTop;
    ctx.fill();
    if (!sent) {
      ctx.strokeStyle = P.hairHi;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ui.icon(ctx, 'send', 0, 0, 28, { color: sent ? P.bg : done ? P.txt : P.txtFaint, lw: 3 });
    ctx.restore();
    ctx.restore();
  }

  /** One generated-code card: file icon, file name, green line count. */
  function codeCard(ctx, L, c, t) {
    const ui = L.ui, P = L.pal;
    const pk = ui.pop(t, c.t0);
    if (pk <= 0) return;
    const a = L.clamp((t - c.t0 + FR) / (2 * FR));
    const sc = 0.72 + 0.28 * pk;
    ctx.save();
    ctx.globalAlpha *= a;
    ctx.translate(540, c.y);
    ctx.scale(sc, sc);
    ctx.translate(-540, -c.y);
    ui.panel(ctx, 280, c.y - 38, 520, 76, { r: 16, fill: P.panel, stroke: P.hairHi });
    ctx.fillStyle = P.ok;
    ctx.fillRect(280, c.y - 20, 4, 40);
    ui.icon(ctx, 'file', 322, c.y, 28, { color: P.txtDim, lw: 2.5 });
    ui.label(ctx, c.name, 352, c.y + 1, { font: 'mono', size: 28, weight: 500, color: P.txt, baseline: 'middle' });
    ui.label(ctx, c.add, 772, c.y + 1, { font: 'mono', size: 28, weight: 600, color: P.ok, baseline: 'middle', align: 'right' });
    ctx.restore();
  }

  /** The request overlay: orange line, prompt card, code cards, agent mark. */
  function overlay(ctx, L, t, T) {
    const ui = L.ui, P = L.pal;
    // T 3.0–3.25: the whole group flies into the search slot (scale 0.6, centre to y 802) and fades
    const fe = ui.kf(t, B_FLY, 0.25, 'inOutCubic');
    const ga = 1 - L.smoothstep(0.25, 1, fe);
    if (ga <= 0.001) return;
    ctx.save();
    ctx.globalAlpha *= ga;
    if (fe > 0) {
      const s = L.lerp(1, 0.6, fe);
      ctx.translate(540, L.lerp(975, 802, fe));
      ctx.scale(s, s);
      ctx.translate(-540, -975);
    }
    // orange line: prompt card top → bottom code card
    const lp = ui.kf(t, B_SEND, 0.25, 'outCubic');
    if (lp > 0) ui.arrow(ctx, [[540, 1150], [540, 1025]], { lw: 4, p: lp, headSize: 18, glow: lp < 1 ? 0.75 : 0.3 });
    promptCard(ctx, L, t, T);
    for (let i = CARDS.length - 1; i >= 0; i--) codeCard(ctx, L, CARDS[i], t);
    // agent mark pops on send, busy
    const ap = ui.pop(t, B_SEND);
    if (ap > 0) {
      ctx.save();
      ctx.translate(540, 700);
      const s = 0.6 + 0.4 * ap;
      ctx.scale(s, s);
      ui.agent(ctx, 0, 0, 72, { state: 'busy', glow: 1, alpha: L.clamp(ap * 2) });
      ctx.restore();
    }
    ctx.restore();
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, ui = L.ui, P = L.pal, E = L.ease;
      const t = L.clamp(tIn, 0, info.dur);
      const T = info.shot.start + t;

      // 1 plate
      ui.bg(ctx, { oy: -T * 12 });

      // 2 the app — entrance 0 → 0.5 (outExpo), then locked at G1
      const eIn = E.outExpo(L.clamp(t / 0.5));
      const st = appState(ui, E, t, T);
      ctx.save();
      if (eIn < 1) {
        const sc = 0.94 + 0.06 * eIn;
        ctx.translate(540, 970);
        ctx.scale(sc, sc);
        ctx.translate(-540, -970);
        // frame 0 is never black: a 15 % window outline under the scan line
        ctx.save();
        rrPath(ctx, ui, APP.x, APP.y, APP.w, APP.h, APP.r);
        ctx.strokeStyle = L.rgba(P.txt, 0.15 * (1 - eIn));
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
        st.alpha = eIn;
      }
      ui.app(ctx, APP.x, APP.y, APP.w, st);
      scanLine(ctx, L, t);
      ctx.restore();

      // 3 scrim while the request overlay is up
      const sa = 0.66 * ui.kf(t, B_IN, 6 * FR) * (1 - ui.kf(t, B_FLY, 0.25));
      if (sa > 0) {
        rrPath(ctx, ui, APP.x, APP.y, APP.w, APP.h, APP.r);
        ctx.fillStyle = L.rgba(P.bg, sa);
        ctx.fill();
      }

      // 4 request overlay
      if (t >= B_IN - 1e-6 && t < B_FLY + 0.25) overlay(ctx, L, t, T);

      // 5 ring pulse around the found row (ticket 1043) at 4.0
      const pk = ui.kf(t, B_FIND, 8 * FR);
      if (pk > 0 && pk < 1) {
        const col = E.inOutCubic(st.filter || 0);
        const yy = APP.y + 280 + 116 * (1 - col);
        const g = 12 * E.outCubic(pk);
        ctx.save();
        rrPath(ctx, ui, APP.x + 36 - g, yy - g, 808 + 2 * g, 104 + 2 * g, 16 + g);
        ctx.strokeStyle = L.rgba(P.sig, 1 - pk);
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();
        ui.glow(ctx, APP.x + 36 + 60, yy + 52, 120, P.sig, 0.35 * (1 - pk));
      }

      // 6 tag + headline
      h1Titles(ctx, L, T, -1);
    },
  });
})();

<script>
// ---- src/scenes/02-price-of-done.js
/*
 * 02 · price-of-done · «Цена слова «готово»» · T 5–10 · interface plate
 *
 * Opens on H1 (the working search). A green «✓ Готово» badge pops on the cut beat. On «пока» (6.5) the
 * camera pulls back ×3.14 → ×1: the app shrinks into the right-hand tool card; files and terminal slide
 * in, the agent mark comes down from above, and the three cards are wired to it (7.0 / 7.5 / 8.0). The
 * badge leaves the app, flies to the agent, collapses into a circle and turns into the orange «?» (8.5).
 * Ends on H2.
 *
 * Layers, back to front:
 *   1  plate (ui.bg, screen-fixed, drifting)
 *   2  world: H1 app (≤ 6.5) → pull-back under L.camera through a soft stage mask (6.5–8.5) → H2 (≥ 8.5)
 *   3  the badge / question badge Q (screen space)
 *   4  tags + headlines: shot 01's exits at 6.5, «А что агенту разрешено?» rises at 7.0
 *
 * Camera: zoom z0 = 880/280 → 1 in log space, as a pure dolly about the one world point that stays put on
 * screen (F, derived from the storyboard's end cameras (860, 1147.7)@z0 and (540, 960)@1), eased outCubic
 * so the move starts on the «пока» hit and every wire lands on screen.
 */
(function () {
  'use strict';

  const ID = 'price-of-done';
  const FR = 1 / 24;
  const TAU = Math.PI * 2;

  // ===== shared H1 block — identical in 01-instant-result.js, 02-price-of-done.js, 03-one-wrong-step.js =====
  /** H1 (storyboard handoff, T 5.0): the app's final state; the caret blinks on the global clock. */
  function h1AppState(T) {
    return { search: 1, query: 'вход', filter: 1, mark: 1, focus: 1, t: T };
  }
  /** H1 tag + headline of shot 01; `out` = seconds since their exit began (negative = still in). */
  function h1Titles(ctx, L, T, out) {
    L.ui.tag(ctx, '// ai-кодинг', T - 0.5, { out });
    L.ui.headline(ctx, ['AI уже пишет [код]'], T - 0.5, { out, outDur: 0.25 });
  }
  // ===== end shared H1 block =====

  // ===== shared H2 block — identical in 02-price-of-done.js and 03-one-wrong-step.js =====
  /** The question badge Q of H2. */
  const H2Q = { x: 668, y: 694, r: 38 };
  /** H2 tag + headline of shot 02 (in at T 7.0); `out` = seconds since their exit began. */
  function h2Titles(ctx, L, T, out) {
    L.ui.tag(ctx, '// доступ', T - 7.0, { out });
    L.ui.headline(ctx, ['А что агенту', '[разрешено?]'], T - 7.0, { out, outDur: 0.2 });
  }
  /** Wire from the agent mark down to a tool card whose centre x is cx. */
  function h2Wire(cx) {
    return [[540, 846], [540, 900], [cx, 900], [cx, 972]];
  }
  /** Q's glow breathing (global clock, peaks on the bar lines 9.0 / 10.0). */
  function qBreath(T) {
    return 0.425 + 0.075 * Math.cos(TAU * (T - 9));
  }
  /**
   * A tool card at world rect (x, y, w) seen through a camera of zoom z. The kit thickens outlines of small
   * cards (lw = 2 / scale); drawing the card at w * z under a 1 / z scale gives exactly the outline the kit
   * would draw at the card's on-screen size, so the zoomed card matches the full-size window (H1) and the
   * small card matches ui.toolCard at 280 (H2).
   */
  function toolCardZ(ctx, L, id, x, y, w, z, o) {
    ctx.save();
    ctx.translate(x, y);
    if (z !== 1) ctx.scale(1 / z, 1 / z);
    L.ui.toolCard(ctx, id, 0, 0, w * z, Object.assign({ label: false }, o));
    ctx.restore();
  }
  /** The mono name above a tool card (the kit's toolCard label, drawn in world units). */
  function cardLabel(ctx, L, id, x, y, act, alpha) {
    if (alpha <= 0) return;
    const ui = L.ui, P = L.pal;
    const icon = id === 'files' ? 'folder' : id === 'terminal' ? 'terminal' : 'app';
    ctx.save();
    ctx.globalAlpha *= alpha;
    ui.icon(ctx, icon, x + 16, y - 26, 28, { color: act > 0.5 ? P.sig : P.txtDim, lw: 2.5 });
    ui.label(ctx, id, x + 42, y - 16, { size: 30, font: 'mono', weight: 500, color: P.txt });
    ctx.restore();
  }
  /**
   * The H2 world: three wires, three tool cards (TOOLS2, app card in the H1 state), the agent mark.
   * z: camera zoom it is seen through. o (per card index files, terminal, app): wire (draw-on), wireGlow,
   * active (orange border), label (alpha); others (alpha of everything but the files card), files (its alpha).
   */
  function h2World(ctx, L, T, z, o) {
    o = o || {};
    const ui = L.ui;
    const cards = L.GEO.TOOLS2;
    const aO = o.others != null ? o.others : 1;
    const aF = o.files != null ? o.files : 1;
    const wp = o.wire || [1, 1, 1];
    const wg = o.wireGlow || [0, 0, 0];
    const act = o.active || [0, 0, 0];
    const la = o.label || [1, 1, 1];
    if (aO > 0) {
      ctx.save();
      ctx.globalAlpha *= aO;
      for (let i = 0; i < 3; i++) {
        if (wp[i] > 0) ui.arrow(ctx, h2Wire(cards[i].x + cards[i].w / 2), { lw: 3, p: wp[i], glow: wg[i] });
      }
      ctx.restore();
    }
    for (let i = 0; i < 3; i++) {
      const c = cards[i];
      const a = c.id === 'files' ? aF : aO;
      if (a > 0) toolCardZ(ctx, L, c.id, c.x, c.y, c.w, z, { alpha: a, active: act[i], app: h1AppState(T) });
      cardLabel(ctx, L, c.id, c.x, c.y, act[i], la[i] * aO);
    }
    if (aO > 0) ui.agent(ctx, 540, 780, 150, { glow: 1, alpha: aO });
  }
  /**
   * Q, the question badge (H2 = defaults). o: alpha, green 0..1 (its «done» colours), check 0..1 (✓ scale),
   * q 0..1 («?» scale), glow (alpha; default qBreath(T)), x / y (centre).
   */
  function h2Q(ctx, L, T, o) {
    o = o || {};
    const ui = L.ui, P = L.pal;
    const a = o.alpha != null ? o.alpha : 1;
    if (a <= 0) return;
    const x = o.x != null ? o.x : H2Q.x;
    const y = o.y != null ? o.y : H2Q.y;
    const g = o.green || 0;
    const col = g > 0 ? L.mix(P.sig, P.ok, g) : P.sig;
    const fill = g > 0 ? L.mix(P.sigTint, P.okTint, g) : P.sigTint;
    ctx.save();
    ctx.globalAlpha *= a;
    ui.glow(ctx, x, y, 90, col, o.glow != null ? o.glow : qBreath(T));
    ctx.beginPath();
    ctx.arc(x, y, H2Q.r, 0, TAU);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.stroke();
    const ck = o.check || 0;
    if (ck > 0) ui.icon(ctx, 'check', x, y, 40 * ck, { color: col, lw: 4 });
    const q = o.q != null ? o.q : 1;
    if (q > 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(q, q);
      ui.label(ctx, '?', 0, 3, { size: 48, weight: 800, color: col, align: 'center', baseline: 'middle' });
      ctx.restore();
    }
    ctx.restore();
  }
  // ===== end shared H2 block =====

  // ---- camera: pull-back from the app card (= G1) to the H2 layout ------------------------------
  const Z0 = 880 / 280; // the app card (280 wide) fills G1 (880 wide)
  const C0 = [860, 1030 + 370 / Z0]; // camera centre at Z0: card (720, 1030) lands on G1 (100, 590)
  // the world point that stays fixed on screen between (C0, Z0) and ((540, 960), 1)
  const FX = (Z0 * C0[0] - 540) / (Z0 - 1);
  const FY = (Z0 * C0[1] - 960) / (Z0 - 1);
  const PB0 = 6.5, PB1 = 8.5; // pull-back, global T
  const zoomAt = (L, T) => Math.exp(Math.log(Z0) * (1 - L.ease.outCubic(L.clamp((T - PB0) / (PB1 - PB0)))));
  const camFor = (z) => ({ x: FX - (FX - 540) / z, y: FY - (FY - 960) / z, zoom: z });
  const toScreen = (z, wx, wy) => [FX + z * (wx - FX), FY + z * (wy - FY)];

  // wires land app → terminal → files (7.25 / 7.75 / 8.25), each drawn on over the 6 frames before
  const LAND = [8.25, 7.75, 7.25]; // per TOOLS2 index: files, terminal, app

  // ---- the green «✓ Готово» badge -----------------------------------------------------------------
  const BADGE = { size: 30, h: 51, padX: 18, iconW: 40, right: 956, y: 590 };
  const badgeW = (ui, ctx) => ui.measure(ctx, 'Готово', { size: BADGE.size, weight: 600 }) + BADGE.padX * 2 + BADGE.iconW;
  /** Right-edge anchor of the badge while it rides the app card: the card's design point (856, 0). */
  const badgeRight = (z) => toScreen(z, 720 + (856 * 280) / 880, 1030);

  /**
   * The badge as a pill (ui.chip layout: check icon + «Готово», Inter 600 30, ok on okTint) that collapses
   * into the r 38 circle of Q as m goes 0 → 1. sc: pop scale, ga: glow alpha.
   */
  function doneBadge(ctx, L, cx, cy, W0, m, sc, ga) {
    const ui = L.ui, P = L.pal;
    const w = L.lerp(W0, 2 * H2Q.r, m);
    const h = L.lerp(BADGE.h, 2 * H2Q.r, m);
    ui.glow(ctx, cx, cy, L.lerp(120, 90, m), P.ok, ga);
    ctx.save();
    ctx.translate(cx, cy);
    if (sc !== 1) ctx.scale(sc, sc);
    const x0 = -w / 2;
    ctx.beginPath();
    ui.rr(ctx, x0, -h / 2, w, h, h / 2);
    ctx.fillStyle = P.okTint;
    ctx.fill();
    ctx.strokeStyle = P.ok;
    ctx.lineWidth = L.lerp(2, 3, m);
    ctx.stroke();
    ctx.clip();
    const ix = L.lerp(-W0 / 2 + BADGE.padX + BADGE.size / 2, 0, m);
    ui.icon(ctx, 'check', ix, 0, L.lerp(BADGE.size * 0.95, 40, m), { color: P.ok, lw: L.lerp(3, 4, m) });
    const ta = 1 - L.clamp(m * 2.2);
    if (ta > 0) ui.label(ctx, 'Готово', ix + BADGE.iconW - BADGE.size / 2, 1, { size: BADGE.size, weight: 600, color: P.ok, baseline: 'middle', alpha: ta });
    ctx.restore();
  }

  /**
   * Draws fn(g) into a scratch layer and fades out everything above the stage edge (y0 hidden → y1 visible)
   * before compositing it: during the camera move nothing in the world sweeps behind the headline.
   * The layer is fully cleared on every use, so no state crosses frames.
   */
  function stageMask(ctx, L, y0, y1, fn) {
    const cv = ctx.canvas;
    const w = cv.width, h = cv.height;
    const lay = L.cached(ID + ':stage-layer:' + w + 'x' + h, () => FILM.makeCanvas(w, h));
    const g = lay.getContext('2d');
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, w, h);
    g.restore();
    g.save();
    FILM.baseTransform(g);
    fn(g);
    g.globalCompositeOperation = 'destination-out';
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, L.rgba(L.pal.bg, 1));
    gr.addColorStop(1, L.rgba(L.pal.bg, 0));
    g.fillStyle = gr;
    g.fillRect(-20, -20, 1120, y1 + 20);
    g.restore();
    ctx.drawImage(lay, 0, 0, 1080, 1920);
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, ui = L.ui, E = L.ease;
      const t = L.clamp(tIn, 0, info.dur);
      const T = info.shot.start + t;

      // 1 plate (screen-fixed during the camera move)
      ui.bg(ctx, { oy: -T * 12 });

      // 2 world
      const z = zoomAt(L, T);
      const wire = LAND.map((l) => ui.kf(T, l - 0.25, 0.25, 'outCubic'));
      const wo = {
        wire,
        wireGlow: LAND.map((l, i) => (wire[i] > 0 ? 0.8 * (1 - ui.k(T, l, 0.25)) : 0)),
        active: LAND.map((l) => {
          const k = ui.kf(T, l, 0.5);
          return k > 0 ? Math.pow(1 - k, 1.5) : 0;
        }),
        label: LAND.map((l) => ui.kf(T, l - 0.125, 0.25, 'outCubic')),
      };
      if (T <= PB0) {
        ui.app(ctx, 100, 590, 880, h1AppState(T)); // H1, exactly as shot 01 leaves it
      } else if (T >= PB1) {
        h2World(ctx, L, T, 1, wo); // H2
      } else {
        stageMask(ctx, L, 505, 600, (g) => L.camera(g, camFor(z), (c) => h2World(c, L, T, z, wo)));
      }

      // 3 the badge → Q (screen space)
      const W0 = badgeW(ui, ctx);
      if (T < 7.25) {
        const r = badgeRight(z);
        doneBadge(ctx, L, r[0] - W0 / 2, r[1], W0, 0, ui.pop(T, 5.0), 0.6 - 0.4 * ui.kf(T, 5.0, 0.5));
      } else if (T < 8.5 - 1e-6) {
        const r = badgeRight(zoomAt(L, 7.25));
        const p0 = [r[0] - W0 / 2, r[1]];
        const p1 = [H2Q.x, H2Q.y];
        const c1 = [p0[0] + 20, p1[1] - 90];
        const m = E.inOutCubic(ui.k(T, 7.25, 1.0));
        const v = 1 - m;
        const x = v * v * p0[0] + 2 * v * m * c1[0] + m * m * p1[0];
        const y = v * v * p0[1] + 2 * v * m * c1[1] + m * m * p1[1];
        doneBadge(ctx, L, x, y, W0, m, 1, 0.2);
      } else {
        const c = ui.kf(T, 8.5, 4 * FR);
        if (c >= 1) h2Q(ctx, L, T, {});
        else h2Q(ctx, L, T, { green: 1 - c, check: 1 - E.outCubic(c), q: ui.pop(T, 8.5), glow: L.lerp(0.2, qBreath(T), c) });
      }

      // 4 titles: shot 01's leave on «пока», this shot's rise at 7.0
      if (T < PB0 + 0.25) h1Titles(ctx, L, T, T - PB0);
      h2Titles(ctx, L, T, -1);
    },
  });
})();

</script>

  // ===== shared H2 block — identical in 02-price-of-done.js and 03-one-wrong-step.js =====
  /** The question badge Q of H2. */
  const H2Q = { x: 668, y: 694, r: 38 };
  /** H2 tag + headline of shot 02 (in at T 7.0); `out` = seconds since their exit began. */
  function h2Titles(ctx, L, T, out) {
    L.ui.tag(ctx, '// доступ', T - 7.0, { out });

  }
  /** Wire from the agent mark down to a tool card whose centre x is cx. */
  function h2Wire(cx) {
    return [[540, 846], [540, 900], [cx, 900], [cx, 972]];

  /** Q's glow breathing (global clock, peaks on the bar lines 9.0 / 10.0). */

  /**
   * A tool card at world rect (x, y, w) seen through a camera of zoom z. The kit thickens outlines of small
   * cards (lw = 2 / scale); drawing the card at w * z under a 1 / z scale gives exactly the outline the kit
   * would draw at the card's on-screen size, so the zoomed card matches the full-size window (H1) and the
   * small card matches ui.toolCard at 280 (H2).
   */
  function toolCardZ(ctx, L, id, x, y, w, z, o) {
    ctx.save();
    ctx.translate(x, y);
    if (z !== 1) ctx.scale(1 / z, 1 / z);
    L.ui.toolCard(ctx, id, 0, 0, w * z, Object.assign({ label: false }, o));
    ctx.restore();
  }
  /** The mono name above a tool card (the kit's toolCard label, drawn in world units). */
  function cardLabel(ctx, L, id, x, y, act, alpha) {
    if (alpha <= 0) return;
    const ui = L.ui, P = L.pal;
    const icon = id === 'files' ? 'folder' : id === 'terminal' ? 'terminal' : 'app';
    ctx.save();
    ctx.globalAlpha *= alpha;
    ui.icon(ctx, icon, x + 16, y - 26, 28, { color: act > 0.5 ? P.sig : P.txtDim, lw: 2.5 });
    ui.label(ctx, id, x + 42, y - 16, { size: 30, font: 'mono', weight: 500, color: P.txt });
    ctx.restore();
  }
  /**
   * The H2 world: three wires, three tool cards (TOOLS2, app card in the H1 state), the agent mark.
   * z: camera zoom it is seen through. o (per card index files, terminal, app): wire (draw-on), wireGlow,
   * active (orange border), label (alpha); others (alpha of everything but the files card), files (its alpha).
   */
  function h2World(ctx, L, T, z, o) {
    o = o || {};
    const ui = L.ui;
    const cards = L.GEO.TOOLS2;
    const aO = o.others != null ? o.others : 1;
    const aF = o.files != null ? o.files : 1;
    const wp = o.wire || [1, 1, 1];
    const wg = o.wireGlow || [0, 0, 0];
    const act = o.active || [0, 0, 0];
    const la = o.label || [1, 1, 1];
    if (aO > 0) {
      ctx.save();
      ctx.globalAlpha *= aO;
      for (let i = 0; i < 3; i++) {
        if (wp[i] > 0) ui.arrow(ctx, h2Wire(cards[i].x + cards[i].w / 2), { lw: 3, p: wp[i], glow: wg[i] });
      }
      ctx.restore();
    }
    for (let i = 0; i < 3; i++) {
      const c = cards[i];
      const a = c.id === 'files' ? aF : aO;
      if (a > 0) toolCardZ(ctx, L, c.id, c.x, c.y, c.w, z, { alpha: a, active: act[i], app: h1AppState(T) });
      cardLabel(ctx, L, c.id, c.x, c.y, act[i], la[i] * aO);
    }
    if (aO > 0) ui.agent(ctx, 540, 780, 150, { glow: 1, alpha: aO });
  }
  /**
   * Q, the question badge (H2 = defaults). o: alpha, green 0..1 (its «done» colours), check 0..1 (✓ scale),
   * q 0..1 («?» scale), glow (alpha; default qBreath(T)), x / y (centre).
   */
  function h2Q(ctx, L, T, o) {
    o = o || {};
    const ui = L.ui, P = L.pal;
    const a = o.alpha != null ? o.alpha : 1;
    if (a <= 0) return;
    const x = o.x != null ? o.x : H2Q.x;
    const y = o.y != null ? o.y : H2Q.y;
    const g = o.green || 0;
    const col = g > 0 ? L.mix(P.sig, P.ok, g) : P.sig;
    const fill = g > 0 ? L.mix(P.sigTint, P.okTint, g) : P.sigTint;
    ctx.save();
    ctx.globalAlpha *= a;
    ui.glow(ctx, x, y, 90, col, o.glow != null ? o.glow : qBreath(T));
    ctx.beginPath();
    ctx.arc(x, y, H2Q.r, 0, TAU);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.stroke();
    const ck = o.check || 0;
    if (ck > 0) ui.icon(ctx, 'check', x, y, 40 * ck, { color: col, lw: 4 });
    const q = o.q != null ? o.q : 1;
    if (q > 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(q, q);
      ui.label(ctx, '?', 0, 3, { size: 48, weight: 800, color: col, align: 'center', baseline: 'middle' });
      ctx.restore();
    }
    ctx.restore();
  }
  // ===== end shared H2 block =====

  // ---- push-in: H2 → the files card → the G3 tree -------------------------------------------------
  // The card's tree (ui.tree at design (40, 76), w 800, rows 76, no header, card scale 280/880) lands with
  // its rows on G3's rows: row pitch 76·s → 72, row 0 centre → y 722, depth-1 text → x 222.
  const S0 = 280 / 880;
  const ZE = 72 / (76 * S0);
  const CEX = 80 + S0 * (40 + 40 + 40 + 62) + (540 - 222) / ZE;
  const CEY = 1030 + S0 * (76 + 10 + 38) + (960 - 722) / ZE;
  // the world point that stays fixed on screen between ((540, 960), 1) and ((CEX, CEY), ZE)
  const FX = (ZE * CEX - 540) / (ZE - 1);
  const FY = (ZE * CEY - 960) / (ZE - 1);
  // world origin of a copy of the G3 tree that lands exactly on G3 (80, 600) at ZE
  const VX = FX + (80 - FX) / ZE;
  const VY = FY + (600 - FY) / ZE;
  const PUSH = 0.5; // push-in length, shot time
  const camFor = (z) => ({ x: FX - (FX - 540) / z, y: FY - (FY - 960) / z, zoom: z });

  // ---- stage geometry -------------------------------------------------------------------------------
  const TREE = { x: 80, y: 600, w: 560 }; // G3
  const OP = { x: 520, y: 1010, w: 480, h: 256, r: 24 }; // operation card (kept clear of the tree's names)
  const PILL = { right: OP.x + OP.w - 28, cy: 1190, h: 52, padX: 20, size: 28, glyph: 22, gap: 12 };
  const LINE = [[600, 722], [700, 722], [700, OP.y - 6]]; // src/ row → operation card
  const HOVER = [455, 724]; // pointer tip on the src/ row, right of its name
  const FROM = [1060, 1500]; // pointer enters here
  const DANGER = { x: 56, y: 572, w: 968, h: 736, r: 36 };
  const PUNCH = { x: 540, y: 940, k: 0.015 };

  // beats (shot time; global = +10)
  const B_TITLE = 0.5; // T 10.5
  const B_GLIDE = 0.75; // T 10.75
  const B_HOVER = 1.25; // T 11.25
  const B_OP = 1.5; // T 11.5
  const B_REACH = 1.75; // T 11.75 → 12.35
  const B_STOP = 2.5; // T 12.5

  /**
   * Draws fn(g) into a scratch layer and fades out everything above the stage edge (y0 hidden → y1 visible)
   * before compositing it: during the camera move nothing in the world sweeps behind the headline.
   * The layer is fully cleared on every use, so no state crosses frames.
   */
  function stageMask(ctx, L, y0, y1, fn) {
    const cv = ctx.canvas;
    const w = cv.width, h = cv.height;
    const lay = L.cached(ID + ':stage-layer:' + w + 'x' + h, () => FILM.makeCanvas(w, h));
    const g = lay.getContext('2d');
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, w, h);
    g.restore();
    g.save();
    FILM.baseTransform(g);
    fn(g);
    g.globalCompositeOperation = 'destination-out';
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, L.rgba(L.pal.bg, 1));
    gr.addColorStop(1, L.rgba(L.pal.bg, 0));
    g.fillStyle = gr;
    g.fillRect(-20, -20, 1120, y1 + 20);
    g.restore();
    ctx.drawImage(lay, 0, 0, 1080, 1920);
  }

  /** The «return» key glyph (↵), drawn so it does not depend on the font having the arrow. */
  function returnGlyph(ctx, x, y, s, color) {
    const h = s / 2;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x + h * 0.8, y - h * 0.8);
    ctx.lineTo(x + h * 0.8, y + h * 0.25);
    ctx.lineTo(x - h * 0.8, y + h * 0.25);
    ctx.moveTo(x - h * 0.35, y - h * 0.2);
    ctx.lineTo(x - h * 0.8, y + h * 0.25);
    ctx.lineTo(x - h * 0.35, y + h * 0.7);
    ctx.stroke();
    ctx.restore();
  }

  /** Left edge of the «Выполнить ↵» pill. */
  function pillLeft(ui, ctx) {
    const tw = ui.measure(ctx, 'Выполнить', { size: PILL.size, weight: 600 });
    return PILL.right - (PILL.padX * 2 + tw + PILL.gap + PILL.glyph);
  }

  /** The operation card «удалить папку · rm -rf src/ · Выполнить ↵». dk: 0..1 danger (stroke → red). */
  function opCard(ctx, L, dk) {
    const ui = L.ui, P = L.pal;
    const edge = dk > 0 ? L.mix(P.sig, P.danger, dk) : P.sig;
    ui.panel(ctx, OP.x, OP.y, OP.w, OP.h, { r: OP.r, fill: P.panel, stroke: edge, lw: 2 + dk, glow: L.rgba(edge, 0.4) });
    ui.icon(ctx, 'trash', OP.x + 52, 1060, 40, { color: P.sig, lw: 3.4 });
    ui.label(ctx, 'удалить папку', OP.x + 88, 1073, { size: 38, weight: 700, color: P.sig, tracking: -0.3 });
    ctx.beginPath();
    ui.rr(ctx, OP.x + 28, 1092, OP.w - 56, 56, 12);
    ctx.fillStyle = P.panelHi;
    ctx.fill();
    ui.label(ctx, 'rm -rf src/', OP.x + 52, 1131, { size: 32, font: 'mono', weight: 500, color: P.txt });
    // «Выполнить ↵» — button-like, never pressed
    const x0 = pillLeft(ui, ctx);
    const w = PILL.right - x0;
    ctx.beginPath();
    ui.rr(ctx, x0, PILL.cy - PILL.h / 2, w, PILL.h, PILL.h / 2);
    ctx.fillStyle = P.panelTop;
    ctx.fill();
    ctx.strokeStyle = P.hairHi;
    ctx.lineWidth = 2;
    ctx.stroke();
    const tw = ui.label(ctx, 'Выполнить', x0 + PILL.padX, PILL.cy + 1, { size: PILL.size, weight: 600, color: P.txt, baseline: 'middle' });
    returnGlyph(ctx, x0 + PILL.padX + tw + PILL.gap + PILL.glyph / 2, PILL.cy, PILL.glyph, P.txtDim);
  }

  /** The agent's pointer: an orange cursor with a multiplayer-style name tag «агент». */
  function agentPointer(ctx, L, x, y, a) {
    const ui = L.ui, P = L.pal;
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha *= a;
    ui.cursor(ctx, x, y, 48, { color: P.sig, outline: P.bg });
    const tx = x + 24, ty = y + 38, th = 34;
    const tw = ui.measure(ctx, 'агент', { font: 'mono', size: 22, weight: 600 });
    const w = 44 + tw + 14;
    ctx.beginPath();
    ui.rr(ctx, tx, ty, w, th, th / 2);
    ctx.fillStyle = P.sig;
    ctx.fill();
    ui.agent(ctx, tx + 23, ty + th / 2 + 2, 22, { color: P.bg, fill: P.sig, eyesAccent: true });
    ui.label(ctx, 'агент', tx + 44, ty + th / 2 + 1, { font: 'mono', size: 22, weight: 600, color: P.bg, baseline: 'middle' });
    ctx.restore();
  }

  /** Pointer tip position at shot time t. */
  function pointerAt(L, ui, ctx, t) {
    const E = L.ease;
    if (t < B_REACH) {
      const u = ui.kf(t, B_GLIDE, 0.5, 'outCubic');
      const c = [840, 760];
      const v = 1 - u;
      return [v * v * FROM[0] + 2 * v * u * c[0] + u * u * HOVER[0], v * v * FROM[1] + 2 * v * u * c[1] + u * u * HOVER[1]];
    }
    const stop = [pillLeft(ui, ctx) - 40, PILL.cy - 14];
    const u = E.inOutCubic(ui.k(t, B_REACH, 0.6));
    return [L.lerp(HOVER[0], stop[0], u), L.lerp(HOVER[1], stop[1], u)];
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, ui = L.ui, P = L.pal, E = L.ease;
      const t = L.clamp(tIn, 0, info.dur);
      const T = info.shot.start + t;

      // 1 plate
      ui.bg(ctx, { oy: -T * 12 });

      // 2 push-in through the files card
      if (t <= 0) {
        h2World(ctx, L, T, 1, {}); // H2, exactly as shot 02 leaves it
        h2Q(ctx, L, T, {});
      } else if (t < PUSH) {
        const z = Math.exp(Math.log(ZE) * E.inOutCubic(t / PUSH));
        const cam = camFor(z);
        const others = 1 - E.inQuad(L.clamp(t / 0.375));
        const cross = E.inOutSine(ui.k(t, 0.292, 4 * FR));
        stageMask(ctx, L, 505, 600, (g) =>
          L.camera(g, cam, (c) => {
            h2World(c, L, T, z, { others, files: 1 - cross });
            h2Q(c, L, T, { alpha: others });
          })
        );
        if (cross > 0) {
          L.camera(ctx, cam, (c) => {
            c.save();
            c.translate(VX, VY);
            c.scale(1 / ZE, 1 / ZE);
            ui.tree(c, 0, 0, TREE.w, { alpha: cross });
            c.restore();
          });
        }
      } else {
        // 3 stage, punched in on the stop-frame
        const dk = ui.kf(t, B_STOP, 3 * FR);
        const pk = ui.kf(t, B_STOP, 3 * FR, 'outCubic');
        ctx.save();
        if (pk > 0) {
          const s = 1 + PUNCH.k * pk;
          ctx.translate(PUNCH.x, PUNCH.y);
          ctx.scale(s, s);
          ctx.translate(-PUNCH.x, -PUNCH.y);
        }
        ui.tree(ctx, TREE.x, TREE.y, TREE.w, { hi: t >= B_HOVER - 1e-6 ? 0 : -1, danger: dk });
        // src/ → operation: a line with its origin dot on the hovered row
        const lp = ui.kf(t, B_OP, 6 * FR, 'outCubic');
        if (lp > 0) {
          ctx.beginPath();
          ctx.arc(LINE[0][0], LINE[0][1], 5, 0, TAU);
          ctx.fillStyle = P.sig;
          ctx.fill();
          ui.arrow(ctx, LINE, { lw: 3, p: lp, glow: lp < 1 ? 0.7 : 0 });
        }
        // operation card pops
        const op = ui.pop(t, B_OP);
        if (op > 0) {
          const s = 0.82 + 0.18 * op;
          const cx = OP.x + OP.w / 2, cy = OP.y + OP.h / 2;
          ctx.save();
          ctx.globalAlpha *= L.clamp(op * 1.6);
          ctx.translate(cx, cy);
          ctx.scale(s, s);
          ctx.translate(-cx, -cy);
          opCard(ctx, L, dk);
          ctx.restore();
        }
        // the agent's pointer
        if (t >= B_GLIDE - 1e-6) {
          const p = pointerAt(L, ui, ctx, t);
          agentPointer(ctx, L, p[0], p[1], L.clamp((t - B_GLIDE + FR) / (2 * FR)));
        }
        ctx.restore();

        // 4 danger frame + chip: snap on at 12.5, then only the glow breathes (one cycle per 2 beats)
        if (t >= B_STOP - 1e-6) {
          const br = 0.875 + 0.125 * Math.cos((TAU * (t - B_STOP)) / 1.0);
          ctx.save();
          ctx.beginPath();
          ui.rr(ctx, DANGER.x, DANGER.y, DANGER.w, DANGER.h, DANGER.r);
          ctx.strokeStyle = P.danger;
          ctx.lineWidth = 4;
          ctx.shadowColor = L.rgba(P.danger, 0.75 * br);
          ctx.shadowBlur = 30 * (FILM.S || 1);
          ctx.stroke();
          ctx.restore();
          ui.chip(ctx, 'Без подтверждения?', 80, DANGER.y, { size: 30, weight: 700, icon: 'warn', color: P.danger, fill: P.dangerTint, stroke: P.danger });
        }
      }

      // 5 titles
      if (t < 0.25) h2Titles(ctx, L, T, t);
      const dk = ui.kf(t, B_STOP, 3 * FR);
      ui.tag(ctx, '// риск', t - B_TITLE);
      ui.headline(ctx, ['Один [неверный шаг]'], t - B_TITLE, { accent: dk > 0 ? L.mix(P.sig, P.danger, dk) : P.sig });

      // 6 one-frame flash on the stop
      if (t >= B_STOP - 1e-6 && t < B_STOP + FR - 1e-6) {
        ctx.fillStyle = L.rgba(P.txt, 0.18);
        ctx.fillRect(0, 0, 1080, 1920);
      }
    },
  });
})();

</script>
<script>
// ---- src/scenes/04-who-controls.js
/*
 * 04 who-controls — «Главный вопрос». T 15.0–21.0 (shot-local t 0–6), schematic.
 * Enters with a 0.25 s fade from shot 03 (core); t = 0 is H3: the file tree at G3 on the interface
 * plate, src/ hovered and red. Leaves on H4 (the first frame of 05-engineering-frame.js).
 *
 * Beats (t → T):
 *   0.00–1.00  (15.0–16.0)  plate interface → schematic; the tree panel shrinks into the files node,
 *                           its rows retract bottom-up by 0.5, its «files» header rides the corner and lands as
 *                           the node label
 *   0.50       (15.5)       tag «// контроль» + headline; developer node pops
 *   0.75       (15.75)      agent pops; developer → agent arrow draws on
 *   1.00       (16.0)       terminal + app nodes pop; the agent turns busy
 *   1.00–2.50  (16.0–17.5)  seven wild arrows fire on irregular 16ths, each re-drawn once (a second scribble),
 *                           control points wobbling on twos
 *   2.50       (17.5)       STOP: the stop button pops on the developer node; the arrows freeze (dashed, 60 %)
 *   2.625      (17.625)     chip «выполнение остановлено»
 *   2.75       (17.75)      the agent blinks
 *   3.50–6.00  (18.5–21.0)  mechanical pulse: on every beat the frozen dashes step and a faint ring leaves the agent
 *
 * Layers, back to front:
 *   1. plate (interface crossfading to schematic)
 *   2. pulse rings
 *   3. wild arrows (shared with 05, see the SHARED block)
 *   4. developer → agent arrow
 *   5. developer node (+ stop, local: see drawDevNode), stop ripple, ui.schema tool nodes
 *   6. the tree panel morphing into the files node (t < 1)
 *   7. the agent mark + label (ui.schema's numbers, plus look / blink)
 *   8. stop chip
 *   9. tag + headline (screen-fixed; captions are core's)
 */
(function () {
  'use strict';

  const ID = 'who-controls';
  const FR = 1 / 24;

  // beats, shot-local seconds (global T = 15 + t)
  const B_MORPH = 1.0; // T 16.0   the tree has become the files node
  const B_HEAD = 0.5; // T 15.5    tag, headline, developer node
  const B_AGENT = 0.75; // T 15.75 agent, developer → agent arrow
  const B_TOOLS = 1.0; // T 16.0   terminal + app nodes; agent busy
  const B_STOP = 2.5; // T 17.5    stop, freeze
  const B_CHIP = 2.625; // T 17.625 «выполнение остановлено»
  const B_BLINK = 2.75; // T 17.75
  const B_PULSE = 3.5; // T 18.5   mechanical pulse, every beat to the end

  // ==== SHARED 04/05 — copied verbatim into 05-engineering-frame.js (H4) ========================
  // The seven wild arrows of shot 04 and the other pieces of the H4 frame. Times are shot-04 local
  // (t 0 = T 15.0). The arrows are live from their fire time to WILD_FREEZE and frozen after it.
  const WILD_ID = 'who-controls';
  const WILD_FREEZE = 2.5; // T 17.5: the developer presses stop
  const WILD_REDRAW = 0.375; // the second scribble starts three 16ths after the first
  const WILD_DASH = [14, 10];
  // f: fire time; a / b: first / second scribble as cubic [P0, C1, C2, P1]; every tip misses its node
  const WILD = [
    { f: 1.0, aim: 'files', a: [[492, 930], [420, 1010], [300, 1030], [205, 1196]], b: [[492, 930], [380, 990], [150, 1040], [74, 1220]] },
    { f: 1.125, aim: 'edge right', a: [[600, 872], [720, 870], [850, 770], [1000, 800]], b: [[600, 872], [760, 920], [900, 690], [1050, 742]] },
    { f: 1.375, aim: 'app', a: [[598, 930], [780, 960], [960, 1010], [1010, 1182]], b: [[598, 930], [700, 1010], [820, 1070], [880, 1192]] },
    { f: 1.5, aim: 'edge left', a: [[484, 902], [380, 930], [250, 860], [110, 940]], b: [[484, 902], [360, 990], [200, 880], [40, 1004]] },
    { f: 1.75, aim: 'edge top-left', a: [[488, 866], [360, 850], [250, 790], [150, 650]], b: [[488, 866], [330, 870], [150, 770], [86, 574]] },
    { f: 2.0, aim: 'terminal', a: [[596, 938], [660, 1040], [730, 1150], [702, 1216]], b: [[596, 938], [625, 1090], [470, 1110], [388, 1212]] },
    { f: 2.25, aim: 'edge bottom-right', a: [[602, 906], [800, 920], [1090, 1100], [1030, 1436]], b: null },
  ];
  const HEAD04 = ['Кто [контролирует]', 'работу агента?'];

  /** One scribble at drawing time tw: control points and tip wobble with seeded noise. */
  function wildCurve(L, P4, i, v, tw) {
    const amp = [0, 38, 38, 10];
    const Q = P4.map((p, j) => {
      if (!amp[j]) return p;
      const nx = L.noise1(tw * 5 + 0.37 + j * 1.9, L.hash(WILD_ID, i, v, j, 0) & 0x7fffffff);
      const ny = L.noise1(tw * 5 + 0.37 + j * 1.9, L.hash(WILD_ID, i, v, j, 1) & 0x7fffffff);
      return [p[0] + nx * amp[j], p[1] + ny * amp[j]];
    });
    return L.ui.bezier(Q[0], Q[1], Q[2], Q[3], 36);
  }

  /** The visible scribbles at shot-04 time t (t past WILD_FREEZE returns the frozen state). */
  function wildArrows(L, t) {
    const ui = L.ui;
    const tt = Math.min(t, WILD_FREEZE);
    const tw = L.onTwos(tt);
    const out = [];
    for (let i = 0; i < WILD.length; i++) {
      const w = WILD[i];
      if (tt < w.f - 1e-6) continue;
      const r2 = w.b ? w.f + WILD_REDRAW : Infinity;
      const pA = ui.kf(tt, w.f, 6 * (1 / 24), 'outCubic');
      const eA = w.b ? ui.kf(tt, r2, 4 * (1 / 24), 'outCubic') : 0; // the first scribble retracts tail-first
      if (eA < 1) out.push({ i, pts: wildCurve(L, w.a, i, 0, tw), p: pA, from: eA, a: 1 - 0.8 * eA });
      if (w.b && tt >= r2 - 1e-6) out.push({ i, pts: wildCurve(L, w.b, i, 1, tw), p: ui.kf(tt, r2, 8 * (1 / 24)), from: 0, a: 1 });
    }
    return out;
  }

  /** Draws the wild arrows; o.alpha[i] fades arrow i, o.dashOffset steps the frozen dashes. */
  function drawWild(ctx, L, t, o) {
    const ui = L.ui;
    const sig = L.pal.sig;
    const frozen = t >= WILD_FREEZE - 1e-6;
    for (const A of wildArrows(L, t)) {
      const am = (o && o.alpha ? o.alpha[A.i] : 1) * A.a;
      if (am <= 0.002) continue;
      if (frozen) {
        ui.arrow(ctx, A.pts, { p: A.p, from: A.from, r: 0, lw: 3, headSize: 16, color: sig, alpha: 0.6 * am, dash: WILD_DASH, dashOffset: (o && o.dashOffset) || 0 });
      } else {
        ui.arrow(ctx, A.pts, { p: A.p, from: A.from, r: 0, lw: 3, headSize: 16, color: sig, alpha: am, glow: A.p < 1 ? 0.55 : 0 });
      }
    }
  }

  /** ui.schema's agent + label with the same numbers, plus look / blink and a label crossfade (schema exposes neither). */
  function drawAgentH4(ctx, L, o) {
    const ui = L.ui, A = L.GEO.AGENT;
    const ap = L.clamp(o.p != null ? o.p : 1);
    if (ap <= 0) return;
    const sc = 0.8 + 0.2 * L.ease.outBack(ap);
    ctx.save();
    ctx.globalAlpha *= L.clamp(ap * 1.6);
    ui.agent(ctx, A.x, A.y, A.s * sc, { glow: 1, state: o.state || 'idle', look: o.look || 0, blink: o.blink || 0 });
    const lab = { size: 28, font: 'mono', weight: 500, color: L.pal.txtDim, align: 'center' };
    const q = L.clamp(o.mix || 0);
    if (q < 1) ui.label(ctx, o.label || 'агент', A.x, 968, Object.assign({ alpha: 1 - q }, lab));
    if (q > 0) ui.label(ctx, o.label2 || 'агент', A.x, 968, Object.assign({ alpha: q }, lab));
    ctx.restore();
  }

  /** The developer → agent arrow (storyboard 04 Forms). */
  function drawDevArrow(ctx, L, p, alpha) {
    if (p <= 0 || alpha <= 0) return;
    const D = L.GEO.DEV;
    L.ui.arrow(ctx, [[D.x, D.y + D.h / 2], [D.x, 818]], { p, color: L.pal.txtDim, lw: 3, alpha });
  }

  /**
   * The developer node at G4 DEV with its stop button. Local instead of ui.schema's dev/devStop: the kit
   * draws the label at the node's left + 28 and the user mark centred at left + 52, so «раз» of
   * «разработчик» sits under the mark. Same node, mark and button drawing; the label starts after the
   * mark and the button sits as a badge on the node's right edge so the full label fits.
   */
  function drawDevNode(ctx, L, p, stop, alpha) {
    p = L.clamp(p);
    if (p <= 0 || alpha <= 0) return;
    const ui = L.ui, P = L.pal, D = L.GEO.DEV;
    const sc = 0.86 + 0.14 * L.ease.outBack(p);
    ctx.save();
    ctx.globalAlpha *= alpha * L.clamp(p * 1.6);
    ctx.translate(D.x, D.y);
    ctx.scale(sc, sc);
    ui.panel(ctx, -D.w / 2, -D.h / 2, D.w, D.h, { r: 20, fill: P.panel, stroke: P.hairHi, lw: 2 });
    ui.user(ctx, -D.w / 2 + 52, 0, 60);
    ui.label(ctx, 'разработчик', -D.w / 2 + 98, 1, { size: 30, weight: 600, color: P.txt, baseline: 'middle' });
    const st = L.clamp(stop || 0);
    if (st > 0) {
      const bs = L.ease.outBack(L.clamp(st * 1.5));
      ctx.save();
      ctx.translate(D.w / 2, 0);
      ctx.scale(bs, bs);
      ui.glow(ctx, 0, 0, 70, P.sig, 0.5 * st);
      ctx.beginPath();
      ctx.arc(0, 0, 28, 0, Math.PI * 2);
      ctx.fillStyle = P.sigTint;
      ctx.fill();
      ctx.strokeStyle = P.sig;
      ctx.lineWidth = 3;
      ctx.stroke();
      ui.icon(ctx, 'stop', 0, 0, 30, { color: P.sig });
      ctx.restore();
    }
    ctx.restore();
  }

  /** The chip «выполнение остановлено» under the developer node, centred (540, 724); 26 px (art bible minimum). */
  function drawStopChip(ctx, L, sc, alpha) {
    if (sc <= 0 || alpha <= 0) return;
    const P = L.pal;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.translate(540, 724);
    ctx.scale(sc, sc);
    L.ui.chip(ctx, 'выполнение остановлено', 0, 0, { align: 'center', size: 26, font: 'mono', weight: 500, color: P.sig, fill: P.sigTint, stroke: P.sigDeep, icon: 'stop', h: 44 });
    ctx.restore();
  }
  // ==== end SHARED 04/05 ==========================================================================

  /** The tree panel (G3) shrinking into the files node; its header becomes the node's icon + label. */
  function drawTreeMorph(ctx, L, t) {
    const ui = L.ui, P = L.pal;
    const T3 = L.GEO.TREE3;
    const N = L.GEO.TOOLS[0];
    const k = L.ease.inOutCubic(L.clamp(t / B_MORPH));
    const h0 = 76 + L.TREE.length * 72 + 20; // ui.tree panel height (672)
    const rx = L.lerp(T3.x, N.x - N.w / 2, k);
    const ry = L.lerp(T3.y, N.y - N.h / 2, k);
    const rw = L.lerp(T3.w, N.w, k);
    const rh = L.lerp(h0, N.h, k);
    const rr = L.lerp(24, 20, k);
    const danger = 1 - ui.k(t, 0, 0.25);
    // rows retract bottom-up (ui.tree's cascade run backwards) and are gone by t 0.5
    const rowsP = 1 - ui.k(t, 0.06, 0.44, 'inOutSine');
    const rowsA = L.clamp(rowsP * 5); // the header rule fades with the last rows
    // surface (fill + shadow), then the rows clipped inside it, then the outline on top
    ui.panel(ctx, rx, ry, rw, rh, { r: rr, fill: P.panel, stroke: null });
    if (rowsA > 0) {
      const s = rw / T3.w;
      const a0 = ctx.globalAlpha;
      ctx.save();
      ctx.beginPath();
      ui.rr(ctx, rx + 2, ry + 2, rw - 4, rh - 4, Math.max(0, rr - 2));
      ctx.clip();
      ctx.translate(rx, ry);
      ctx.scale(s, s);
      ctx.translate(-T3.x, -T3.y);
      ctx.globalAlpha = a0 * rowsA;
      ui.tree(ctx, T3.x, T3.y, T3.w, { hi: 0, danger, p: rowsP });
      // the tree's own header is hidden here: it is redrawn below, riding the panel corner
      ctx.globalAlpha = a0;
      ctx.fillStyle = P.panel;
      ctx.fillRect(T3.x + 2, T3.y + 2, T3.w - 4, 72);
      ctx.restore();
    }
    ui.panel(ctx, rx, ry, rw, rh, { r: rr, fill: null, stroke: P.hairHi });
    // header «files»: tree header (icon 30 at +44/+40, mono 26 txtDim at +72/+42) → node (icon 40 at +48/+46, mono 32 600 txt at +84/+47)
    const col = L.mix(P.txtDim, P.txt, k);
    ui.icon(ctx, 'folder', rx + L.lerp(44, 48, k), ry + L.lerp(40, 46, k), L.lerp(30, 40, k), { color: col, lw: L.lerp(2.5, 3.6, k) });
    ui.label(ctx, 'files', rx + L.lerp(72, 84, k), ry + L.lerp(42, 47, k), { size: L.lerp(26, 32, k), font: 'mono', weight: k < 0.5 ? 500 : 600, color: col, baseline: 'middle' });
  }

  /** The press: one orange ripple leaves the stop button (8 frames), gone long before H4. */
  function drawStopRipple(ctx, L, t) {
    const u = L.ui.kf(t, B_STOP, 8 * FR);
    if (u <= 0 || u >= 1) return;
    const D = L.GEO.DEV;
    const e = L.ease.outCubic(u);
    ctx.save();
    ctx.globalAlpha *= 0.7 * (1 - u);
    ctx.strokeStyle = L.pal.sig;
    ctx.lineWidth = L.lerp(4, 1.5, u);
    ctx.beginPath();
    ctx.arc(D.x + D.w / 2, D.y, L.lerp(30, 78, e), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  /** A faint ring leaving the agent on every beat from B_PULSE (the shape of the core that 05 draws). */
  function drawPulseRings(ctx, L, t) {
    if (t < B_PULSE - 1e-6) return;
    const ui = L.ui, P = L.pal, C = L.GEO.CORE;
    const cx = C.x + C.w / 2, cy = C.y + C.h / 2;
    const n = Math.floor((t - B_PULSE) / 0.5 + 1e-6);
    for (let b = Math.max(0, n - 1); b <= n; b++) {
      const u = ui.kf(t, B_PULSE + b * 0.5, 8 * FR);
      if (u <= 0 || u >= 1) continue;
      const e = L.ease.outCubic(u);
      const w = L.lerp(150, C.w + 60, e), h = L.lerp(130, C.h + 40, e);
      ctx.save();
      ctx.globalAlpha *= 0.25 * (1 - u);
      ctx.strokeStyle = P.sig;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ui.rr(ctx, cx - w / 2, cy - h / 2, w, h, 30);
      ctx.stroke();
      ctx.restore();
    }
  }

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, ui = L.ui, P = L.pal;
      const t = L.clamp(tIn, 0, info.dur);

      // 1. plate: interface (H3) → schematic
      const pk = ui.k(t, 0, B_MORPH, 'inOutSine');
      if (pk < 1) ui.bg(ctx, { plate: 'interface', oy: -info.T * 12 });
      if (pk > 0) {
        ctx.save();
        ctx.globalAlpha *= pk;
        ui.bg(ctx, { plate: 'schematic' });
        ctx.restore();
      }

      // 2. pulse rings (T 18.5 on)
      drawPulseRings(ctx, L, t);

      // 3. wild arrows: live 16.0–17.5, frozen after; the dashes step on every beat from 18.5
      const steps = t < B_PULSE - 1e-6 ? 0 : Math.floor((t - B_PULSE) / 0.5 + 1e-6) + 1;
      drawWild(ctx, L, t, { dashOffset: 6 * steps });

      // 4. developer → agent
      drawDevArrow(ctx, L, ui.kf(t, B_AGENT, 6 * FR, 'outCubic'), 1);

      // 5. developer node (+ stop) and tool nodes; files is the morphing tree until B_MORPH
      const kT = ui.kf(t, B_TOOLS, 6 * FR);
      const tools = kT <= 0 ? 0 : kT >= 1 ? 1 : 1 / 3 + (2 / 3) * kT;
      drawDevNode(ctx, L, ui.kf(t, B_HEAD, 4 * FR), ui.kf(t, B_STOP, 4 * FR), 1);
      drawStopRipple(ctx, L, t);
      ui.schema(ctx, { agent: 0, tools });

      // 6. the tree → files node
      if (t < B_MORPH - 1e-6) drawTreeMorph(ctx, L, t);

      // 7. agent: busy while the arrows are live, eyes darting on twos; one blink after the stop
      const busy = t >= B_TOOLS - 1e-6 && t < B_STOP - 1e-6;
      const look = busy ? L.clamp(1.6 * L.noise1(L.onTwos(t) * 6 + 0.5, L.hash(ID, 'look') & 0x7fffffff), -1, 1) : 0;
      const bf = Math.floor((t - B_BLINK) * 24 + 1e-6);
      const blink = bf >= 0 && bf < 4 ? [0.55, 1, 1, 0.45][bf] : 0;
      drawAgentH4(ctx, L, { p: ui.kf(t, B_AGENT, 4 * FR), state: busy ? 'busy' : 'idle', look, blink, label: 'агент' });

      // 8. stop chip
      drawStopChip(ctx, L, ui.pop(t, B_CHIP, 4 * FR), 1);

      // 9. tag + headline
      ui.tag(ctx, '// контроль', t - B_HEAD);
      ui.headline(ctx, HEAD04, t - B_HEAD);
    },
  });
})();

</script>
<script>
// ---- src/scenes/05-engineering-frame.js
/*
 * 05 engineering-frame — «Инженерная рамка». T 21.0–27.0 (shot-local t 0–6), schematic.
 * Hard cut from H4: t = 0 is exactly the last frame of 04-who-controls.js (developer + stop, the chip,
 * the agent, the tools, the frozen dashed wild arrows). The SHARED block below is a verbatim copy of
 * the one in 04, so both sides of the cut draw the same pixels.
 *
 * Beats (t → T):
 *   0.00          (21.0)         H4
 *   0.00–0.25     (21.0–21.25)   developer node, stop chip, developer arrow fade out; 04's tag/headline exit (0.2 s)
 *   0.00–0.375    (21.0–21.375)  the core draws on around the agent
 *   0.125         (21.125)       label «агент» → «модель» (3-frame crossfade)
 *   0.50          (21.5)         tag «// ai engineering» + headline «AI Engineering = система вокруг модели»
 *   0.5 1.5 2.5 3.5 (21.5 … 24.5) rings 1–4 draw on (10 frames, outExpo), orange while drawing, cooling over 0.5 s;
 *                                as each ring lands a share of the frozen arrows dissolves (6 frames): none after ring 4
 *   4.00–4.75     (25.0–25.75)   clean orange routes core → tools; gates pop 4.25–4.75; tools light at 4.5
 *   5.00–6.00     (26.0–27.0)    signal dots travel the routes on every beat. Hold.
 *
 * Layers, back to front:
 *   1. plate (schematic, locked)
 *   2. frozen wild arrows (dissolving), dashes still stepping on beats
 *   3. developer → agent arrow, developer node (fading out)
 *   4. ui.schema: rings, routes, gates, pulses, core, tools
 *   5. agent mark + label (ui.schema's numbers, label crossfade)
 *   6. stop chip (fading out)
 *   7. tags + headlines (screen-fixed; captions are core's)
 */
(function () {
  'use strict';

  const ID = 'engineering-frame';
  const FR = 1 / 24;

  // beats, shot-local seconds (global T = 21 + t)
  const B_LABEL = 0.125; // T 21.125 «агент» → «модель»
  const B_HEAD = 0.5; // T 21.5
  const RING_T = [0.5, 1.5, 2.5, 3.5]; // T 21.5, 22.5, 23.5, 24.5
  const B_ROUTES = 4.0; // T 25.0
  const B_GATES = 4.25; // T 25.25
  const B_TOOLS_ON = 4.5; // T 25.5 the routes reach the tools
  const B_PULSE = 5.0; // T 26.0
  const HEAD05 = ['AI Engineering =', '[система вокруг модели]'];

  // H4: shot 04 ends with its dash pattern stepped five times (beats 18.5 … 20.5), 6 px each
  const H4_DASH = 30;
  // which ring dissolves each wild arrow (index into WILD): strays go with the task, misses with the
  // tools, the half-drawn terminal command with the permissions, the last strays with the checks
  const DISSOLVE = [1, 3, 1, 0, 0, 2, 3];

  // ==== SHARED 04/05 — copied verbatim from 04-who-controls.js (H4) ========================
  // The seven wild arrows of shot 04 and the other pieces of the H4 frame. Times are shot-04 local
  // (t 0 = T 15.0). The arrows are live from their fire time to WILD_FREEZE and frozen after it.
  const WILD_ID = 'who-controls';
  const WILD_FREEZE = 2.5; // T 17.5: the developer presses stop
  const WILD_REDRAW = 0.375; // the second scribble starts three 16ths after the first
  const WILD_DASH = [14, 10];
  // f: fire time; a / b: first / second scribble as cubic [P0, C1, C2, P1]; every tip misses its node
  const WILD = [
    { f: 1.0, aim: 'files', a: [[492, 930], [420, 1010], [300, 1030], [205, 1196]], b: [[492, 930], [380, 990], [150, 1040], [74, 1220]] },
    { f: 1.125, aim: 'edge right', a: [[600, 872], [720, 870], [850, 770], [1000, 800]], b: [[600, 872], [760, 920], [900, 690], [1050, 742]] },
    { f: 1.375, aim: 'app', a: [[598, 930], [780, 960], [960, 1010], [1010, 1182]], b: [[598, 930], [700, 1010], [820, 1070], [880, 1192]] },
    { f: 1.5, aim: 'edge left', a: [[484, 902], [380, 930], [250, 860], [110, 940]], b: [[484, 902], [360, 990], [200, 880], [40, 1004]] },
    { f: 1.75, aim: 'edge top-left', a: [[488, 866], [360, 850], [250, 790], [150, 650]], b: [[488, 866], [330, 870], [150, 770], [86, 574]] },
    { f: 2.0, aim: 'terminal', a: [[596, 938], [660, 1040], [730, 1150], [702, 1216]], b: [[596, 938], [625, 1090], [470, 1110], [388, 1212]] },
    { f: 2.25, aim: 'edge bottom-right', a: [[602, 906], [800, 920], [1090, 1100], [1030, 1436]], b: null },
  ];
  const HEAD04 = ['Кто [контролирует]', 'работу агента?'];

  /** One scribble at drawing time tw: control points and tip wobble with seeded noise. */
  function wildCurve(L, P4, i, v, tw) {
    const amp = [0, 38, 38, 10];
    const Q = P4.map((p, j) => {
      if (!amp[j]) return p;
      const nx = L.noise1(tw * 5 + 0.37 + j * 1.9, L.hash(WILD_ID, i, v, j, 0) & 0x7fffffff);
      const ny = L.noise1(tw * 5 + 0.37 + j * 1.9, L.hash(WILD_ID, i, v, j, 1) & 0x7fffffff);
      return [p[0] + nx * amp[j], p[1] + ny * amp[j]];
    });
    return L.ui.bezier(Q[0], Q[1], Q[2], Q[3], 36);
  }

  /** The visible scribbles at shot-04 time t (t past WILD_FREEZE returns the frozen state). */
  function wildArrows(L, t) {
    const ui = L.ui;
    const tt = Math.min(t, WILD_FREEZE);
    const tw = L.onTwos(tt);
    const out = [];
    for (let i = 0; i < WILD.length; i++) {
      const w = WILD[i];
      if (tt < w.f - 1e-6) continue;
      const r2 = w.b ? w.f + WILD_REDRAW : Infinity;
      const pA = ui.kf(tt, w.f, 6 * (1 / 24), 'outCubic');
      const eA = w.b ? ui.kf(tt, r2, 4 * (1 / 24), 'outCubic') : 0; // the first scribble retracts tail-first
      if (eA < 1) out.push({ i, pts: wildCurve(L, w.a, i, 0, tw), p: pA, from: eA, a: 1 - 0.8 * eA });
      if (w.b && tt >= r2 - 1e-6) out.push({ i, pts: wildCurve(L, w.b, i, 1, tw), p: ui.kf(tt, r2, 8 * (1 / 24)), from: 0, a: 1 });
    }
    return out;
  }

  /** Draws the wild arrows; o.alpha[i] fades arrow i, o.dashOffset steps the frozen dashes. */
  function drawWild(ctx, L, t, o) {
    const ui = L.ui;
    const sig = L.pal.sig;
    const frozen = t >= WILD_FREEZE - 1e-6;
    for (const A of wildArrows(L, t)) {
      const am = (o && o.alpha ? o.alpha[A.i] : 1) * A.a;
      if (am <= 0.002) continue;
      if (frozen) {
        ui.arrow(ctx, A.pts, { p: A.p, from: A.from, r: 0, lw: 3, headSize: 16, color: sig, alpha: 0.6 * am, dash: WILD_DASH, dashOffset: (o && o.dashOffset) || 0 });
      } else {
        ui.arrow(ctx, A.pts, { p: A.p, from: A.from, r: 0, lw: 3, headSize: 16, color: sig, alpha: am, glow: A.p < 1 ? 0.55 : 0 });
      }
    }
  }

  /** ui.schema's agent + label with the same numbers, plus look / blink and a label crossfade (schema exposes neither). */
  function drawAgentH4(ctx, L, o) {
    const ui = L.ui, A = L.GEO.AGENT;
    const ap = L.clamp(o.p != null ? o.p : 1);
    if (ap <= 0) return;
    const sc = 0.8 + 0.2 * L.ease.outBack(ap);
    ctx.save();
    ctx.globalAlpha *= L.clamp(ap * 1.6);
    ui.agent(ctx, A.x, A.y, A.s * sc, { glow: 1, state: o.state || 'idle', look: o.look || 0, blink: o.blink || 0 });
    const lab = { size: 28, font: 'mono', weight: 500, color: L.pal.txtDim, align: 'center' };
    const q = L.clamp(o.mix || 0);
    if (q < 1) ui.label(ctx, o.label || 'агент', A.x, 968, Object.assign({ alpha: 1 - q }, lab));
    if (q > 0) ui.label(ctx, o.label2 || 'агент', A.x, 968, Object.assign({ alpha: q }, lab));
    ctx.restore();
  }

  /** The developer → agent arrow (storyboard 04 Forms). */
  function drawDevArrow(ctx, L, p, alpha) {
    if (p <= 0 || alpha <= 0) return;
    const D = L.GEO.DEV;
    L.ui.arrow(ctx, [[D.x, D.y + D.h / 2], [D.x, 818]], { p, color: L.pal.txtDim, lw: 3, alpha });
  }

  /**
   * The developer node at G4 DEV with its stop button. Local instead of ui.schema's dev/devStop: the kit
   * draws the label at the node's left + 28 and the user mark centred at left + 52, so «раз» of
   * «разработчик» sits under the mark. Same node, mark and button drawing; the label starts after the
   * mark and the button sits as a badge on the node's right edge so the full label fits.
   */
  function drawDevNode(ctx, L, p, stop, alpha) {
    p = L.clamp(p);
    if (p <= 0 || alpha <= 0) return;
    const ui = L.ui, P = L.pal, D = L.GEO.DEV;
    const sc = 0.86 + 0.14 * L.ease.outBack(p);
    ctx.save();
    ctx.globalAlpha *= alpha * L.clamp(p * 1.6);
    ctx.translate(D.x, D.y);
    ctx.scale(sc, sc);
    ui.panel(ctx, -D.w / 2, -D.h / 2, D.w, D.h, { r: 20, fill: P.panel, stroke: P.hairHi, lw: 2 });
    ui.user(ctx, -D.w / 2 + 52, 0, 60);
    ui.label(ctx, 'разработчик', -D.w / 2 + 98, 1, { size: 30, weight: 600, color: P.txt, baseline: 'middle' });
    const st = L.clamp(stop || 0);
    if (st > 0) {
      const bs = L.ease.outBack(L.clamp(st * 1.5));
      ctx.save();
      ctx.translate(D.w / 2, 0);
      ctx.scale(bs, bs);
      ui.glow(ctx, 0, 0, 70, P.sig, 0.5 * st);
      ctx.beginPath();
      ctx.arc(0, 0, 28, 0, Math.PI * 2);
      ctx.fillStyle = P.sigTint;
      ctx.fill();
      ctx.strokeStyle = P.sig;
      ctx.lineWidth = 3;
      ctx.stroke();
      ui.icon(ctx, 'stop', 0, 0, 30, { color: P.sig });
      ctx.restore();
    }
    ctx.restore();
  }

  /** The chip «выполнение остановлено» under the developer node, centred (540, 724); 26 px (art bible minimum). */
  function drawStopChip(ctx, L, sc, alpha) {
    if (sc <= 0 || alpha <= 0) return;
    const P = L.pal;
    ctx.save();
    ctx.globalAlpha *= alpha;
    ctx.translate(540, 724);
    ctx.scale(sc, sc);
    L.ui.chip(ctx, 'выполнение остановлено', 0, 0, { align: 'center', size: 26, font: 'mono', weight: 500, color: P.sig, fill: P.sigTint, stroke: P.sigDeep, icon: 'stop', h: 44 });
    ctx.restore();
  }
  // ==== end SHARED 04/05 ==========================================================================

  FILM.scene({
    id: ID,
    draw(ctx, tIn, info) {
      const L = info.lib, ui = L.ui;
      const t = L.clamp(tIn, 0, info.dur);

      // 1. plate
      ui.bg(ctx, { plate: 'schematic' });

      // 2. the frozen arrows from shot 04: dissolve as the rings land; dashes keep stepping on the beat
      const alpha = DISSOLVE.map((d) => 1 - ui.k(t, RING_T[d] + 0.125, 6 * FR));
      if (alpha.some((a) => a > 0)) drawWild(ctx, L, WILD_FREEZE, { dashOffset: H4_DASH + 6 * Math.floor(t / 0.5 + 1e-6), alpha });

      // 3. developer, its arrow and the stop button leave (21.0–21.25)
      const devA = 1 - ui.k(t, 0, 0.25);
      drawDevArrow(ctx, L, 1, devA);
      drawDevNode(ctx, L, 1, 1, devA);

      // 4. the frame around the model
      const rings = RING_T.map((r) => ui.kf(t, r, 10 * FR, 'outExpo'));
      const ringGlow = RING_T.map((r) => (t < r - 1e-6 ? 0 : 1 - ui.k(t, r + 10 * FR, 0.5, 'inOutSine')));
      const toolOn = ui.kf(t, B_TOOLS_ON, 3 * FR);
      ui.schema(ctx, {
        agent: 0,
        core: ui.k(t, 0, 0.375, 'outCubic'),
        rings,
        ringGlow,
        tools: 1,
        toolsActive: [toolOn, toolOn, toolOn],
        routes: ui.kf(t, B_ROUTES, 0.75, 'outCubic'),
        gates: ui.kf(t, B_GATES, 0.5),
        pulse: t >= B_PULSE - 1e-6 ? info.T : null,
      });

      // 5. the agent becomes «модель»
      drawAgentH4(ctx, L, { p: 1, state: 'idle', label: 'агент', label2: 'модель', mix: ui.kf(t, B_LABEL, 3 * FR) });

      // 6. stop chip leaves with the developer
      drawStopChip(ctx, L, 1, devA);

      // 7. tag + headline: 04's exit (0.2 s), 05's enter at 21.5
      if (t < 0.3) {
        ui.tag(ctx, '// контроль', 10, { out: t * 1.25 });
        ui.headline(ctx, HEAD04, 10, { out: t, outDur: 0.2 });
      }
      ui.tag(ctx, '// ai engineering', t - B_HEAD);
      ui.headline(ctx, HEAD05, t - B_HEAD);
    },
  });
})();

</script>
<script>
// ---- src/scenes/06-control-in-action.js
/*
 * 06 control-in-action : «Контроль в действии» — T 27.0–33.0 (6 s), interface plate, enters on a hard cut.
 *
 * An example setup of agent rules (labelled «пример настройки», never a universal guarantee):
 * read files → allowed, change files → with confirmation, delete → forbidden. The agent token walks the
 * track down the rules: passes row 1, waits at row 2, hits the red barrier before row 3; the blocked
 * attempt becomes a confirmation request for the developer.
 *
 * Layers, back to front:
 *   1 plate (ui.bg, dot grid drifting 6 px per beat)
 *   2 tag «// правила» + headline «Доступ. Лимиты. / Подтверждение.» (screen-fixed)
 *   3 rules panel «Правила агента»: shield, title, «пример настройки» chip, limits line
 *   4 three rule rows (slide in from the right; tint + chip lights when the token reaches them)
 *   5 track: hair line, orange trail behind the token, stations, the red barrier
 *   6 agent token (idle → busy → waits → blocked; recoil + shake on twos)
 *   7 dim veil over the rules (from 31.0)
 *   8 confirmation request for the developer (pops at 31.0, glow breathes once per bar)
 *
 * Beats (shot-local t, global T in comments):
 *   0.000 T 27.00  panel slides up 40 px + fades (6 frames)
 *   0.250 T 27.25  tag + headline; the token appears at the top of the track
 *   0.500 T 27.50  row 1 slides in       1.000 T 28.00  token reaches row 1: «можно» lights
 *   1.500 T 28.50  row 2 slides in       2.000 T 29.00  token reaches row 2: «подтверждение» pulses, token waits
 *   2.500 T 29.50  row 3 + barrier       3.500 T 30.50  token hits the barrier: blocked, «запрещено» lights
 *   4.000 T 31.00  confirmation request pops, the rules dim to 70 %
 */
(function () {
  'use strict';

  const ID = 'control-in-action';
  const FR = 1 / 24;

  // ---- geometry (docs/storyboard.md, shot 06) ----------------------------------
  const PANEL = { x: 90, y: 580, w: 900, h: 720, r: 28 };
  const TRACK = { x: 144, y0: 760, y1: 1240 }; // spec x 150, moved 6 px left so the token clears the rows
  const COL_X = 190; // left edge of the text column: title, limits line, rows
  const ROW = { x: 190, w: 760, h: 130, r: 20 };
  const BARRIER = { y: 1060, x0: TRACK.x - 40, x1: TRACK.x + 40 };
  const TOKEN_S = 64;
  const TOKEN_Y0 = 740;
  // the token's head bottom is cy + 0.4 s; it touches the barrier's top face (y − 3) with its outline
  const TOKEN_HIT = BARRIER.y - 3 - TOKEN_S * 0.4 - 2;
  const TOKEN_REST = TOKEN_HIT - 24; // recoil 24 px up
  const REQ = { x: 170, y: 1196, w: 740, h: 184, r: 24 }; // spec y 1120 h 210: moved below row 3 so no row is half-covered

  // ---- beats (shot-local seconds) ----------------------------------------------
  const B_HEAD = 0.25; // T 27.25 tag + headline, token appears
  const ROWS = [
    { cy: 820, icon: 'eye', label: 'Читать файлы', chip: 'можно', chipIcon: 'check', kind: 'allow', tIn: 0.5, tHit: 1.0 },
    { cy: 970, icon: 'pencil', label: 'Изменять файлы', chip: 'подтверждение', chipIcon: 'user', kind: 'ask', tIn: 1.5, tHit: 2.0 },
    { cy: 1120, icon: 'trash', label: 'Удалять', chip: 'запрещено', chipIcon: 'block', kind: 'deny', tIn: 2.5, tHit: 3.5 },
  ];
  const M1 = [1.0 - 8 * FR, 1.0]; // T 27.667–28.0 token → row 1 (outCubic, 8 frames)
  const M2 = [1.5, 2.0]; // T 28.5–29.0 token → row 2
  const WAIT = [2.0, 2.5]; // T 29.0–29.5 waits for confirmation (ring fills)
  const M3 = [2.75, 3.5]; // T 29.75–30.5 token → barrier (accelerating into the hit)
  const B_HIT = 3.5; // T 30.5
  const B_REQ = 4.0; // T 31.0

  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const lerp = (a, b, u) => a + (b - a) * u;

  /** Token centre y and x shake at shot time t. */
  function tokenPose(L, t) {
    const E = L.ease;
    let y = TOKEN_Y0;
    if (t >= M1[0]) y = lerp(TOKEN_Y0, ROWS[0].cy, E.outCubic((t - M1[0]) / (M1[1] - M1[0])));
    if (t >= M2[0]) y = lerp(ROWS[0].cy, ROWS[1].cy, E.outCubic((t - M2[0]) / (M2[1] - M2[0])));
    if (t >= M3[0]) y = lerp(ROWS[1].cy, TOKEN_HIT, E.inCubic((t - M3[0]) / (M3[1] - M3[0])));
    let x = TRACK.x;
    if (t >= B_HIT) {
      // recoil up 24 px (outBack over 6 frames), starting one frame after the contact frame
      y = lerp(TOKEN_HIT, TOKEN_REST, E.outBack(clamp((t - B_HIT - FR) / (6 * FR))));
      // shake on twos from the frame after the contact: three drawings, decaying
      const d = Math.floor((t - B_HIT - FR) * 12 + 1e-6);
      const sh = [-8, 6, -3];
      if (t >= B_HIT + FR - 1e-6 && d >= 0 && d < sh.length) x += sh[d];
    }
    return { x, y };
  }

  /** A row's "current" weight: 1 while the token is at it, 0.5 once it has moved on. */
  function rowGlow(i, t) {
    const r = ROWS[i];
    if (t < r.tHit - 1e-6) return 0;
    const leave = i === 0 ? M2[0] : i === 1 ? M3[0] : 1e9;
    if (t < leave) return 1;
    return lerp(1, 0.3, clamp((t - leave) / (6 * FR)));
  }

  function drawHeader(ctx, L) {
    const P = L.pal, ui = L.ui;
    ui.icon(ctx, 'shield', TRACK.x, 646, 40, { color: P.sig, lw: 3.5 });
    ui.label(ctx, 'Правила агента', 186, 660, { size: 40, weight: 700, color: P.txt, tracking: -0.5 });
    // honesty label: this is one example configuration
    ui.chip(ctx, 'пример настройки', 950, 648, { size: 26, font: 'mono', weight: 500, color: P.txtDim, fill: P.panelHi, stroke: P.hairHi, align: 'right', h: 46, padX: 18 });
    ui.rich(ctx, [['лимит: ', P.txtDim], ['20 шагов', P.txt], [' · ', P.txtFaint], ['5 мин', P.txt]], COL_X, 714, { size: 28, font: 'mono', weight: 500 });
    // hairline under the header
    ctx.fillStyle = P.hair;
    ctx.fillRect(COL_X, 736, PANEL.x + PANEL.w - 40 - COL_X, 2);
  }

  function drawRow(ctx, L, i, t) {
    const P = L.pal, ui = L.ui;
    const r = ROWS[i];
    const kIn = ui.kf(t, r.tIn, 6 * FR, 'outCubic');
    if (kIn <= 0) return;
    const hit = t >= r.tHit - 1e-6 ? 1 : 0;
    const g = rowGlow(i, t);
    const deny = r.kind === 'deny';
    const hue = deny ? P.danger : P.sig;
    const x = ROW.x + (1 - kIn) * 150;
    const y = r.cy - ROW.h / 2;

    ctx.save();
    ctx.globalAlpha *= clamp(kIn * 1.3);
    // body
    ctx.beginPath();
    ui.rr(ctx, x, y, ROW.w, ROW.h, ROW.r);
    ctx.fillStyle = hit ? L.mix(P.panelHi, deny ? P.dangerTint : P.sigTint, 0.9 * g) : P.panelHi;
    ctx.fill();
    ctx.strokeStyle = hit ? L.mix(P.hair, deny ? P.danger : P.sigDeep, 0.35 + 0.65 * g) : P.hair;
    ctx.lineWidth = 2;
    ctx.stroke();
    // accent bar on the left edge once the rule applies
    if (hit) {
      ctx.save();
      ctx.beginPath();
      ui.rr(ctx, x, y, ROW.w, ROW.h, ROW.r);
      ctx.clip();
      ctx.fillStyle = hue;
      ctx.globalAlpha *= 0.55 + 0.45 * g;
      ctx.fillRect(x, y, 6, ROW.h);
      ctx.restore();
    }
    // icon + label
    const iconC = hit ? hue : P.txtDim;
    ui.icon(ctx, r.icon, x + 52, r.cy, 40, { color: iconC, lw: 3.5 });
    ui.label(ctx, r.label, x + 96, r.cy + 1, { size: 36, weight: 600, color: P.txt, baseline: 'middle', tracking: -0.3 });
    // status chip: grey while armed, lights in its colour when the token reaches the row
    const cOn = ui.kf(t, r.tHit, 3 * FR);
    const chipC = L.mix(P.txtDim, hue, cOn);
    const chipFill = r.kind === 'ask' ? P.panel : L.mix(P.panel, deny ? P.dangerTint : P.sigTint, cOn);
    const chipStroke = L.mix(P.hairHi, r.kind === 'allow' ? P.sigDeep : hue, cOn);
    const size = 28, h = 52, padX = 18;
    const tw = ui.measure(ctx, r.chip, { size, weight: 600 });
    const cw = tw + padX * 2 + size + 10;
    const cx = x + ROW.w - 28 - cw / 2;
    // bump on the hit: 1 → 1.14 → 1 over 6 frames, visible on the beat frame
    const bk = ui.kf(t, r.tHit, 6 * FR);
    const bump = bk > 0 && bk < 1 ? 1 + 0.14 * Math.sin(Math.PI * bk) : 1;
    if (bk > 0) ui.glow(ctx, cx, r.cy, 150, hue, 0.35 * (1 - bk) + 0.1 * g);
    ctx.save();
    ctx.translate(cx, r.cy);
    ctx.scale(bump, bump);
    ui.chip(ctx, r.chip, -cw / 2, 0, { size, weight: 600, h, padX, icon: r.chipIcon, color: chipC, fill: chipFill, stroke: chipStroke, lw: 2 });
    ctx.restore();
    // one ring pulse leaves the chip on the hit (expands 14 px, fades over 8 frames)
    const pk = ui.kf(t, r.tHit, 8 * FR, 'outCubic');
    if (pk > 0 && pk < 1) {
      const gr = 14 * pk;
      ctx.save();
      ctx.beginPath();
      ui.rr(ctx, cx - cw / 2 - gr, r.cy - h / 2 - gr, cw + gr * 2, h + gr * 2, h / 2 + gr);
      ctx.strokeStyle = L.rgba(hue, 0.8 * (1 - pk));
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawTrack(ctx, L, t, tok) {
    const P = L.pal, ui = L.ui;
    // base hair line
    ctx.fillStyle = P.hairHi;
    ctx.fillRect(TRACK.x - 1, TRACK.y0, 2, TRACK.y1 - TRACK.y0);
    // the orange trail: the route the token has been allowed to take
    const ty = clamp(tok.y, TRACK.y0, BARRIER.y);
    if (t >= M1[0] && ty > TRACK.y0) {
      ctx.fillStyle = P.sig;
      ctx.fillRect(TRACK.x - 1.5, TRACK.y0, 3, ty - TRACK.y0);
    }
    // stations at the row centres
    for (let i = 0; i < ROWS.length; i++) {
      const passed = t >= ROWS[i].tHit - 1e-6 && ROWS[i].kind !== 'deny';
      const vis = ui.kf(t, ROWS[i].tIn, 6 * FR);
      if (vis <= 0) continue;
      ctx.save();
      ctx.globalAlpha *= vis;
      ctx.beginPath();
